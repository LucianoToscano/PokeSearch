<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--row:41px;--sprite:45px;--dock:53px;--top-space:0px;--list-limit:430px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent!important;color:#fff;font:10px Roboto,Arial,sans-serif;overflow:hidden}
/* Menus must extend beyond the 34dp toolbar without being clipped. */
html.controls-root,body.controls-window{overflow:visible!important;min-height:100%;}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#shell{position:relative;width:var(--dock);padding-top:0;background:transparent!important;border:0;border-radius:0;box-shadow:none;overflow:visible}
#gear{width:35px;height:30px;margin:0 auto;padding:0;border:1px solid #ffffff42;border-radius:9px;background:#142133f5;color:#e9ecf1;display:flex;align-items:center;justify-content:center}
#gear svg{display:block;width:21px;height:21px;filter:drop-shadow(0 1px 1px #0007)}
#gear.busy svg{animation:gearbusy 1.25s linear infinite}
@keyframes gearbusy{to{transform:rotate(360deg)}}
#menu{display:none;position:absolute;top:0;left:var(--dock);width:396px;height:34px;z-index:3;padding:0 2px;border:0;border-radius:0;background:transparent;box-shadow:none}
#menu.open{display:block}
#choices{display:none;position:absolute;top:34px;left:0;z-index:12;width:166px;padding:5px;background:#151c27f5;border:1px solid #ffffff38;border-radius:10px;box-shadow:0 4px 12px #0008}
#choices.visible{display:block}
body.menu-left #choices{left:auto;right:0}
#choices button{width:100%;display:block;text-align:left;padding:8px 9px;margin:1px 0;border-radius:7px;background:transparent;border:0;color:#e8ebef;font-size:12px;line-height:1.3;white-space:normal}
#choices button.chosen{background:#263f39;color:#a2efd3;font-weight:700}
#choices .choiceHeader{padding:3px 9px 6px;color:#9faabd;font-weight:bold;font-size:10px}
body.menu-left #shell{margin-left:333px}
body.menu-left #menu{left:-333px}
#controls{width:calc(100% - 4px);display:grid;grid-template-columns:34fr 22fr 41fr 20fr 20fr 22fr 22fr 22fr 38fr 22fr 22fr 22fr;grid-auto-rows:30px;gap:2px;padding:0;margin:0;align-items:center}
body.menu-left #controls{direction:rtl}
body.dock-window #menu{display:none!important}
body.dock-window #shell{margin-left:0!important}
body.controls-window #gear,body.controls-window #spawns,body.controls-window #empty,body.controls-window #collapse{display:none!important}
body.controls-window #shell{width:100%!important;margin:0!important;padding:0!important}
body.controls-window #menu{position:relative!important;display:block!important;left:0!important;top:0!important;width:100%!important}
body.controls-window #choices{z-index:10}
#controls button{direction:ltr}
#controls button{height:30px;width:100%;min-width:0;padding:0;background:#151b26e6;border:1px solid #ffffff23;border-radius:5px;font-size:10px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;white-space:nowrap}
#controls button.active{background:#db2d4bdb}
#manualRefresh.requested{background:#225446ee;border-color:#a4ecd4;animation:refreshpulse .8s ease-in-out 2}
@keyframes refreshpulse{50%{opacity:.6}}
#controls #cycle.ivOn{background:#136b3bdf;border-color:#69df97a6;color:#e9fff2}
#gear .gear-icon{display:block}
#gear .close-icon{display:none}
#controls #close{font-size:18px;font-weight:800;color:#ff596c;background:#151b26e6;border-color:#ff596c5c}
#controls #close:active{background:#622735}
#collapse{display:flex;align-items:center;justify-content:center;width:40px;height:32px;margin:5px auto 3px;
 padding:0;border-radius:10px;border:1px solid #b4cbe5bf;background:#152338;color:#f2f8ff;
 box-shadow:0 2px 9px #000c}
#collapse svg{width:22px;height:22px;display:block;pointer-events:none}
#controls #bell.generalOn{background:#1d5b49dc;border-color:#69dbab77;color:#ddfff1}
#controls #star.favoritesOn{background:#70561de0;border-color:#ffe29a77;color:#ffdf74}
#controls #star svg{width:17px;height:17px}
#controls #donate{color:#fa94a7}
#controls #report{color:#ffd674;font-size:16px;font-weight:700}
#controls #location.locOn{background:#1e6150e8;color:#b2ffe0;border-color:#5de7b1a6}
#controls #location.locOn{flex-direction:column;gap:0}
#controls #location.locOn svg{width:12px;height:12px}
#controls #location .locRadiusText{display:none;font-size:8px;line-height:9px;font-weight:800;letter-spacing:-.25px}
#controls #location.locOn .locRadiusText{display:block}
#locBadge{display:none;width:var(--dock);height:14px;padding:0 1px;text-align:center;line-height:13px;font-size:9px;font-weight:800;
 color:#b2ffe0;background:#152b27be;border:1px solid #69d2ad48;border-radius:6px;white-space:nowrap;
 overflow:hidden;pointer-events:none;user-select:none}
#locBadge.active{display:block}
body.controls-window #locBadge{display:none!important}
#choices.locationPanel{width:306px;max-width:calc(100vw - 12px)}
#choices.modePanel{width:232px;max-width:calc(100vw - 12px);height:auto;padding:3px;
 max-height:min(216px,var(--popup-room,400px));overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
#choices.modePanel .choiceHeader{padding:2px 5px 3px}
/* Shiny lives independently as the second icon in the horizontal toolbar. */
#choices .extraDivider{height:1px;margin:5px 3px;background:#ffffff32}
#choices .extraHead{display:flex;align-items:center;justify-content:space-between;width:100%;padding:6px 5px;
 font-weight:700;font-size:11px;border-radius:6px;background:#ffffff0a}
#choices .extraHead .down{font-size:11px;opacity:.8}
#choices .extraField{display:flex;align-items:center;gap:5px;margin:3px 2px;min-height:28px}
#choices .extraField label{min-width:68px;font-size:10px;color:#d6dce4;flex:none}
#choices .extraField button.extraValue{margin:0;flex:1;min-width:0;padding:6px 6px;background:#303743;border:1px solid #ffffff25;
 border-radius:6px;text-align:left;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#choices .extraField input{flex:1;width:100%;min-width:0;height:26px;padding:4px 6px;font-size:11px;color:#fff;
 border:1px solid #ffffff3d;border-radius:5px;background:#151c25}
#choices .extraField input[type=checkbox]{flex:none;width:17px;height:17px;accent-color:#5bba96}
#choices .extraNote{margin:2px 5px 5px;font-size:9px;color:#b7c3d1;line-height:1.25}
#choices .extraValue:disabled{opacity:.5;cursor:default}
/* FILTERS-POGO-01 controls: compact numeric steppers and site-verified chips. */
body.controls-window #choices[data-panel-kind="filters"]{
 width:min(306px,calc(100vw - 12px))!important;
}
#choices .extraNumberRow{display:flex;align-items:center;gap:3px;flex:1;min-width:0}
#choices .extraNumberRow input{height:30px!important;text-align:center;min-width:0}
#choices .extraNumberRow .extraStep{flex:0 0 29px;width:29px;height:29px;min-width:29px;
 margin:0;padding:0;text-align:center;border-radius:6px;border:1px solid #ffffff40;
 background:#2b3848;color:#f0f5ff;font-size:17px}
#choices .extraChipsField{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px}
#choices .extraChipsField>label{width:100%;flex:0 0 100%;font-weight:700}
#choices .extraChipRow{width:100%;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#choices .extraChipRow .extraChip{flex:1 0 35px;min-width:35px;height:30px;
 border-radius:8px;border:1px solid #ffffff36;background:#344052;color:#f1f5fb;
 margin:0;padding:3px 6px;font-size:11px;text-align:center}
#choices .extraChipRow .extraChip.chosen{background:#226bbf!important;
 color:#fff!important;border-color:#9dc8ff!important}
/* FILTERS-POGO-06: two tiny overlay indicators, original 12 slots unchanged. */
body.controls-window #quickMenuList button[data-key="filters"]{position:relative!important}
body.controls-window #quickMenuList button[data-key="filters"].has-extra-filters::after{
 content:attr(data-filter-count);position:absolute;top:0;right:0;z-index:3;
 display:flex;align-items:center;justify-content:center;min-width:10px;height:10px;
 padding:0 1px;border-radius:7px;background:#38485e;color:#fff;
 font:700 8px/10px Arial,sans-serif;line-height:1;pointer-events:none;
}
body.controls-window #quickMenuList button[data-key="filters"].site-filters-applied::before{
 content:"";position:absolute;bottom:2px;right:2px;z-index:3;
 width:4px;height:4px;border-radius:50%;background:#63d29b;pointer-events:none;
}
#choices .extraApplyStatus{margin:6px 4px 4px;font-size:10px;line-height:1.3;
 color:#c7d5e4}
#choices .extraApplyStatus.confirmed{color:#65d6a5}
body.controls-window.visual-light-menu #choices .extraApplyStatus{color:#334961}
body.controls-window.visual-light-menu #choices .extraApplyStatus.confirmed{color:#14583f}
#choices .modeAction.filterActions button{width:33.333%;font-size:10px}
#choices .modeAction.filterActions .filterClear{background:#374050;color:#fff;
 border:1px solid #8794a4}
body.controls-window.visual-light-menu #choices .modeAction.filterActions .filterClear{
 background:#e7edf4;color:#1e354b;border-color:#a4b4c5
}
body.controls-window.visual-light-menu #choices:not(.visualPanel) .extraChipRow .extraChip:not(.chosen),
body.controls-window.visual-light-menu #choices:not(.visualPanel) .extraNumberRow .extraStep{
 background:#eef3f9!important;color:#172533!important;border-color:#96aabe!important}

#choices .modeRow{display:flex;align-items:center;gap:2px;padding:1px 2px;min-height:29px;border-radius:5px}
#choices .modeRow.selected{background:#183b32aa}
#choices .modeRow .modeSelect{flex:1;min-width:0;width:auto;font-size:11px;padding:5px 3px;margin:0}
#choices .modeRow .modeValue{flex:none;min-width:31px;width:auto;padding:5px 3px;margin:0;text-align:center;
 color:#dce9f9;background:#283544;border:1px solid #465a70;border-radius:5px;font-size:11px;white-space:nowrap}
#choices .modeRow .modeValue:focus-visible{outline:1px solid #8de7c9}
#choices .modeAction{display:flex;gap:4px;padding:4px 2px 1px;position:sticky;bottom:0;
 background:#252628f5;z-index:1}
#choices .modeAction button{padding:6px 4px}
#choices .modeAction button{width:50%;margin:0;text-align:center;background:#223448;border:1px solid #415369}
#choices .modeAction .modeApply{background:#17644c;border-color:#50bf94;color:#e0ffee}
#choices .modeHint{display:none}
/* The orange stale-result dot is intentionally hidden. Source provenance and
   accessible stale status remain intact; old cards never become new results. */
#choices .locText{font-size:11px;color:#a9b7c9;padding:0 7px 8px;line-height:1.35}
#choices .locCoordsRow{display:flex;align-items:center;gap:7px;margin:0 7px 7px}
#choices .locCoordsRow .locField{flex:1;min-width:0;margin:0;width:auto}
#choices .locCoordsRow button[role=switch]{flex:none;width:48px;min-height:34px;border:1px solid #51647b;border-radius:9px;background:#283444;color:#c5d1dd;font-size:11px;font-weight:800}
#choices .locCoordsRow button.locActive{background:#146d50;color:#dbffef;border-color:#5fe6ad}
#choices .locCoordsRow button.locPaste{width:29px;min-width:29px;flex:0 0 29px;height:30px;
 padding:2px 0;border:1px solid #ffffff35;border-radius:6px;color:#e3ecf7;background:#343b49e0;font-size:13px}
#choices .locCoordsRow button.locOff{background:#27313e;color:#ffd1a3;border-color:#7e6552}
#choices .locField{box-sizing:border-box;width:calc(100% - 14px);margin:0 7px 8px;min-height:36px;background:#111722;border:1px solid #536174;border-radius:7px;padding:8px;color:#fff;font-size:13px}
#choices input[type=range]{width:calc(100% - 14px);margin:4px 7px 8px;accent-color:#77e4c2;touch-action:pan-x}
#choices .locLine{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 7px;color:#dee6f2;font-size:12px}
#choices .locLine button{width:auto;flex:none;padding:7px 9px;background:#223147;border:1px solid #51647b;border-radius:7px}
#choices .locLine button.locActive{background:#1b674f;border-color:#55d7ac}
#choices .locLine button.locOff{color:#ffcf99}
#choices .locLine button.locSave{color:#a8efd4}
#choices .locLine button.locHide{color:#aabbce}
#choices #locHint{font-size:10px;color:#aec5d6;margin:0 7px 5px;line-height:1.3}
#controls button svg{width:16px;height:16px;display:block;pointer-events:none}
#controls #cycle{font-size:11px;font-weight:800}
#controls #cycle .league{display:inline-flex;gap:2px;align-items:center;justify-content:center}
#controls #cycle .league svg{width:16px;height:16px}
#controls #size{font-size:12px!important;font-weight:800}
#controls button.shinyOn{color:#ffe5a0;background:#564627e9}
#controls button.shinyPending{color:#ffe5a0;background:#201e1bc8;border:1px dashed #dbb65b;opacity:.85}
#actions{display:contents}
#actions button{font-size:16px;font-weight:500}
#period{display:flex;flex-direction:column;gap:1px;line-height:1!important;padding:2px 0!important}
#period .autoLabel{font-size:8px;font-weight:800;letter-spacing:0.25px;opacity:.85}
#period .autoTime{font-size:10px;font-weight:800}
#clock.timerOn{background:#76601ccf;border-color:#ffe5a04d;color:#ffe5a0}
#spawns{width:var(--dock);display:flex;flex-direction:column;align-items:center;gap:0;padding:0;margin:var(--top-space) 0 0;max-height:var(--list-limit);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
#spawns::-webkit-scrollbar{display:none}
.spawn{width:var(--dock);height:var(--spawn-row,var(--row));position:relative;min-height:var(--spawn-row,var(--row));flex:0 0 var(--spawn-row,var(--row));display:flex;align-items:center;justify-content:center;margin:0;padding:0;background:transparent;border:0;border-radius:4px}
.spawn.active .sprite{filter:drop-shadow(0 0 3px #ffffff77)}
.timer{position:absolute;right:0;bottom:0;padding:1px 2px;border-radius:0;background:transparent;color:#fff;font-size:8px;line-height:10px;pointer-events:none;min-width:23px;text-align:center;text-shadow:0 1px 2px #000,0 0 3px #000}
.spawn .ivPct{position:absolute;left:0;bottom:0;z-index:1;max-width:29px;min-width:16px;padding:0;border-radius:0;background:transparent;font:800 8px/10px Roboto,Arial,sans-serif;text-align:center;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000,0 0 3px #000}
.spawn .ivPct.zero{color:#00cfe8}
.spawn .ivPct.low{color:#b8bec8}
.spawn .ivPct.medium{color:#28c76f}
.spawn .ivPct.high{color:#388bff}
.spawn .ivPct.excellent{color:#c084fc}
.spawn .ivPct.perfect{color:#f04b70}
.spawn.expired{opacity:.38}
/* Cooldown is independent of the despawn ticker. */
.spawn .cooldownEta{position:absolute;right:0;top:0;z-index:4;max-width:60px;
 padding:1px 2px;border:1px solid #ffffff45;border-radius:5px;
 background:#242527c9;color:#d7e3dc;font:600 7.5px/10px Roboto,Arial,sans-serif;
 white-space:nowrap;text-shadow:0 1px 2px #0008;pointer-events:none}
.spawn .cooldownEta.estimated{color:#f7d5a1}
.spawn .cooldownEta.unknown{color:#c2c2c6}
.spawn .cooldownEta.finished{color:#a9edc5}
.sprite{display:block;width:var(--sprite);height:var(--sprite);object-fit:contain;flex-shrink:0;pointer-events:none;filter:drop-shadow(0 1px 1px #0006)}
/* UX-SPRITE-01: same centered, transparent square in every fixed-height row. */
.spriteStage{position:relative;display:flex;align-items:center;justify-content:center;width:var(--sprite);height:var(--sprite);flex:0 0 var(--sprite);pointer-events:none}
.spriteStage .sprite{width:100%;height:100%;max-width:100%;max-height:100%;aspect-ratio:1/1;object-fit:contain;object-position:center}
.spriteFallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#bfcbd5;opacity:.65;pointer-events:none;font-size:10px;font-weight:650;letter-spacing:-.3px}
.spriteStage.loaded .spriteFallback{display:none}
.spriteStage.failed .sprite{display:none}
.fallback{font-size:20px}
#empty{display:block;width:var(--dock);height:18px;line-height:18px;text-align:center;color:#dce1e9b8;font-size:12px;overflow:hidden;background:transparent;border:0;padding:0}
#bubble{display:none;width:45px;height:45px;border:0;background:transparent;box-shadow:none;border-radius:0;align-items:center;justify-content:center}
#bubble svg{width:20px;height:20px;color:#e9ecf1;filter:drop-shadow(0 1px 1px #0009)}
/* Original compact PokeSearch toolbar: ALL 12 actions share ONE row.
   Restore earlier sizing and minimal internal spacing; no two-row UI. */
#controls{grid-auto-flow:column}
#controls button{justify-self:stretch;align-self:center;text-align:center}
#controls button:focus-visible{outline:2px solid #f1f1f1;outline-offset:-2px}
#choices{max-width:calc(100vw - 12px);overflow-x:hidden}
#choices.locationPanel{overflow-y:auto}
body.controls-window #menu{min-height:34px}
body.controls-window #choices{top:34px;max-height:var(--popup-room,400px);overflow-y:auto}
body.controls-window #choices.modePanel{max-height:min(216px,var(--popup-room,400px))}
body.controls-window.popup-above #menu{top:var(--popup-offset,0px)!important}
body.controls-window.popup-above #choices{top:auto!important;bottom:34px!important}
/* v0.50: floating transparent icons, neutral and unobtrusive colors. */
#gear{width:35px;height:30px;background:transparent!important;border:0!important;border-radius:0;box-shadow:none!important;color:#f5f5f6}
#gear svg{filter:drop-shadow(0 1px 2px #000c)}
#collapse{width:34px;height:27px;margin:0 auto;padding:0;border:0!important;background:transparent!important;box-shadow:none!important;color:#fafafa}
#collapse svg{width:19px;height:19px;filter:drop-shadow(0 1px 2px #000b)}
#controls button{background:#28292cc6;border-color:#ffffff2d;color:#f2f2f3}
#controls #close{background:#28292cc6}
#choices{background:#252628ee;border-color:#ffffff38}
#choices button.chosen{background:#494b4bdc;color:#fff}
#choices .choiceHeader{color:#d6d7da}
#choices .locText,#choices #locHint{color:#d3d4d6}
#choices .locField{background:#17191bdc;border-color:#96999c88}
#choices .locCoordsRow button[role=switch],#choices .locLine button{background:#37393dc9;border-color:#979a9d60}
#controls #location svg{width:14px;height:14px}
#controls #location.locOn{background:#454c48cf;border-color:#bfc9c1a6;color:#fff}
#controls #location.locOn svg{width:12px;height:12px}
#locBadge{background:#363b3ac4;border-color:#ffffff4a;color:#edf0ef}
#controls #cycle.ivOn{background:#3a5040bd;border-color:#abc3ae;color:#fff}
#controls #bell.generalOn{background:#414649d1;border-color:#b0b6b8;color:#fff}
#controls #bell.generalSilent{background:#48484ac9;border-color:#d2d2d2;color:#e5e5e5}
#controls #bell.permissionMissing{border-color:#ffb25788;color:#ffd2a3}
#controls #period.autoOff{opacity:.73;background:#333538ac}
#spawns{margin-top:var(--top-space);gap:0}
/* One search -> one independent overlay. Preserve the original compact toolbar. */
#resultHeader{display:none}
body.dock-window #spawns,body.dock-window #empty,
body.dock-window #collapse,body.dock-window #locBadge{display:none!important}
body.dock-window #shell{height:30px;overflow:hidden!important}
body.dock-window #bubble{position:absolute;top:0}
body.controls-window #resultHeader{display:none!important}
body.result-window #gear,body.result-window #menu,body.result-window #locBadge,
body.result-window #collapse,body.result-window #bubble{display:none!important}
body.result-window #shell{width:var(--dock);margin:0!important;overflow:hidden}
body.result-window #resultHeader{width:35px;height:30px;display:flex;
 align-items:center;justify-content:center;padding:0;margin:0 auto;border:0;
 border-radius:8px;background:transparent;box-shadow:none}
/* Composition stays inside the original 35x30px touch area and 21px max art. */
body.result-window #resultHeader .resultModeStack{transform:translateY(4px);position:relative;display:block;flex:none;width:var(--mode-icon-size,21px);height:var(--mode-icon-size,21px);max-width:21px;max-height:21px;aspect-ratio:1/1;overflow:visible;pointer-events:none}
body.result-window #resultHeader .resultModeStack img{position:absolute;inset:0;display:block;width:100%;height:100%;aspect-ratio:1/1;object-fit:contain;object-position:center;max-width:none;max-height:none;pointer-events:none;filter:drop-shadow(0 1px 1px #0007)}
body.result-window #resultHeader .modeIndicator{position:absolute;z-index:1;display:none;align-items:center;justify-content:center;box-sizing:border-box;pointer-events:none;font-family:Arial,Roboto,sans-serif;font-weight:900;line-height:1;text-shadow:0 1px 1px #000}
body.result-window #resultHeader .modeIndicator.visible{display:flex}
body.result-window #resultHeader .modeIndicator.value{left:50%;bottom:-2px;max-width:33px;min-width:0;height:10px;padding:0;border-radius:0;background:transparent;color:#16191c;font-size:9px;white-space:nowrap;letter-spacing:-.2px;-webkit-text-stroke:.25px #fff;text-shadow:0 1px 1px #fff,0 0 2px #fff,0 0 3px #fff;transform:translateX(-50%) scale(var(--mode-indicator-scale,1));transform-origin:bottom center}
body.result-window #resultHeader .modeIndicator.value.zero{color:#00cfe8}

// All 18 original artworks from Google Drive/03_Icones_Ligas.
// These describe the CURRENT search; they do not activate unavailable filters.
const RESULT_ICONS=Object.freeze({
 none:{normal:"none.png",shiny:"none-shiny.png",title:"Sem filtro"},
 custom:{normal:"custom.png",shiny:"custom-shiny.png",title:"IV personalizado"},
 percent:{normal:"percent.png",shiny:"percent-shiny.png",title:"IV por porcentagem"},
 hundo:{normal:"hundo.png",shiny:"shundo.png",title:"IV 100%"},
 nundo:{normal:"nundo.png",shiny:"shnundo.png",title:"IV 0%"},
 gl:{normal:"great-league.png",shiny:"great-league-shiny.png",title:"Grande Liga"},
 ul:{normal:"ultra-league.png",shiny:"ultra-league-shiny.png",title:"Ultra Liga"},
 ml:{normal:"master-league.png",shiny:"master-league-shiny.png",title:"Liga Mestra"},
 cup:{normal:"cup-league.png",shiny:"cup-league-shiny.png",title:"Liga Copa"}
});
// Six bases, five submitted arts. Cup uses the neutral base + distinct CUP badge.
// The 18 historic PNGs above remain unchanged as rollback/fallback assets.
const RESULT_BASE_ICONS=Object.freeze({
 none:"base-none.png",custom:"base-custom.png",
 gl:"base-gl.png",ul:"base-ul.png",ml:"base-ml.png"
});
const RESULT_MODE_ALIASES=Object.freeze({
 iv:"hundo",iv100:"hundo",hundo:"hundo",shundo:"hundo",
 iv0:"nundo",nundo:"nundo",shnundo:"nundo",
 raw:"custom",custom:"custom",personalizado:"custom",
 percent:"percent",percentage:"percent",porcentagem:"percent",
 nofilter:"none",none:"none",all:"none",sem_filtro:"none",
 gl:"gl",great:"gl",great_league:"gl",
 ul:"ul",ultra:"ul",ultra_league:"ul",
 ml:"ml",master:"ml",master_league:"ml",
 cup:"cup",cup_league:"cup",little_cup:"cup"
});
// Purely a tiny menu glyph for IV% SEARCH RANGES, not a Pokémon appraisal.
// Official appraisals by total IV points: 0*=0–22, 1*=23–29,
// 2*=30–36, 3*=37–45 (45/45 has a special perfect style).
// A mixed range spans multiple appraisal bands; the broad-range glyph
// is a search shorthand, not a claim that every result has N stars.
function modePercentStarCount(minValue,maxValue){
 // Only one appraisal class when ALL possible IV totals within the filter
 // map to the same class. Mixed or impossible ranges use the neutral % art.
 const min=Number(minValue),max=Number(maxValue);
 if(!Number.isFinite(min)||!Number.isFinite(max)||min<0||max>100||min>max)return -1;
 const categories=new Set();
 for(let total=0;total<=45;total++){
  const percent=Math.round(100*total/45);
  if(percent<min||percent>max)continue;
  categories.add(total<=22?0:total<=29?1:total<=36?2:3);
 }
 return categories.size===1?[...categories][0]:-1;
}
function getModeMenuIcon(searchMode,shinyActive,settings=searchSettings){
 const modeKey=String(searchMode==null?"":searchMode).trim().toLowerCase().replace(/[\s-]+/g,"_");
 let family=RESULT_MODE_ALIASES[modeKey]||"none";
 if(modeKey==="raw"){
  const {attack,defense,stamina}=settings;
  if([attack,defense,stamina].every(v=>Number(v)===15))family="hundo";
  else if([attack,defense,stamina].every(v=>Number(v)===0))family="nundo";
 }
 if(modeKey==="percent"){
  const min=Number(settings.percentMin),max=Number(settings.percentMax);
  if(min===0&&max===0)family="nundo";
  else if(min===100&&max===100)family="hundo";
 }
 const pair=RESULT_ICONS[family];
 const shining=!!shinyActive;
 const baseFamily=["hundo","nundo","percent"].includes(family)?"custom":family;
 const baseName=RESULT_BASE_ICONS[baseFamily]||RESULT_BASE_ICONS.none;
 const topN=baseFamily==="gl"?Number(settings.glRank):baseFamily==="ul"?Number(settings.ulRank):0;
 const rankLabel=Number.isInteger(topN)&&topN>=1&&topN<=50?"#"+topN:"";
 const badge=(family==="gl"||family==="ul")?rankLabel:baseFamily==="cup"?"CUP":"";
 const backgroundConfirmed=!!(settings&&settings.backgroundOnly===true&&settings.backgroundVerified===true);
 // These seven ORIGINAL transparent PNGs are ONLY for the Modos toolbar.
 const starCount=modePercentStarCount(settings.percentMin,settings.percentMax);
 const modePath={
  hundo:"3Star.png",nundo:"0Star.png",
  gl:"StarGL.png",ul:"StarUL.png",
  custom:"StarIVRaw.png",percent:starCount<0?"StarIVRaw.png":starCount+"Star.png",none:"iv-unfiltered.svg"
 };
 const legacyFallback={
  hundo:"iv-three-stars.png",nundo:"iv-zero-stars.png",
  gl:"gl-triangle.png",ul:"ul-triangle.png",
  custom:"iv-custom.svg",percent:"iv-percent.svg",none:"iv-unfiltered.svg"
 };
 return {
  path:modePath[family]?"file:///android_asset/result-icons/modes/"+modePath[family]:
     "file:///android_asset/result-icons/base/"+baseName,
  fallbackPath:legacyFallback[family]?"file:///android_asset/result-icons/modes/"+legacyFallback[family]:
    "file:///android_asset/result-icons/base/"+baseName,
  title:pair.title+
    (modeKey==="percent"?" · "+settings.percentMin+"–"+settings.percentMax+"%":
     modeKey==="raw"?" · "+settings.attack+"/"+settings.defense+"/"+settings.stamina:"")+
    (shining?" · Shiny only":"")+(backgroundConfirmed?" · Background":""),
  family,baseFamily,ivBadge:badge,

// Broken remote image URLs and 1px placeholders must not leave invisible rows.
// LT64: the site's offscreen lazy sprites can arrive after the list appears.
// Retry bounded image failures in-place; never rerender cards or touch Search.
function attachSpriteFeedback(){
 document.querySelectorAll(".spawn .spriteStage").forEach(stage=>{
  const img=stage.querySelector("img.sprite");
  if(!img){stage.classList.add("failed");return;}
  let retries=0,done=false,mirrorAttempted=false,nativeTried=false;
  const spawnNode=stage.closest?.(".spawn")||stage.parentElement;
  const currentIndex=Number(spawnNode?.getAttribute?.("data-index")??-1);
  const sourceCard=Number.isInteger(currentIndex)&&currentIndex>=0?cards[currentIndex]:null;
  const tryExactBundled=()=>{
   if(nativeTried)return false;
   nativeTried=true;
   const engine=typeof window!=="undefined"?window.PokeSearchOfflineSprite:null;
   const exact=engine?.verifiedBundledData?.(sourceCard)||
      (sourceCard?engine?.exactBundledData?.(engine.resolve(sourceCard)):"")||"";
   if(exact&&img.src!==exact){img.src=exact;return true;}
   return false;
  };
  const good=()=>img.naturalWidth>=8&&img.naturalHeight>=8;
  const loaded=()=>{
   if(good()){
    done=true;stage.classList.remove("failed");stage.classList.add("loaded");
    if(typeof window!=="undefined")window.PokeSearchSpriteScale?.apply?.(img);
   }
   else failed();
  };
  const failed=()=>{
   if(done||!img.isConnected)return;
   // Deterministic identity-checked bytes from the bundled APK beat fragile
   // Samsung WebView file and remote image retries for ordinary species.
   if(tryExactBundled())return;
   const original=img.getAttribute("data-original-src")||"";
   // Exact, verified PokeAPI base sprite path only. Never guess a different
   // sprite for forms, shadows, costumes or a provider-supplied image URL.
   const match=/^https:\/\/raw\.githubusercontent\.com\/PokeAPI\/sprites\/master\/sprites\/pokemon\/((?:shiny\/)?[0-9]{1,4}\.png)$/.exec(original);
   // Full species/form GO icon has an immutable mirrored asset. Retry
   // that exact icon immediately; no generic base or different-colour swap.
   if(!mirrorAttempted&&/^https:\/\/cdn\.jsdelivr\.net\/gh\/PokeMiners\/pogo_assets@c2a686eb08ace6e890d8fe3d2134c76988db87b5\//.test(original)){
    mirrorAttempted=true;img.src=original;return;
   }
   if(match&&!mirrorAttempted){
    mirrorAttempted=true;
    img.src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/"+match[1];
    return;
   }
   if(retries>=1){stage.classList.remove("loaded");stage.classList.add("failed");return;}
   retries++;
   setTimeout(()=>{
    if(!done&&img.isConnected&&original)img.src=original;
   },650);
  };
  img.addEventListener("load",loaded);
  img.addEventListener("error",failed);
  // A completed but zero-dimension file:// image may have failed before
  // listeners were attached. Retry its verified original immediately.
  if(img.complete){if(good())loaded();else failed();}
  // Some Samsung WebViews leave an Image in "loading" state for seconds,
  // without firing error. Switch only the verified static PokeAPI base URL
  // to its equivalent CDN mirror after a bounded grace period.
  const original=img.getAttribute("data-original-src")||"";
  const known=/^https:\/\/raw\.githubusercontent\.com\/PokeAPI\/sprites\/master\/sprites\/pokemon\/((?:shiny\/)?[0-9]{1,4}\.png)$/.exec(original);
  setTimeout(()=>{
   if(!done&&img.isConnected&&!good())tryExactBundled();
  },1700);
  if(known)setTimeout(()=>{
   if(!done&&img.isConnected&&!mirrorAttempted&&!good()){
    mirrorAttempted=true;
    img.src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/"+known[1];
   }
  },4500);
  // An unanswered CDN request must not leave a blank sprite forever.
  // Final retry uses ONLY this card's original verified/provider URL.
  setTimeout(()=>{
   if(done||!img.isConnected)return;
   if(good()){loaded();return;}
   if(retries>=2||!original){stage.classList.add("failed");return;}
   retries=2;stage.classList.remove("failed");
   img.src=original;
  },12000);
  // After all bounded attempts, make the existing neutral placeholder visible.
  setTimeout(()=>{
   if(!done&&img.isConnected&&!good()){
    stage.classList.remove("loaded");stage.classList.add("failed");
   }
  },18500);
 });
}

/* PvPoke overall is a snapshot of species-performance ranks, never IV ranks.
   An ambiguous species, Shadow, regional form or missing league has no number. */
const PVPOKE_OVERALL=window.POKESEARCH_PVPOKE_OVERALL||null;
function speciesKey(value){

  .replace(/[♀]/g," female ").replace(/[♂]/g," male ")
  .replace(/\s+/g," ").trim().toLowerCase();

const overallRankByLeague={gl:new Map(),ul:new Map(),ml:new Map()};
if(PVPOKE_OVERALL){
 for(const league of ["gl","ul","ml"]){
  for(const entry of PVPOKE_OVERALL[league]||[]){
   const [id,name,rank]=entry;
   if(!id||!name||!Number.isInteger(rank)||rank<1)continue;
   const key=speciesKey(name);
   // Exact name and form only. A collision is ambiguous and stays hidden.
   if(overallRankByLeague[league].has(key))overallRankByLeague[league].set(key,null);
   else overallRankByLeague[league].set(key,rank);
  }

}
// Separate appearance from battle form: costumes can reuse the base

// Require independently verified species number/name, not fuzzy names alone.
function cosmeticPvpIdentity(card){

 if(!card||engine?.verifiedSpeciesIdentity?.(card)!==true)return false;
 const key=speciesKey(card.name),form=speciesKey(card.form).replace(/[^a-z0-9]/g,"");
 const variant=speciesKey(card.variant),region=speciesKey(card.region);
 const costume=speciesKey(card.costume);
 const evidence=[form,variant,region,costume].join(" ").replace(/[^a-z0-9 ]/g,"");
 const blocked=/(alola|galar|hisui|paldea|mega|primal|dynamax|gigantamax|gmax|shadow|purified|origin|therian|incarnate|altered|attackform|defenseform|speedform|zen|blade|shield|fused|fusion|dusk|dawn|blackkyurem|whitekyurem)/;
 if(blocked.test(evidence))return false;

 // Independently verified appearance-only pairs from PokéAPI/GO.
 const seasons=(dex===585||dex===586)&&/^(spring|summer|autumn|winter)$/.test(form);
 const seas=(dex===422||dex===423)&&/^(west|westsea|east|eastsea)$/.test(form);
 const appearance=(dex===676)&&/^(natural|heart|star|diamond|debutante|matron|dandy|lareine|kabuki|pharaoh)$/.test(form);
 if(seasons||seas||appearance)return true;
 const costumeTag=/(halloween|costume|holiday|christmas|santa|hat|tophat|cartola|goggles|flowercrown|partyhat|fashionweek|pikachuhat|copy2019|fall2023|outfit)/;
 if(costumeTag.test(evidence))return true;

function safePvpSpeciesKey(card){

 const form=speciesKey(card.form);
 const flags=[card.region,card.variant,card.isShadow===true?"shadow":"",
  card.isPurified===true?"purified":""].map(speciesKey).join(" ");
 const dangerous=/(alola|galar|hisui|paldea|mega|primal|shadow|purified|origin|therian|gmax|gigantamax)/.test(flags);
 // A correctly represented named variant (e.g. Vulpix (Alolan))
 // resolves through its OWN gamemaster entry, never Vulpix base.
 if(dangerous&&!/( \((?:alolan|galarian|hisuian|paldean|shadow|purified|mega|primal)\))/.test(key))return null;

}
function verifiedOverallRank(card,league){

}

/* Species-specific IV stat-product ranking: CP 1500/2500, max level 50,
   no best buddy. Based on PvPoke game master species stats and CPMs.
   Distinct from PvPoke's overall species-performance ranking. */
const PVP_IV_GAME_MASTER=window.POKESEARCH_PVP_IV_DATA||null;

if(PVP_IV_GAME_MASTER&&Array.isArray(PVP_IV_GAME_MASTER.pokemon)){
 for(const data of PVP_IV_GAME_MASTER.pokemon){
  const [id,name,atk,def,hp]=data;
  if(!id||!name||![atk,def,hp].every(v=>Number.isInteger(v)&&v>0))continue;
  const key=speciesKey(name);
  if(ivSpeciesByName.has(key))ivSpeciesByName.set(key,null);
  else ivSpeciesByName.set(key,[id,atk,def,hp]);

}
function computeSpeciesIvRanks(species,league){
 const cpms=PVP_IV_GAME_MASTER?.cpms||[];
 if(cpms.length<99)return null;
 const cpCap=league==="gl"?1500:league==="ul"?2500:league==="ml"?Infinity:0;
 if(!cpCap)return null;
 const [,atk0,def0,hp0]=species;
 const cpmSquared=cpms.map(c=>c*c),scores=[];
 // Enumerate all 4096 IV spreads, finding the best permitted half-level.
 for(let a=0;a<16;a++){
  const atk=atk0+a;
  for(let d=0;d<16;d++){
   const def=def0+d;
   for(let h=0;h<16;h++){
    const hp=hp0+h,cpScale=atk*Math.sqrt(def*hp)/10;
    let low=0,high=cpms.length-1,best=-1;
    while(low<=high){
     const mid=(low+high)>>1;
     const cp=Math.max(10,Math.floor(cpScale*cpmSquared[mid]));
     if(cp<=cpCap){best=mid;low=mid+1;}else high=mid-1;
    }
    if(best<0)continue;
    const cpm=cpms[best],hpBattle=Math.max(10,Math.floor(hp*cpm));
    const product=atk*def*hpBattle*cpmSquared[best];
    const cp=Math.max(10,Math.floor(cpScale*cpmSquared[best]));
    scores.push([a*256+d*16+h,product,best,cp]);
   }
  }
 }
 if(!scores.length)return null;

  order[index]=position+1;
  quality[index]=Math.min(10000,Math.round(10000*product/maximum));
  bestLevels[index]=levelIndex;
  bestCps[index]=cp;

}
function calculatedSpeciesIvRank(card,league){

 // A percentage without raw A/D/H is not enough to rank an IV spread.
 const iv=String(card?.iv??"").trim();
 if(!/^(?:[0-9]|1[0-5])\/(?:[0-9]|1[0-5])\/(?:[0-9]|1[0-5])$/.test(iv))return null;
 if(verifiedSpawnIvPercent(card)===null)return null;

 const species=ivSpeciesByName.get(keyName);

  speciesIvRanksCache.set(key,computeSpeciesIvRanks(species,league));

// Reuse the original IV across the entire reachable evolution line; no site writes.

 if(!card||!["gl","ul","ml"].includes(league)||verifiedSpawnIvPercent(card)===null)return [];
 if(cosmeticPvpIdentity(card))return []; // Costume evolutions are not automatically legal.
 const full=safePvpSpeciesKey(card);
 if(!full||!ivSpeciesByName.has(full))return [];
 const match=full.match(/ \(([^()]+)\)$/),variant=match?match[1]:"";
 if(variant&&variant!=="shadow")return [];
 const root=variant?full.slice(0,-match[0].length):full;
 const candidates=[],queue=[root],visited=new Set([root]);
 while(queue.length&&visited.size<=64){
  const parent=queue.shift();
  for(const target of pvpEvolutionGraph.get(parent)||[]){
   const base=speciesKey(target),lookup=base+(variant?" (shadow)":"");
   if(visited.has(base))continue;
   visited.add(base);
   if(!ivSpeciesByName.has(lookup))continue;
   queue.push(base);
   const evolved={name:variant?target+" (Shadow)":target,iv:card.iv,ivPercent:card.ivPercent};
   const detail=calculatedSpeciesIvDetail(evolved,league);
   if(!detail)continue;
   let eligible=null,currentCp=null;
   const level=Number(card.level),iv=String(card.iv).split("/").map(Number);
   const cpms=PVP_IV_GAME_MASTER?.cpms||[];
   const idx=Math.round((level-1)*2);
   if(Number.isFinite(level)&&level>=1&&level<=50&&
      Math.abs((level-1)*2-idx)<0.001&&cpms[idx]){
    const [,at,de,hp]=ivSpeciesByName.get(lookup),cpm=cpms[idx];
    currentCp=Math.max(10,Math.floor((at+iv[0])*Math.sqrt((de+iv[1])*(hp+iv[2]))*cpm*cpm/10));
    const cap=league==="gl"?1500:league==="ul"?2500:Infinity;

   candidates.push({...detail,name:evolved.name,eligible,currentCp});

function updateTimers(){
 // A visible zero is an independent signal to native, not just an opacity class.
 let newlyExpired=false;
 document.querySelectorAll(".timer").forEach(e=>{
  const deadline=Number(e.dataset.deadline),seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));
  e.textContent=Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0");
  // Timer can be inside the narrow metadata column; expire the whole sprite row.
  e.closest(".spawn")?.classList.toggle("expired",seconds===0);
  if(seconds===0&&!e.dataset.expiryReported){e.dataset.expiryReported="1";newlyExpired=true;}
 });
 document.querySelectorAll(".cooldownEta[data-until]").forEach(el=>{
  const until=Number(el.dataset.until);
  if(!Number.isFinite(until))return;
  const seconds=Math.max(0,Math.ceil((until-Date.now())/1000));
  const engine=window.PokeSearchCooldown;
  el.textContent=seconds===0?"✓ 00:00":"⏳ "+(engine?engine.format(seconds):"--:--");
  el.classList.toggle("finished",seconds===0);
 });
 if(newlyExpired&&Native.expiredResults)Native.expiredResults();
}

// Long press never sends manual refresh, including Android synthesized click.
function bindRefreshGesture(button){

 const cancel=()=>{if(hold!==null){clearTimeout(hold);hold=null;}};
 const open=()=>{cancel();if(longTriggered)return;
  longTriggered=true;if(choiceOpen==="period")closeChoices();else toggleChoices("period");};
 button.addEventListener("pointerdown",e=>{
  if(e.button!==0)return;
  cancel();longTriggered=false;pressed=true;x=e.clientX;y=e.clientY;
  hold=setTimeout(open,600);
 });
 button.addEventListener("pointermove",e=>{
  if(pressed&&Math.hypot(e.clientX-x,e.clientY-y)>11){cancel();pressed=false;}
 });
 button.addEventListener("pointerup",()=>{cancel();pressed=false;});
 button.addEventListener("pointercancel",()=>{cancel();pressed=false;});
 button.addEventListener("contextmenu",e=>{e.preventDefault();e.stopPropagation();open();});
 button.onclick=e=>{
  if(longTriggered){e.preventDefault();e.stopPropagation();longTriggered=false;return;}
  manualRefreshTap();
 };
}

// Site -> App, safely limited to single-choice values actually observable
// in the real form. Multi-size/Form and numeric fields need independent DOM
// verification and are NEVER guessed from exported saved-filter JSONs.
const SITE_SINGLE_CHOICES=Object.freeze({
 sortBy:["Despawn (longest)","CP (highest)","IV % (highest)","Level (highest)","Distance (nearest)"],
 weather:["Any","Boosted","Sunny","Rainy","Partly Cloudy","Cloudy","Windy","Snow","Fog"],
 gender:["Any","Male","Female","Genderless"]
});
function verifiedSiteSingleFilterValues(){
 const selected={};
 for(const [key,allowed] of Object.entries(SITE_SINGLE_CHOICES)){
  const field=filterOptions[key];
  if(!field||field.present!==true||field.disabled===true||typeof field.value!=="string")continue;
  const actual=field.value.trim();
  const match=allowed.find(v=>v.toLowerCase()===actual.toLowerCase());
  if(match)selected[key]=match==="Any"?"":match;
 }
 return selected;
}
function renderFiltersChoices(){
 if(!modeDraft)modeDraft={...searchSettings,mode};
 const panel=uxPanel("FILTROS");
 panel.querySelector(".choiceHeader")?.remove(); // same rail as Modos
 // The old standard/mode panel classes forced a broad opaque backing and
 // collided with the narrow native cascade CSS.
 panel.classList.remove("modePanel","standardPanel");
 const scrollRestoration=modeScrollTop;
 const make=(tag,cls,value)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e;};
 panel.classList.add('filterCascade');
 renderExtraFilters(panel,make);
 const indicator=make("div","extraApplyStatus","");indicator.id="filterStatus";
 panel.appendChild(indicator);
 updateFiltersPanelStatus();
 // Inform about verified external changes; importing never calls native
 // Search until the user explicitly presses the existing ✓ Aplicar button.
 // LT85: no recurring obsolete site-import banner.
 // All filters are editable and explicitly confirmed in this panel.
 // No redundant instructional paragraph: keep the filter popup compacto.
 const actions=make("div","modeAction filterActions filterRailActions");
 actions.setAttribute("role","group");actions.setAttribute("aria-label","Ações dos filtros");
 const apply=makeDockAction("apply","Aplicar filtros");
 const clear=makeDockAction("clear","Limpar filtros");
 const cancel=makeDockAction("cancel","Cancelar alterações");
 for(const btn of [apply,clear,cancel])btn.classList.add("filterIconAction");
 apply.onclick=()=>{
  // DISTANCE is defined by the provider only with center and radius; do
  // not silently accept a sort that the site cannot reproduce.
  if(modeDraft.sortBy==="Distance (nearest)"&&!(locationEnabled&&locationVerified)){
   // Stale Distance sort is not a reason to reject new Sexo/Tamanho/PC.
   // Preserve all other draft filters, reset only this unavailable sort.
   modeDraft.sortBy="Despawn (longest)";
   if(Native.filterDistanceNotice)Native.filterDistanceNotice();
  }
  // Reject invalid bounds before saving them or submitting anything to the site.
  for(const input of panel.querySelectorAll("input[data-filter-number]")){
   if(input.value.trim()!==""&&!input.checkValidity()){
    input.reportValidity();return;
   }
  }
  // A hidden editor is still an active draft: validate all numeric fields.
  const numericBounds=[
   ["cpMin","PC",0,99999],["cpMax","PC",0,99999],
   ["levelMin","Nível",1,50],["levelMax","Nível",1,50],
   ["minPvpCp","PC mínimo PvP",0,99999]
  ];
  const invalidNumber=(key,focus,message)=>{
   filterFocus=focus;renderFiltersChoices();
   const input=document.querySelector('#choices [data-filter-number="'+key+'"]');
   if(input){input.setCustomValidity(message);input.reportValidity();}
  };
  for(const [key,focus,min,max] of numericBounds){
   if(key==="minPvpCp"&&!["gl","ul"].includes(modeDraft.mode))continue;
   const raw=String(modeDraft[key]??"").trim();
   if(raw!==""&&(!/^[0-9]+$/.test(raw)||!Number.isSafeInteger(Number(raw))||
    Number(raw)<min||Number(raw)>max)){
    invalidNumber(key,focus,"Digite um número de "+min+" a "+max);return;
   }
  }
  // The same min/max range checks apply to GL, UL, Raw IV and IV%.
  for(const [lowKey,highKey] of [["cpMin","cpMax"],["levelMin","levelMax"]]){
   const low=String(modeDraft[lowKey]??""),high=String(modeDraft[highKey]??"");
   if(low!==""&&high!==""&&Number(low)>Number(high)){
    invalidNumber(lowKey,lowKey.startsWith("cp")?"PC":"Nível","Min não pode ultrapassar Max");return;
   }
  }
  const delta={};
  for(const key of FILTERS_MENU_KEYS){
   const desired=modeDraft[key]??(key.endsWith("Selections")?[]:"");
   const previous=searchSettings[key]??(key.endsWith("Selections")?[]:"");
   if(JSON.stringify(desired)!==JSON.stringify(previous))delta[key]=desired;
  }
  if((modeDraft.includePreviousEvolutions!==false)!==(searchSettings.includePreviousEvolutions!==false))
   delta.includePreviousEvolutions=modeDraft.includePreviousEvolutions!==false;
  closeChoices();
  // Only changed fields are patched. IV, species, shiny and location survive.
  Native.patchSearchFilters(JSON.stringify(delta));
 };
 clear.onclick=()=>{
  const delta={};
  for(const key of FILTERS_MENU_KEYS)
   delta[key]=key.endsWith("Selections")?[]:key==="sortBy"?"Despawn (longest)":"";
  delta.includePreviousEvolutions=true;
  closeChoices();Native.patchSearchFilters(JSON.stringify(delta));
 };
 cancel.onclick=closeChoices;actions.append(apply,clear,cancel);
 const rail=panel.querySelector(".filterCascadeRail"),editor=panel.querySelector(".filterCascadeEditor");
 // LT62: the three icon-only commands previously existed in memory but
 // were never appended to the DOM, so the user could not tap them.
 if(rail)rail.appendChild(actions);
 // The ✓ within each numeric editor remains separate and unchanged.
 if(editor){
  editor.appendChild(indicator);
  for(const child of [...panel.children].filter(child=>child.classList.contains("uxNote")))editor.appendChild(child);
 }
 fit();
}

  (cooldownState.enabled?"ligado":"desligado"));

  "Mostrar ou ocultar estimativa de cooldown nos resultados":

 const visibilityKeys=options.map(entry=>entry[0]);

 const allButton=document.createElement("button");allButton.type="button";

// Only movable commands are traversed by order arrows. Shiny and protected
// controls keep their fixed semantics; visible moves skip hidden/protected slots.
function movableMenuIds(){
 return quickPrefs.order.filter(id=>QUICK_ACTIONS.some(action=>action[0]===id)&&
  !["close","appearance","sh"].includes(id));
}
function moveMenuCommand(id,direction){
 const movable=movableMenuIds(),index=movable.indexOf(id),other=movable[index+direction];
 if(index<0||!other)return false;
 const a=quickPrefs.order.indexOf(id),b=quickPrefs.order.indexOf(other);
 if(a<0||b<0)return false;
 [quickPrefs.order[a],quickPrefs.order[b]]=[quickPrefs.order[b],quickPrefs.order[a]];
 saveQuickPrefs();return true;
}

 mode:"Modos",filters:"Filtros",location:"Local",pokemon:"Pokémon",
 star:"Favoritos",bell:"Alertas",period:"Atualizar",report:"Reportar",donate:"Apoiar"
});

 const panel=uxPanel("PERSONALIZAÇÃO");panel.classList.add("appearanceCompact");
 const scrollRestoration=appearanceScrollTop;
 const shortcuts=document.createElement("div");shortcuts.className="appearanceLinks";
 const link=(name,id)=>{
  const button=document.createElement("button");button.type="button";
  button.textContent=name;button.setAttribute("aria-label","Abrir "+name);
  button.onclick=()=>toggleChoices(id);shortcuts.appendChild(button);
 };
 link("Info Pokémon","info");link("Editor Visual","visual");
 panel.appendChild(shortcuts);
 renderSpriteSizeButtons(panel);
 const heading=document.createElement("div");heading.className="uxSubheading";heading.textContent="Menus";
 panel.appendChild(heading);
 const commands=document.createElement("div");commands.className="appearanceCommands";
 commands.setAttribute("role","group");commands.setAttribute("aria-label","Mostrar, ocultar e organizar menus");
 const movable=movableMenuIds();
 for(const id of movable){
  const action=QUICK_ACTIONS.find(entry=>entry[0]===id);
  const line=document.createElement("div");line.className="uxAdjust";
  line.dataset.key=id;
  const name=document.createElement("span");name.className="commandName";
  name.textContent=APPEARANCE_SHORT_NAMES[id]||action[2];
  name.title=action[2];line.appendChild(name);
  const hidden=quickPrefs.hidden.includes(id);
  const locked=false; // LT68: Atualizar may be hidden and restored like other movable menus.
  const eye=document.createElement("button");eye.type="button";
  eye.textContent=hidden?"□":"☑";eye.className="orderVisibility";
  eye.disabled=locked;eye.setAttribute("aria-pressed",String(!hidden));
  eye.setAttribute("aria-label",locked?action[2]+" (sempre visível)":
   (hidden?"Mostrar ":"Ocultar ")+action[2]);
  eye.onclick=()=>{if(locked)return;appearanceScrollTop=panel.scrollTop;
   quickPrefs.hidden=hidden?quickPrefs.hidden.filter(x=>x!==id):[...quickPrefs.hidden,id];
   saveQuickPrefs();renderAppearanceChoices();};
  const i=movable.indexOf(id);
  const up=document.createElement("button");up.type="button";up.textContent="↑";
  up.className="orderUp";up.disabled=i===0;
  up.setAttribute("aria-label","Mover "+action[2]+" para cima");

   if(moveMenuCommand(id,-1))renderAppearanceChoices();};

  down.className="orderDown";down.disabled=i===movable.length-1;

  down.onclick=()=>{appearanceScrollTop=panel.scrollTop;
   if(moveMenuCommand(id,1))renderAppearanceChoices();};
  line.append(eye,up,down);commands.appendChild(line);
 }
 panel.appendChild(commands);
 requestAnimationFrame(()=>{if(choiceOpen==="appearance"&&panel.isConnected)panel.scrollTop=scrollRestoration;});
 fit();
}
