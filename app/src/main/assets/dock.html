<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--row:41px;--sprite:45px;--dock:53px;--top-space:0px;--list-limit:430px}

.spawn{width:var(--dock);height:var(--row);position:relative;min-height:var(--row);flex:0 0 var(--row);display:flex;align-items:center;justify-content:center;margin:0;padding:0;background:transparent;border:0;border-radius:4px}

<script>
const controlsWindow=window.location.search.indexOf("controls=1")!==-1;
const matchedGroup=window.location.search.match(/[?&]group=([0-2])(?:&|$)/);
const groupWindow=!!matchedGroup;
const groupId=groupWindow?Number(matchedGroup[1]):-1;
let groupCollapsed=false,showLevel=false,showCp=false,showIv=false,showSpawnCount=true;
function toggleOwnGroup(){
 if(!groupWindow)return;
 groupCollapsed=!groupCollapsed;
 document.body.classList.toggle("group-folded",groupCollapsed);
 document.querySelector("#groupHeader .groupFold").textContent=groupCollapsed?"⌄":"⌃";
 fit();
}
document.body.classList.add(groupWindow?"group-window":controlsWindow?"controls-window":"dock-window");
document.documentElement.classList.toggle("controls-root",controlsWindow);
let locationEnabled=false,locationCoords="",locationRadius=0;
let multiEnabled=false,showToolbarText=true,collapsedGroups=new Set(),searchProfiles=[];
let resultsOrientation="vertical",resultsBackground=12;
let searchOptions={rankMax:1,customIvEnabled:false,ivA:0,ivD:15,ivH:15,showRanks:true,cpMin:"",cpMax:"",levelMin:"",levelMax:"",weather:"",size:"",form:"",gender:""};
let cards=[],active=-1,mode="iv",shiny=false,shinyPending=false,status="",row=46,menuOpen=false,choiceOpen="",period=5,spriteSize=45,showTimers=true,showRanks=true,rankMax=1,customIv=false,customText='',hiddenControls='',menuOrientation='vertical',generalAlerts=false,hasFavorites=false,alertMode="off";
function setMenuOpen(open,side,pad){
 menuOpen=!!open;
 document.documentElement.style.setProperty("--top-space",menuOpen?(Math.max(0,Number(pad)||0)+"px"):"0px");
 document.body.classList.toggle("menu-open",menuOpen);
 document.getElementById("menu").classList.toggle("open",menuOpen);
 document.getElementById("gear").setAttribute("aria-expanded",String(menuOpen));
 document.getElementById("gear").setAttribute("aria-label",menuOpen?"Recolher opções":"Abrir opções");
 if(!menuOpen){closeChoices();document.body.classList.remove("menu-left");}
 else if(side)document.body.classList.toggle("menu-left",side==="left");
}
window.syncMenu=(open,side,pad)=>{setMenuOpen(open,side,pad);fit();};
let lastHeight=0;
let fitPending=false;
function fit(){if(fitPending)return;fitPending=true;requestAnimationFrame(()=>{fitPending=false;
 const shell=document.getElementById("shell");
 let h=Math.ceil(shell.getBoundingClientRect().height)+1;
 if(controlsWindow)h=Math.max(34,Math.ceil(document.getElementById("controls").getBoundingClientRect().height)+4);
 if(groupWindow){
  h=Math.ceil(document.getElementById("groupHeader").getBoundingClientRect().height)+2;
  if(!groupCollapsed)h+=Math.ceil(document.getElementById("spawns").getBoundingClientRect().height);
 }
 if(controlsWindow&&choiceOpen&&menuOpen){
  const popup=document.getElementById("choices");
  h=Math.max(h,Math.ceil(popup.getBoundingClientRect().bottom-shell.getBoundingClientRect().top)+6);
 }
 if(Math.abs(h-lastHeight)>1){lastHeight=h;if(controlsWindow)Native.resizeMenu(h);else if(groupWindow)Native.resizeGroup(groupId,h);else Native.resize(h);}
});}
function closeChoices(){
 choiceOpen="";
 document.getElementById("choices").classList.remove("visible");
 document.getElementById("cycle").setAttribute("aria-expanded","false");
 document.getElementById("period").setAttribute("aria-expanded","false");
 document.getElementById("location").setAttribute("aria-expanded","false");
 document.getElementById("filters").setAttribute("aria-expanded","false");
 document.getElementById("eye").setAttribute("aria-expanded","false");
 document.getElementById("bell").setAttribute("aria-expanded","false");
 document.getElementById("appearance").setAttribute("aria-expanded","false");
 document.getElementById("choices").classList.remove("locationPanel","filtersPanel","infoPanel","modePanel","appearancePanel","advancedPanel");
 if(controlsWindow){Native.locationEditor(false);Native.setChoicesOpen(false);}
 fit();
}
function toggleChoices(kind){
 // The separate toolbar WebView may be visible before syncMenu arrives.
 if(controlsWindow&&!menuOpen)setMenuOpen(true,document.body.classList.contains('menu-left')?'left':'right',0);
 if(!menuOpen)return;
 if(choiceOpen===kind){closeChoices();return;}
 if((choiceOpen==="location"||choiceOpen==="filters")&&kind!==choiceOpen){
  // The location editor temporarily focuses the overlay for the keyboard.
  // Release that focus before showing another mode or AUTO menu.
  document.getElementById("choices").classList.remove("locationPanel");
  if(controlsWindow)Native.locationEditor(false);
  if(controlsWindow)Native.setChoicesOpen(false);
 }
 choiceOpen=kind;
 if(controlsWindow)Native.setChoicesOpen(true);
 if(kind==="mode"){renderModePanel();return;}
 if(kind==="alerts"){renderAlertPanel();return;}
 if(kind==="appearance"){renderAppearancePanel();return;}
 if(kind==="location"){renderLocationChoices();return;}
 if(kind==="filters"){renderAdvancedFilters();return;}
 if(kind==="info"){renderInfoChoices();return;}
 const entries=[["now","↻ Atualizar agora"],[0,"Auto · OFF"],[3,"Auto · 3 min"],
 [5,"Auto · 5 min"],[10,"Auto · 10 min"],[15,"Auto · 15 min"],[20,"Auto · 20 min"]];
 const panel=document.getElementById("choices");
 panel.replaceChildren();
 const title=document.createElement("div");title.className="choiceHeader";title.textContent="ATUALIZAÇÃO";
 panel.appendChild(title);
 for(const [value,label] of entries){
  const button=document.createElement("button");button.type="button";
  button.className=value===period?"chosen":"";
  button.textContent=label;
  button.onclick=()=>{
    closeChoices();
    if(value==="now")manualRefreshTap();
    else{period=Number(value);draw();Native.setIntervalMinutes(period);}
  };
  panel.appendChild(button);
 }
 panel.classList.add("visible");
 document.getElementById("cycle").setAttribute("aria-expanded","false");
 document.getElementById("period").setAttribute("aria-expanded","true");
 fit();
}

function panelInput(label,values,save){
 const row=document.createElement("div");row.className="fieldRow";
 const name=document.createElement("label");name.textContent=label;row.appendChild(name);
 const fields=[];
 for(const v of values){
  const field=document.createElement("input");field.type="number";
  field.inputMode="numeric";field.min=String(v.min);field.max=String(v.max);
  field.value=String(v.value);field.placeholder=v.hint||"";
  field.addEventListener("focus",()=>{if(controlsWindow)Native.locationEditor(true);});
  fields.push(field);row.appendChild(field);
 }
 const apply=document.createElement("button");apply.textContent="✓";
 apply.setAttribute("aria-label","Aplicar "+label);
 apply.onclick=()=>{
  const numbers=fields.map(e=>Number(e.value));
  if(fields.some((e,i)=>e.value.trim()===""||!Number.isInteger(numbers[i])||
     numbers[i]<Number(e.min)||numbers[i]>Number(e.max))){
   fields.forEach(e=>e.style.borderColor="#ff9a9a");return;
  }
  save(numbers);
  closeChoices();
 };
 row.appendChild(apply);
 return row;
}
function renderModePanel(){
 const panel=document.getElementById("choices");
 panel.replaceChildren();panel.classList.add("modePanel");
 const head=document.createElement("div");head.className="choiceHeader";
 head.textContent="MODOS · ABA 1";panel.appendChild(head);
 const description=document.createElement("div");description.className="hintSmall";
 description.textContent="Edite diretamente os números. Toque em ✓ para aplicar à primeira aba.";
 panel.appendChild(description);
 const options=searchOptions||{};
 const ivA=Number(options.ivA??0),ivD=Number(options.ivD??15),ivH=Number(options.ivH??15);
 const rank=Number(options.rankMax||1);
 const config=(kind,parts)=>{
   const p={kind,ivMin:Number(options.ivMin??100),ivMax:Number(options.ivMax??100),
     ivA,ivD,ivH,rankMax:Math.max(1,Math.min(50,rank)),...parts};
   Native.setModeFilter(JSON.stringify(p));
 };
 panel.appendChild(panelInput("IV %",[
  {min:0,max:100,value:options.ivFilter==="percent"?options.ivMin??0:0},
  {min:0,max:100,value:options.ivFilter==="percent"?options.ivMax??100:100}
 ],n=>{if(n[0]>n[1])return;config("percent",{ivMin:n[0],ivMax:n[1]});}));
 panel.appendChild(panelInput("Raw IV",[
  {min:0,max:15,value:ivA},{min:0,max:15,value:ivD},{min:0,max:15,value:ivH}
 ],n=>config("raw",{ivA:n[0],ivD:n[1],ivH:n[2]})));
 const presets=document.createElement("div");presets.className="fieldRow";
 for(const [key,label,ivs] of [[0,shiny?"Shnundo":"Nundo",[0,0,0]],[1,shiny?"Shundo":"Hundo",[15,15,15]]]){
  const button=document.createElement("button");button.textContent=label+" "+ivs.join("/");
  button.style.cssText="flex:1;max-width:unset";
  button.onclick=()=>{config("raw",{ivA:ivs[0],ivD:ivs[1],ivH:ivs[2]});closeChoices();};
  presets.appendChild(button);
 }
 panel.appendChild(presets);
 for(const [kind,title] of [["gl","Great League"],["ul","Ultra League"]])
  panel.appendChild(panelInput(title,[{min:1,max:50,value:rank}],n=>config(kind,{rankMax:n[0]})));
 panel.classList.add("visible");
 document.getElementById("cycle").setAttribute("aria-expanded","true");
 fit();
}
function renderAlertPanel(){
 const panel=document.getElementById("choices");panel.replaceChildren();
 const header=document.createElement("div");header.className="choiceHeader";
 header.textContent="ALERTAS · SOM";panel.appendChild(header);
 const entries=[["on","🔔 Som ligado"],["silent","🔕 Silencioso"],["off","🔕 Notificações desligadas"]];
 for(const [value,label] of entries){
  const b=document.createElement("button");b.textContent=label;
  b.className=alertMode===value?"chosen":"";
  b.onclick=()=>{alertMode=value;generalAlerts=value!=="off";
    Native.setAlertsMode(value);closeChoices();draw();};
  panel.appendChild(b);
 }
 panel.classList.add("visible");document.getElementById("bell").setAttribute("aria-expanded","true");fit();
}
function renderAppearancePanel(){
 const panel=document.getElementById("choices");panel.replaceChildren();
 panel.classList.add("appearancePanel");
 const header=document.createElement("div");header.className="choiceHeader";
 header.textContent="APARÊNCIA";panel.appendChild(header);
 const addSelect=(title,items,value)=>{
  const row=document.createElement("div");row.className="fieldRow";
  const label=document.createElement("label");label.textContent=title;row.appendChild(label);
  const select=document.createElement("select");
  for(const [key,name] of items){const opt=document.createElement("option");opt.value=key;opt.textContent=name;select.appendChild(opt);}
  select.value=value;row.appendChild(select);panel.appendChild(row);return select;
 };
 const direction=[["vertical","Vertical"],["horizontal","Horizontal"]];
 const toolbar=addSelect("Menu",direction,menuOrientation);
 const results=addSelect("Pokémon",direction,resultsOrientation);
 const text=addSelect("Legendas",[["on","Ícone + texto"],["off","Só ícone"]],showToolbarText?"on":"off");
 const size=document.createElement("button");size.textContent="Ajustar tamanho dos sprites (P/M/G)";
 size.onclick=()=>Native.cycleSpriteSize();panel.appendChild(size);
 const label=document.createElement("div");label.className="filterLabel";
 label.textContent="Fundo das abas · "+resultsBackground+"%";panel.appendChild(label);
 const alpha=document.createElement("input");alpha.type="range";alpha.min="0";alpha.max="100";
 alpha.value=String(resultsBackground);alpha.style.width="98%";
 alpha.oninput=()=>label.textContent="Fundo das abas · "+alpha.value+"%";
 panel.appendChild(alpha);
 const save=document.createElement("button");save.textContent="✓ Salvar aparência";
 save.className="chosen";save.onclick=()=>{
  menuOrientation=toolbar.value;resultsOrientation=results.value;
  showToolbarText=text.value==="on";resultsBackground=Number(alpha.value);
  Native.setAppearanceOptions(JSON.stringify({menuOrientation,resultsOrientation,
    menuShowText:showToolbarText,resultsBackground}));
  closeChoices();
 };
 panel.appendChild(save);
 panel.classList.add("visible");document.getElementById("appearance").setAttribute("aria-expanded","true");fit();
}
function renderAdvancedFilters(){
 const panel=document.getElementById("choices");
 panel.classList.add("advancedPanel");panel.replaceChildren();
 const header=document.createElement("div");header.className="choiceHeader";
 header.textContent="FILTROS · POGOOCOORDINATES";panel.appendChild(header);
 const settings=searchOptions||{};
 const fields=[
  ["sort","Sort by","select",[["despawn","Despawn"],["rank","Rank"],["iv","IV"],["cp","PC"],["level","Nível"],["shiny","Shiny"]]],
  ["size","Tamanho","text"],["gender","Sexo","select",[["","Todos"],["Male","Macho"],["Female","Fêmea"],["Genderless","Sem gênero"]]],
  ["levelMin","Nível mín.","number"],["levelMax","Nível máx.","number"],
  ["weather","Clima","select",[["","Qualquer"],["Sunny","Ensolarado"],["Rainy","Chuvoso"],["Cloudy","Nublado"],["Windy","Ventoso"],["Snowy","Neve"],["Fog","Neblina"]]],
  ["form","Forma","text"]];
 const inputs={};
 for(const [key,title,kind,options] of fields){
  const row=document.createElement("div");row.className="fieldRow";
  const lbl=document.createElement("label");lbl.textContent=title;row.appendChild(lbl);
  const inp=document.createElement(kind==="select"?"select":"input");
  if(kind==="select")for(const [v,t] of options){const o=document.createElement("option");o.value=v;o.textContent=t;inp.appendChild(o);}
  if(kind!=="select"){inp.type=kind;inp.inputMode=kind==="number"?"decimal":"text";inp.placeholder=title;}
  inp.value=String(settings[key]??"");inp.addEventListener("focus",()=>{if(controlsWindow)Native.locationEditor(true);});
  row.appendChild(inp);inputs[key]=inp;panel.appendChild(row);
 }
 const note=document.createElement("div");note.className="hintSmall";
 note.textContent="Os campos só são considerados aplicados após confirmação pelo site. Filtros VIP exigem autorização.";
 panel.appendChild(note);
 const save=document.createElement("button");save.className="chosen";save.textContent="✓ Aplicar filtros";
 save.onclick=()=>{
  const o={...searchOptions};for(const key of Object.keys(inputs))o[key]=inputs[key].value.trim();
  searchOptions=o;Native.setSearchOptions(JSON.stringify(o));closeChoices();
 };
 panel.appendChild(save);panel.classList.add("visible");fit();
}

 resultsBackground=Math.max(0,Math.min(100,Number(bgPercent)||0));
 document.body.classList.toggle("results-horizontal",resultsOrientation==="horizontal");
 document.body.classList.toggle("results-vertical",resultsOrientation==="vertical");
 document.documentElement.style.setProperty("--results-alpha",(resultsBackground/100).toFixed(2));
 showLevel=!!levelVisible;showCp=!!cpVisible;showIv=!!ivVisible;showSpawnCount=spawnVisible!==false;
 document.body.classList.toggle("with-text",showToolbarText);
 document.body.classList.toggle("multi-live",multiEnabled);
 hiddenControls=String(hidden||"");
 menuOrientation=orientation==="vertical"?"vertical":"horizontal";
 document.body.classList.toggle("vertical",menuOrientation==="vertical");
 document.getElementById("filters").classList.toggle("activeFilter",
   customIv||rankMax>1||["cpMin","cpMax","levelMin","levelMax","weather","size","form","gender"]
     .some(key=>String(searchOptions[key]||"")!==""));
 const controls=document.getElementById("controls");
 if(menuOrder){
   const allowed=new Set(Array.from(controls.children).map(x=>x.id));
   const sorted=String(menuOrder).split(",").filter(x=>allowed.has(x));
   for(const id of sorted){const item=document.getElementById(id);if(item)controls.appendChild(item);}
 }
 document.querySelectorAll("#controls>button").forEach(b=>{
   b.style.display=hiddenControls.includes("|"+b.id+"|")?"none":"";
 });
 if(menuOrientation==="horizontal"&&!showToolbarText){
   const n=Array.from(controls.children).filter(b=>b.style.display!=="none").length;
   controls.style.gridTemplateColumns="repeat("+Math.max(1,n)+",minmax(0,1fr))";
 }else{
   controls.style.gridTemplateColumns="";
 }
 if(active>=cards.length)active=-1;
 draw();
};
window.menuSide=side=>document.body.classList.toggle("menu-left",menuOpen&&side==="left");
window.highlight=i=>{active=i;document.querySelectorAll(".spawn").forEach(e=>e.classList.toggle("active",Number(e.dataset.index)===i));};
window.setMinimized=value=>{
 document.getElementById("shell").style.display=value?"none":"block";
 if(value)setMenuOpen(false);
 document.getElementById("bubble").style.display=value?"flex":"none";
 if(!value)draw();
};
document.getElementById("clock").addEventListener("click",()=>Native.toggleTimers());
draw();
</script></body></html>
