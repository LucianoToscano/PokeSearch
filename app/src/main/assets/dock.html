<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--row:41px;--sprite:45px;--dock:53px;--top-space:0px;--list-limit:430px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent!important;color:#fff;font:10px Roboto,Arial,sans-serif;overflow:hidden}
/* Menus must extend beyond the 34dp toolbar without being clipped. */
html.controls-root,body.controls-window{overflow:visible!important;min-height:100%;}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#shell{position:relative;width:var(--dock);padding-top:0;background:transparent!important;border:0;border-radius:0;box-shadow:none;overflow:visible}
#gear{width:35px;height:30px;margin:0 auto;padding:0;border:1px solid #ffffff42;border-radius:9px;background:#142133f5;color:#e9ecf1;display:flex;align-items:center;justify-content:center}
#gear svg{display:block;width:21px;height:21px;filter:drop-shadow(0 1px 1px #0007)}
#gear.busy svg{animation:gearbusy 1.25s linear infinite}
@keyframes gearbusy{to{transform:rotate(360deg)}}
#menu{display:none;position:absolute;top:0;left:var(--dock);width:396px;height:34px;z-index:3;padding:0 2px;border:0;border-radius:0;background:transparent;box-shadow:none}
#menu.open{display:block}
#choices{display:none;position:absolute;top:34px;left:0;z-index:12;width:166px;padding:5px;background:#151c27f5;border:1px solid #ffffff38;border-radius:10px;box-shadow:0 4px 12px #0008}
#choices.visible{display:block}
body.menu-left #choices{left:auto;right:0}
#choices button{width:100%;display:block;text-align:left;padding:8px 9px;margin:1px 0;border-radius:7px;background:transparent;border:0;color:#e8ebef;font-size:12px;line-height:1.3;white-space:normal}
#choices button.chosen{background:#263f39;color:#a2efd3;font-weight:700}
#choices .choiceHeader{padding:3px 9px 6px;color:#9faabd;font-weight:bold;font-size:10px}
body.menu-left #shell{margin-left:333px}
body.menu-left #menu{left:-333px}
#controls{width:calc(100% - 4px);display:grid;grid-template-columns:34fr 22fr 41fr 20fr 20fr 22fr 22fr 22fr 38fr 22fr 22fr 22fr;grid-auto-rows:30px;gap:2px;padding:0;margin:0;align-items:center}
body.menu-left #controls{direction:rtl}
body.dock-window #menu{display:none!important}
body.dock-window #shell{margin-left:0!important}
body.controls-window #gear,body.controls-window #spawns,body.controls-window #empty,body.controls-window #collapse{display:none!important}
body.controls-window #shell{width:100%!important;margin:0!important;padding:0!important}
body.controls-window #menu{position:relative!important;display:block!important;left:0!important;top:0!important;width:100%!important}
body.controls-window #choices{z-index:10}
#controls button{direction:ltr}
#controls button{height:30px;width:100%;min-width:0;padding:0;background:#151b26e6;border:1px solid #ffffff23;border-radius:5px;font-size:10px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;white-space:nowrap}
#controls button.active{background:#db2d4bdb}
#manualRefresh.requested{background:#225446ee;border-color:#a4ecd4;animation:refreshpulse .8s ease-in-out 2}
@keyframes refreshpulse{50%{opacity:.6}}
#controls #cycle.ivOn{background:#136b3bdf;border-color:#69df97a6;color:#e9fff2}
#gear .gear-icon{display:block}
#gear .close-icon{display:none}
#controls #close{font-size:18px;font-weight:800;color:#ff596c;background:#151b26e6;border-color:#ff596c5c}
#controls #close:active{background:#622735}
#collapse{display:flex;align-items:center;justify-content:center;width:40px;height:32px;margin:5px auto 3px;
 padding:0;border-radius:10px;border:1px solid #b4cbe5bf;background:#152338;color:#f2f8ff;
 box-shadow:0 2px 9px #000c}
#collapse svg{width:22px;height:22px;display:block;pointer-events:none}
#controls #bell.generalOn{background:#1d5b49dc;border-color:#69dbab77;color:#ddfff1}
#controls #star.favoritesOn{background:#70561de0;border-color:#ffe29a77;color:#ffdf74}
#controls #star svg{width:17px;height:17px}
#controls #donate{color:#fa94a7}
#controls #report{color:#ffd674;font-size:16px;font-weight:700}
#controls #location.locOn{background:#1e6150e8;color:#b2ffe0;border-color:#5de7b1a6}
#controls #location.locOn{flex-direction:column;gap:0}
#controls #location.locOn svg{width:12px;height:12px}
#controls #location .locRadiusText{display:none;font-size:8px;line-height:9px;font-weight:800;letter-spacing:-.25px}
#controls #location.locOn .locRadiusText{display:block}
#locBadge{display:none;width:var(--dock);height:14px;padding:0 1px;text-align:center;line-height:13px;font-size:9px;font-weight:800;
 color:#b2ffe0;background:#152b27be;border:1px solid #69d2ad48;border-radius:6px;white-space:nowrap;
 overflow:hidden;pointer-events:none;user-select:none}
#locBadge.active{display:block}
body.controls-window #locBadge{display:none!important}
#choices.locationPanel{width:306px;max-width:calc(100vw - 12px)}
#choices.modePanel{width:246px;max-width:calc(100vw - 12px);height:auto;padding:3px;
 max-height:min(216px,var(--popup-room,400px));overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
#choices.modePanel .choiceHeader{padding:2px 5px 3px}
#choices .modeTitleRow{display:flex;align-items:center;justify-content:space-between;gap:4px}
#choices .modeTitleRow #modeShiny{width:auto;flex:none;margin:1px 3px 2px;padding:4px 7px;font-size:10px;
 border:1px solid #a68c506f;border-radius:6px;color:#f6d88b;background:#55492b77}
#choices .modeTitleRow #modeShiny.on{background:#6b592cbd;color:#ffe49d}
#choices .extraDivider{height:1px;margin:5px 3px;background:#ffffff32}
#choices .extraHead{display:flex;align-items:center;justify-content:space-between;width:100%;padding:6px 5px;
 font-weight:700;font-size:11px;border-radius:6px;background:#ffffff0a}
#choices .extraHead .down{font-size:11px;opacity:.8}
#choices .extraField{display:flex;align-items:center;gap:5px;margin:3px 2px;min-height:28px}
#choices .extraField label{min-width:68px;font-size:10px;color:#d6dce4;flex:none}
#choices .extraField button.extraValue{margin:0;flex:1;min-width:0;padding:6px 6px;background:#303743;border:1px solid #ffffff25;
 border-radius:6px;text-align:left;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#choices .extraField input{flex:1;width:100%;min-width:0;height:26px;padding:4px 6px;font-size:11px;color:#fff;
 border:1px solid #ffffff3d;border-radius:5px;background:#151c25}
#choices .extraField input[type=checkbox]{flex:none;width:17px;height:17px;accent-color:#5bba96}
#choices .extraNote{margin:2px 5px 5px;font-size:9px;color:#b7c3d1;line-height:1.25}
#choices .extraValue:disabled{opacity:.5;cursor:default}
#choices .modeRow{display:flex;align-items:center;gap:2px;padding:1px 2px;min-height:29px;border-radius:5px}
#choices .modeRow.selected{background:#183b32aa}
#choices .modeRow .modeSelect{flex:1;min-width:0;width:auto;font-size:11px;padding:5px 3px;margin:0}
#choices .modeRow .modeValue{flex:none;min-width:31px;width:auto;padding:5px 3px;margin:0;text-align:center;
 color:#dce9f9;background:#283544;border:1px solid #465a70;border-radius:5px;font-size:11px;white-space:nowrap}
#choices .modeRow .modeValue:focus-visible{outline:1px solid #8de7c9}
#choices .modeAction{display:flex;gap:4px;padding:4px 2px 1px;position:sticky;bottom:0;
 background:#252628f5;z-index:1}
#choices .modeAction button{padding:6px 4px}
#choices .modeAction button{width:50%;margin:0;text-align:center;background:#223448;border:1px solid #415369}
#choices .modeAction .modeApply{background:#17644c;border-color:#50bf94;color:#e0ffee}
#choices .modeHint{display:none}
#choices .numberGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;max-height:148px;
 overflow-y:auto;overscroll-behavior:contain;padding:4px}
#choices .numberGrid button{padding:5px 0;margin:0;text-align:center;background:#263345;border:1px solid #455367}
#choices .numberGrid button.chosen{background:#21634e;border-color:#61d2a7}
#choices .numberBack{border:1px solid #465b6a;background:#223144;text-align:center}
#choices .numberJump{display:flex;align-items:center;gap:5px;padding:0 5px 1px}
#choices .numberJump input{flex:1;min-width:0;height:24px;margin:0;accent-color:#72c7ae;touch-action:pan-x}
#choices .numberJump output{font-size:11px;font-weight:700;min-width:25px;text-align:right;color:#dbffef}
/* The orange stale-result dot is intentionally hidden. Source provenance and
   accessible stale status remain intact; old cards never become new results. */
#choices .locText{font-size:11px;color:#a9b7c9;padding:0 7px 8px;line-height:1.35}
#choices .locCoordsRow{display:flex;align-items:center;gap:7px;margin:0 7px 7px}
#choices .locCoordsRow .locField{flex:1;min-width:0;margin:0;width:auto}
#choices .locCoordsRow button[role=switch]{flex:none;width:48px;min-height:34px;border:1px solid #51647b;border-radius:9px;background:#283444;color:#c5d1dd;font-size:11px;font-weight:800}
#choices .locCoordsRow button.locActive{background:#146d50;color:#dbffef;border-color:#5fe6ad}
#choices .locCoordsRow button.locOff{background:#27313e;color:#ffd1a3;border-color:#7e6552}
#choices .locField{box-sizing:border-box;width:calc(100% - 14px);margin:0 7px 8px;min-height:36px;background:#111722;border:1px solid #536174;border-radius:7px;padding:8px;color:#fff;font-size:13px}
#choices input[type=range]{width:calc(100% - 14px);margin:4px 7px 8px;accent-color:#77e4c2;touch-action:pan-x}
#choices .locLine{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:3px 7px;color:#dee6f2;font-size:12px}
#choices .locLine button{width:auto;flex:none;padding:7px 9px;background:#223147;border:1px solid #51647b;border-radius:7px}
#choices .locLine button.locActive{background:#1b674f;border-color:#55d7ac}
#choices .locLine button.locOff{color:#ffcf99}
#choices .locLine button.locSave{color:#a8efd4}
#choices .locLine button.locHide{color:#aabbce}
#choices #locHint{font-size:10px;color:#aec5d6;margin:0 7px 5px;line-height:1.3}
#controls button svg{width:16px;height:16px;display:block;pointer-events:none}
#controls #cycle{font-size:11px;font-weight:800}
#controls #cycle .league{display:inline-flex;gap:2px;align-items:center;justify-content:center}
#controls #cycle .league svg{width:16px;height:16px}
#controls #size{font-size:12px!important;font-weight:800}
#controls button.shinyOn{color:#ffe5a0;background:#564627e9}
#controls button.shinyPending{color:#ffe5a0;background:#201e1bc8;border:1px dashed #dbb65b;opacity:.85}
#actions{display:contents}
#actions button{font-size:16px;font-weight:500}
#period{display:flex;flex-direction:column;gap:1px;line-height:1!important;padding:2px 0!important}
#period .autoLabel{font-size:8px;font-weight:800;letter-spacing:0.25px;opacity:.85}
#period .autoTime{font-size:10px;font-weight:800}
#clock.timerOn{background:#76601ccf;border-color:#ffe5a04d;color:#ffe5a0}
#spawns{width:var(--dock);display:flex;flex-direction:column;align-items:center;gap:0;padding:0;margin:var(--top-space) 0 0;max-height:var(--list-limit);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
#spawns::-webkit-scrollbar{display:none}
.spawn{width:var(--dock);height:var(--row);position:relative;min-height:var(--row);flex:0 0 var(--row);display:flex;align-items:center;justify-content:center;margin:0;padding:0;background:transparent;border:0;border-radius:4px}
.spawn.active .sprite{filter:drop-shadow(0 0 3px #ffffff77)}
.timer{position:absolute;right:0;bottom:0;padding:1px 2px;border-radius:0;background:transparent;color:#fff;font-size:8px;line-height:10px;pointer-events:none;min-width:23px;text-align:center;text-shadow:0 1px 2px #000,0 0 3px #000}
.spawn .ivPct{position:absolute;left:0;bottom:0;z-index:1;max-width:29px;min-width:16px;padding:0;border-radius:0;background:transparent;font:800 8px/10px Roboto,Arial,sans-serif;text-align:center;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000,0 0 3px #000}
.spawn .ivPct.zero{color:#00cfe8}
.spawn .ivPct.low{color:#b8bec8}
.spawn .ivPct.medium{color:#28c76f}
.spawn .ivPct.high{color:#388bff}
.spawn .ivPct.excellent{color:#c084fc}
.spawn .ivPct.perfect{color:#f04b70}
.spawn.expired{opacity:.38}
.sprite{display:block;width:var(--sprite);height:var(--sprite);object-fit:contain;flex-shrink:0;pointer-events:none;filter:drop-shadow(0 1px 1px #0006)}
.fallback{font-size:20px}
#empty{display:block;width:var(--dock);height:18px;line-height:18px;text-align:center;color:#dce1e9b8;font-size:12px;overflow:hidden;background:transparent;border:0;padding:0}
#bubble{display:none;width:45px;height:45px;border:0;background:transparent;box-shadow:none;border-radius:0;align-items:center;justify-content:center}
#bubble svg{width:20px;height:20px;color:#e9ecf1;filter:drop-shadow(0 1px 1px #0009)}
/* Original compact PokeSearch toolbar: ALL 12 actions share ONE row.
   Restore earlier sizing and minimal internal spacing; no two-row UI. */
#controls{grid-auto-flow:column}
#controls button{justify-self:stretch;align-self:center;text-align:center}
#controls button:focus-visible{outline:2px solid #f1f1f1;outline-offset:-2px}
#choices{max-width:calc(100vw - 12px);overflow-x:hidden}
#choices.locationPanel{overflow-y:auto}
body.controls-window #menu{min-height:34px}
body.controls-window #choices{top:34px;max-height:var(--popup-room,400px);overflow-y:auto}
body.controls-window #choices.modePanel{max-height:min(216px,var(--popup-room,400px))}
body.controls-window.popup-above #menu{top:var(--popup-offset,0px)!important}
body.controls-window.popup-above #choices{top:auto!important;bottom:34px!important}
/* v0.50: floating transparent icons, neutral and unobtrusive colors. */
#gear{width:35px;height:30px;background:transparent!important;border:0!important;border-radius:0;box-shadow:none!important;color:#f5f5f6}
#gear svg{filter:drop-shadow(0 1px 2px #000c)}
#collapse{width:34px;height:27px;margin:0 auto;padding:0;border:0!important;background:transparent!important;box-shadow:none!important;color:#fafafa}
#collapse svg{width:19px;height:19px;filter:drop-shadow(0 1px 2px #000b)}
#controls button{background:#28292cc6;border-color:#ffffff2d;color:#f2f2f3}
#controls #close{background:#28292cc6}
#choices{background:#252628ee;border-color:#ffffff38}
#choices button.chosen{background:#494b4bdc;color:#fff}
#choices .choiceHeader{color:#d6d7da}
#choices .locText,#choices #locHint{color:#d3d4d6}
#choices .locField{background:#17191bdc;border-color:#96999c88}
#choices .locCoordsRow button[role=switch],#choices .locLine button{background:#37393dc9;border-color:#979a9d60}
#controls #location svg{width:14px;height:14px}
#controls #location.locOn{background:#454c48cf;border-color:#bfc9c1a6;color:#fff}
#controls #location.locOn svg{width:12px;height:12px}
#locBadge{background:#363b3ac4;border-color:#ffffff4a;color:#edf0ef}
#controls #cycle.ivOn{background:#3a5040bd;border-color:#abc3ae;color:#fff}
#controls #bell.generalOn{background:#414649d1;border-color:#b0b6b8;color:#fff}
#controls #bell.generalSilent{background:#48484ac9;border-color:#d2d2d2;color:#e5e5e5}
#controls #period.autoOff{opacity:.73;background:#333538ac}
#spawns{margin-top:var(--top-space);gap:0}
/* One search -> one independent overlay. Preserve the original compact toolbar. */
#resultHeader{display:none}
body.dock-window #spawns,body.dock-window #empty,
body.dock-window #collapse,body.dock-window #locBadge{display:none!important}
body.dock-window #shell{height:30px;overflow:hidden!important}
body.dock-window #bubble{position:absolute;top:0}
body.controls-window #resultHeader{display:none!important}
body.result-window #gear,body.result-window #menu,body.result-window #locBadge,
body.result-window #collapse,body.result-window #bubble{display:none!important}
body.result-window #shell{width:var(--dock);margin:0!important;overflow:hidden}
body.result-window #resultHeader{width:35px;height:30px;display:flex;
 align-items:center;justify-content:center;padding:0;margin:0 auto;border:0;
 border-radius:8px;background:transparent;box-shadow:none}
/* Composition stays inside the original 35x30px touch area and 21px max art. */
body.result-window #resultHeader .resultModeStack{position:relative;display:block;flex:none;width:var(--mode-icon-size,21px);height:var(--mode-icon-size,21px);max-width:21px;max-height:21px;aspect-ratio:1/1;overflow:visible;pointer-events:none}
body.result-window #resultHeader .resultModeStack img{position:absolute;inset:0;display:block;width:100%;height:100%;aspect-ratio:1/1;object-fit:contain;object-position:center;max-width:none;max-height:none;pointer-events:none;filter:drop-shadow(0 1px 1px #0007)}
body.result-window #resultHeader .modeIndicator{position:absolute;z-index:1;display:none;align-items:center;justify-content:center;box-sizing:border-box;pointer-events:none;font-family:Arial,Roboto,sans-serif;font-weight:900;line-height:1;text-shadow:0 1px 1px #000}
body.result-window #resultHeader .modeIndicator.visible{display:flex}
body.result-window #resultHeader .modeIndicator.value{left:50%;bottom:-2px;max-width:33px;min-width:0;height:10px;padding:0;border-radius:0;background:transparent;color:#16191c;font-size:9px;white-space:nowrap;letter-spacing:-.2px;-webkit-text-stroke:.25px #fff;text-shadow:0 1px 1px #fff,0 0 2px #fff,0 0 3px #fff;transform:translateX(-50%) scale(var(--mode-indicator-scale,1));transform-origin:bottom center}
body.result-window #resultHeader .modeIndicator.value.zero{color:#00cfe8}
body.result-window #resultHeader .modeIndicator.value.perfect{color:#f04b70}
body.result-window #resultHeader .modeIndicator.shiny{right:-3px;top:-3px;width:11px;height:11px;border-radius:0;background:transparent;color:inherit;font-size:10px;text-shadow:0 1px 2px #000;transform:scale(var(--mode-indicator-scale,1));transform-origin:top right}
body.result-window #resultHeader .modeIndicator.background{left:-3px;top:-2px;width:9px;height:9px;border-radius:0;background:transparent;color:#adf1ee;transform:scale(var(--mode-indicator-scale,1));transform-origin:top left}
body.result-window #resultHeader .modeIndicator.background svg{display:block;width:7px;height:7px}
body.result-window #resultHeader .capturePulse{position:absolute;z-index:1;left:50%;top:50%;width:29%;height:29%;border-radius:50%;box-sizing:border-box;pointer-events:none;will-change:opacity,transform;background:#f5ffff;box-shadow:0 0 0 1px #00e5ff,0 0 5px 2px #00cfff;opacity:0;transform:translate(-50%,-50%) scale(.7)}
body.result-window.search-active:not(.results-collapsed) #resultHeader .capturePulse{
 animation:psCapturePulse .85s ease-in-out infinite
}
@keyframes psCapturePulse{
 0%,100%{opacity:.2;transform:translate(-50%,-50%) scale(.7)}
 50%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
}
@media (prefers-reduced-motion:reduce){
 body.result-window.search-active #resultHeader .capturePulse{
 animation:none;opacity:.45;transform:translate(-50%,-50%) scale(.75)
 }
}
body.result-window #resultHeader:focus-visible{outline:1px solid #fff8}
body.result-window #spawns{margin:0!important;max-height:var(--list-limit);
 width:var(--dock);padding:0;gap:0}
body.result-window #empty{margin:0 auto;max-height:18px}
body.result-window.results-collapsed #spawns,
body.result-window.results-collapsed #empty{display:none!important}
</style></head><body>

 <div id="menu"><div id="controls">
  <button id="cycle" title="Modos · Raw IV, % IV, Grande Liga e Ultra Liga" aria-haspopup="true" aria-expanded="false" onclick="toggleChoices('mode')">100%</button>

function getResultIcon(searchMode,shinyActive,settings=searchSettings){

 // Raw IV 15/15/15 automatically identifies IV100 while preserving one mode.
 if(modeKey==="raw"){
  const {attack,defense,stamina}=settings;

 }
 if(modeKey==="percent"){
  if(settings.percentMin===100&&settings.percentMax===100)family="hundo";

 const pair=RESULT_ICONS[family];
 const shining=!!shinyActive;

// Pokémon GO IVs are the integer sum of three 0–15 stats (0..45):

const IV_PERCENT_VALUES=Object.freeze([0,2,4,7,9,11,13,16,18,20,22,24,27,29,31,33,36,38,40,42,44,47,49,51,53,56,58,60,62,64,67,69,71,73,76,78,80,82,84,87,89,91,93,96,98,100]);
// Display-only evidence: an IV must be attainable and internally consistent.
// Unknown, malformed or contradictory data never gets an IV label.
function verifiedSpawnIvPercent(card){
 if(!card||typeof card!=="object")return null;
 const raw=String(card.iv==null?"":card.iv).trim();
 const pct=String(card.ivPercent==null?"":card.ivPercent).trim();
 let computed=null;
 if(raw){
  if(!/^(?:[0-9]|1[0-5])\/(?:[0-9]|1[0-5])\/(?:[0-9]|1[0-5])$/.test(raw))return null;

  if(!/^(?:0|[1-9][0-9]?|100)$/.test(pct))return null;

  return observed;

}
function ivPaletteClass(percent){

 const heading=document.createElement("div");heading.className="choiceHeader";heading.textContent=title;

 // Only the 46 attainable Pokémon GO IV percentages; PvP Top 1–50 is separate.
 const choices=kind==="percent"?IV_PERCENT_VALUES:
   Array.from({length:kind==="iv"?16:50},(_,i)=>i+(kind==="rank"?1:0));
 const selected=Number(modeDraft[key]);
 const chooseNumber=number=>{
  if(!choices.includes(number))return;
  modeDraft[key]=number;
  if(key==="percentMin"&&modeDraft.percentMax<number)modeDraft.percentMax=number;
  if(key==="percentMax"&&modeDraft.percentMin>number)modeDraft.percentMin=number;
  renderModeChoices();
 };
 const highlight=value=>{
  grid.querySelectorAll("button").forEach(btn=>{
   btn.classList.toggle("chosen",Number(btn.dataset.number)===value);
  });
  const index=choices.indexOf(value);
  grid.scrollTop=Math.max(0,(Math.floor(index/5)-2)*30);
 };
 choices.forEach(number=>{
  const btn=document.createElement("button");btn.type="button";
  btn.textContent=kind==="percent"?number+"%":String(number);
  btn.dataset.number=String(number);btn.className=number===selected?"chosen":"";
  btn.setAttribute("aria-label",title+" = "+number+(kind==="percent"?"%":""));
  btn.onclick=()=>chooseNumber(number);
  grid.appendChild(btn);
 });
 // The slider advances by valid IV percentage INDEX (0–45), not 1% increments.
 if(kind==="percent"){
  const jump=document.createElement("div");jump.className="numberJump";
  const slider=document.createElement("input");
  slider.type="range";slider.min="0";slider.max=String(IV_PERCENT_VALUES.length-1);slider.step="1";
  slider.value=String(Math.max(0,IV_PERCENT_VALUES.indexOf(selected)));
  slider.setAttribute("aria-label","Escolha rápida: "+title);
  const output=document.createElement("output");output.textContent=IV_PERCENT_VALUES[Number(slider.value)]+"%";
  slider.oninput=()=>{
   const value=IV_PERCENT_VALUES[Number(slider.value)];
   output.textContent=value+"%";highlight(value);
  };
  slider.onchange=()=>chooseNumber(IV_PERCENT_VALUES[Number(slider.value)]);
  jump.append(slider,output);panel.append(heading,jump,grid);
 }else panel.append(heading,grid);
 const selectedIndex=Math.max(0,choices.indexOf(selected));
 grid.scrollTop=Math.max(0,(Math.floor(selectedIndex/5)-2)*30);
 const back=document.createElement("button");back.className="numberBack";back.textContent="‹ Voltar";
 back.onclick=renderModeChoices;
 panel.appendChild(back);fit();
}
function renderLocationChoices(){
 const panel=document.getElementById("choices");
 panel.replaceChildren();panel.classList.remove("modePanel");panel.classList.add("locationPanel");
 const make=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x;};
 const title=make("div","choiceHeader","📍 LOCALIZAÇÃO");
 const hint=make("p","locText","Cole latitude,longitude. A chave ao lado ativa ou desativa; ocultar conserva o filtro atual.");
 const fieldRow=make("div","locCoordsRow");
 const field=make("input","locField");field.type="text";field.inputMode="decimal";field.placeholder="-23.5505,-46.6333";field.setAttribute("aria-label","Coordenadas latitude e longitude");field.value=locationCoords;
 const toggle=make("button",locationEnabled?"locActive":"locOff",locationEnabled?"ON":"OFF");
 toggle.setAttribute("role","switch");
 toggle.setAttribute("aria-checked",String(locationEnabled));
 toggle.setAttribute("aria-label","Ativar ou desativar o filtro de coordenadas");
 fieldRow.append(field,toggle);
 const label=make("div","locLine");const labelName=make("span","","Raio da busca");const value=make("strong","",locationRadius+" km");label.append(labelName,value);
 const slide=make("input");slide.type="range";slide.min="0";slide.max="1000";slide.step="1";slide.value=String(locationRadius);slide.setAttribute("aria-label","Raio em quilômetros de 0 a 1000");
 slide.oninput=()=>{value.textContent=slide.value+" km";};
 const status=make("p","");status.id="locHint";status.textContent=locationEnabled?"📍 Ativo na pesquisa · "+locationRadius+" km":"OFF · busca geral, sem coordenadas do aplicativo.";
 const actions=make("div","locLine");const apply=make("button","locSave","✓ Aplicar");const hide=make("button","locHide","Ocultar");
 const disable=()=>{locationEnabled=false;locationCoords="";locationRadius=0;closeChoices();Native.setLocation(false,"",0);};
 toggle.onclick=()=>{if(locationEnabled){disable();return;}submit();};
 function submit(){
  const raw=field.value.trim();
  const match=raw.match(/^\s*([-+]?\d{1,2}(?:\.\d+)?)\s*[,;]\s*([-+]?\d{1,3}(?:\.\d+)?)\s*$/);
  if(!match||Math.abs(Number(match[1]))>90||Math.abs(Number(match[2]))>180){
   status.textContent="⚠ Cole latitude,longitude válidas para ativar.";
   status.style.color="#ffbf8f";return;
  }
  locationCoords=match[1]+","+match[2];locationRadius=Number(slide.value);
  locationEnabled=true;closeChoices();Native.setLocation(true,locationCoords,locationRadius);
 }
 apply.onclick=submit;hide.onclick=closeChoices;
 actions.append(apply,hide);
 panel.append(title,hint,fieldRow,label,slide,status,actions);
 panel.classList.add("visible");
 document.getElementById("location").setAttribute("aria-expanded","true");
 if(controlsWindow)Native.locationEditor(true);
 fit();
}
function manualRefreshTap(){
 const button=document.getElementById("manualRefresh");
 button.classList.add("requested");
 button.title="Atualização solicitada · respeita o limite de buscas";
 Native.refresh();
}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let longTimer, longDone=false;
function spriteClick(i){if(longDone){longDone=false;return;}Native.toggleDetail(i);}
function attachLongPress(){
 document.querySelectorAll('.spawn').forEach(el=>{
  const i=Number(el.dataset.index);
  el.addEventListener('touchstart',()=>{longDone=false;clearTimeout(longTimer);longTimer=setTimeout(()=>{longDone=true;Native.longPressCoords(i);},580);},{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(t=>el.addEventListener(t,()=>clearTimeout(longTimer),{passive:true}));
  el.addEventListener('contextmenu',e=>{e.preventDefault();longDone=true;Native.longPressCoords(i)});
 });
}
let lastListKey="";
function draw(){
 document.documentElement.style.setProperty("--row",row+"px");
 document.documentElement.style.setProperty("--sprite",spriteSize+"px");
 document.documentElement.style.setProperty("--dock",(spriteSize+8)+"px");
 // P/M/G scales the header DOWN, never above its original 21px.
 const headerIconSize=Math.max(17,Math.min(21,Math.round(spriteSize*0.45)));
 document.documentElement.style.setProperty("--mode-icon-size",headerIconSize+"px");
 document.documentElement.style.setProperty("--mode-indicator-scale",String(headerIconSize/21));
 const cy=document.getElementById("cycle");
 if(mode==="raw"||mode==="iv"||mode==="percent"){
  const label=specialIVLabel(mode,searchSettings);
  cy.textContent=label;
  cy.classList.toggle("ivOn",label==="100%"||label==="0%");
  cy.title=mode==="percent"?"% IV · "+searchSettings.percentMin+"–"+searchSettings.percentMax+"%":
   "Raw IV · "+searchSettings.attack+"/"+searchSettings.defense+"/"+searchSettings.stamina;
 }
 else{
   const gl=mode==="gl",color=gl?"#2f8ed8":"#d8ad43";
   const rank=gl?searchSettings.glRank:searchSettings.ulRank;
   cy.innerHTML='<span class="league"><svg viewBox="0 0 24 24" aria-hidden="true">'+
   '<circle cx="12" cy="12" r="10.5" fill="'+color+'" stroke="#fff" stroke-width="1.2"/>'+
   '<path d="M3 12h18" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="#fff" stroke="'+color+'" stroke-width="1.5"/></svg>#'+rank+'</span>';
   cy.classList.remove("ivOn");
   cy.title=(gl?"Grande Liga":"Ultra Liga")+" · top ranking "+rank;
 }
 document.getElementById("size").textContent=spriteSize<=35?"P":spriteSize>=55?"G":"M";
 document.getElementById("sh").classList.toggle("shinyOn",shiny);
 const menuShiny=document.getElementById("modeShiny");
 if(menuShiny){menuShiny.textContent="✨ "+(shinyPending?"…":shiny?"ON":"OFF");menuShiny.classList.toggle("on",shiny);
  menuShiny.setAttribute("aria-pressed",String(shiny));}
 document.getElementById("sh").classList.toggle("shinyPending",shinyPending);
 document.getElementById("location").classList.toggle("locOn",locationEnabled);
 document.getElementById("locationRadiusText").textContent=locationEnabled?locationRadius+"km":"";
 const geoBadge=document.getElementById("locBadge");
 geoBadge.classList.toggle("active",locationEnabled);
 geoBadge.textContent=locationEnabled?"📍 "+locationRadius+" km":"";
 document.getElementById("location").title=locationEnabled?"📍 "+locationRadius+" km · filtro ativo · toque para abrir/ocultar":"📍 Localização desligada · toque para configurar";
 document.getElementById("location").setAttribute("aria-label",locationEnabled?"Localização ligada, raio "+locationRadius+" quilômetros":"Localização desligada");
 document.getElementById("sh").setAttribute("aria-pressed",String(shiny));
 document.getElementById("sh").title=shiny?"✨ Shiny confirmado":shinyPending?"✨ Aguardando vínculo/confirmação no site":"Shiny desativado";
 document.getElementById("clock").classList.toggle("timerOn",showTimers);
 if(/atualizad|resultados|sem resultados|erro|falha|não confirmado/i.test(status))document.getElementById("manualRefresh").classList.remove("requested");
 const bell=document.getElementById("bell");
 bell.classList.toggle("generalOn",generalAlerts);
  bell.classList.toggle("generalSilent",alertMode==="silent");
 bell.setAttribute("aria-pressed",String(generalAlerts));
 bell.title=alertMode==="silent"?"Notificações silenciosas · toque para desligar":generalAlerts?"Notificações ligadas · toque para silenciar":"Notificações desligadas · toque para ligar";
  bell.setAttribute("aria-label",bell.title);
 const star=document.getElementById("star");
 star.classList.toggle("favoritesOn",hasFavorites);
 star.title=hasFavorites?"Editar favoritos e alertas específicos":"Adicionar Pokémon favoritos e alertas específicos";
 const p=document.getElementById("period");p.querySelector(".autoTime").textContent=period===0?"OFF":String(period)+"m";p.classList.toggle("autoOff",period===0);p.title=period===0?"AUTO desligado · atualizar com ↻ ou mudar filtros":"Atualização automática a cada "+period+" minutos · toque para alterar";p.setAttribute("aria-label",p.title);
 const listKey=JSON.stringify([cards,row,spriteSize,showTimers]);
 if(listKey!==lastListKey){lastListKey=listKey;
 // The gear and menu WebViews never create hidden sprite buttons.
 // Only the independent results WebView owns the Pokémon list and its taps.
 if(resultWindow)document.getElementById("spawns").innerHTML=cards.map((c,i)=>{
  const verifiedPercent=verifiedSpawnIvPercent(c);
  const label=[c.name,verifiedPercent===null?"IV não comprovado":"IV "+verifiedPercent+"%",verifiedPercent===null?"":c.iv,c.rank?"Rank "+c.rank:""].filter(Boolean).join(" · ");
  const icon=/^(https:\/\/|data:image\/(?:png|webp|gif|jpeg);base64,)/i.test(c.image||"")?'<img class="sprite" src="'+esc(c.image)+'" alt="" loading="eager">':'<span class="fallback">◉</span>';
  const kind=(c.shiny?"shiny":shownMode),deadline=Number(c.expiresAtMs)||0;
  const badge=showTimers&&deadline?'<span class="timer" data-deadline="'+deadline+'"></span>':"";
  const ivBadge=!showResultText||verifiedPercent===null?"":'<span class="ivPct '+ivPaletteClass(verifiedPercent)+'" aria-hidden="true">'+verifiedPercent+'%</span>';
  return '<button title="'+esc(label)+'" aria-label="'+esc(label)+'" class="spawn '+esc(kind)+(active===i?" active":"")+'" data-index="'+i+'" onclick="spriteClick('+i+')" oncontextmenu="return false">'+icon+ivBadge+badge+'</button>';
 }).join("");
 else document.getElementById("spawns").replaceChildren();
 if(resultWindow){attachLongPress();updateTimers();}
 }
 const empty=document.getElementById("empty");
 empty.style.display=cards.length?"none":"block";
 const waiting=nextQueryAt>Date.now();
 empty.textContent=/sem resultados/i.test(status)?"0":/falha|erro|não|login/i.test(status)?"!":"…";
 empty.title=status||"Aguardando busca";
 if(resultWindow){
  // Only show a Shiny badge after the site confirms that Shiny-only is active.
  // A pending toggle keeps its previous non-Shiny identification.
  const hasHistory=cards.length>0;
  const iconMode=hasHistory?shownMode:mode;
  const iconShiny=hasHistory?shownShiny:shiny;
  const iconSettings=hasHistory?shownSettings:searchSettings;
  const selectedIcon=getResultIcon(iconMode,iconShiny,iconSettings);
  document.body.classList.toggle("results-stale",hasHistory&&resultsStale);
  document.body.classList.toggle("search-active",searchActive&&!shinyPending&&nextQueryAt<=Date.now());
  const header=document.getElementById("resultHeader");
  const image=document.getElementById("resultModeIcon");
  if(image.getAttribute("src")!==selectedIcon.path){
   image.onerror=()=>{image.onerror=null;if(image.getAttribute("src")!==selectedIcon.fallbackPath)image.src=selectedIcon.fallbackPath;};
   image.src=selectedIcon.path;
  }
  const primaryBadge=document.getElementById("modeIndicatorValue");
  primaryBadge.textContent=selectedIcon.ivBadge;
  primaryBadge.classList.toggle("visible",!!selectedIcon.ivBadge);
  primaryBadge.classList.toggle("zero",selectedIcon.family==="nundo");
  primaryBadge.classList.toggle("perfect",selectedIcon.family==="hundo");
  document.getElementById("modeIndicatorShiny").classList.toggle("visible",selectedIcon.shinyBadge);
  document.getElementById("modeIndicatorBackground").classList.toggle("visible",selectedIcon.backgroundBadge);
  const label=(hasHistory&&resultsStale?"⚠ Resultados anteriores · ":"")+selectedIcon.title+
      ((iconMode==="gl"||iconMode==="ul")?" · PvP top "+(iconMode==="gl"?iconSettings.glRank:iconSettings.ulRank):"")+
      (!hasHistory&&shinyPending?" · Shiny aguardando confirmação":"");
  header.title=label+(waiting?" · próxima consulta em "+Math.ceil((nextQueryAt-Date.now())/1000)+"s":"")+
       " · toque para recolher/expandir · arraste para mover";
   header.removeAttribute("data-wait"); // Cooldown accessible by title, not floating text
  header.setAttribute("aria-label",header.title);
 }
 document.getElementById("gear").title=menuOpen?"Recolher menu · arrastar para mover":status?("Abrir menu · "+status):"Abrir menu · arrastar para mover";
 document.getElementById("gear").classList.toggle("busy",/(atualizando|buscando|busca manual|pesquisa)/i.test(status));
 fit();
}
function updateTimers(){
 // Only opt-in despawn clocks; no floating wait count below the Pokéball.
 document.querySelectorAll(".timer").forEach(e=>{
  const deadline=Number(e.dataset.deadline),seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));
  e.textContent=Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0");
  e.parentElement.classList.toggle("expired",seconds===0);
 });
}
setInterval(updateTimers,1000);
window.onNativeData=(a,s,m,shi,r,interval,sprite,timers,borders,general,hasFav,pending,listLimit,locEnabled,locCoords,locRadius,notificationMode,config,resultSourceMode,resultSourceConfig,resultSourceShiny,stale,nextDue,isSearching=false)=>{
 cards=Array.isArray(a)?a.slice(0,10):[];
 document.documentElement.style.setProperty("--list-limit",Math.max(110,Number(listLimit)||330)+"px");
 locationEnabled=!!locEnabled;locationCoords=String(locCoords||"");locationRadius=Number(locRadius)||0;
 if(config&&typeof config==="object")searchSettings={...searchSettings,...config};
 shownMode=resultSourceMode==="iv"?"raw":(resultSourceMode||mode);
 if(resultSourceConfig&&typeof resultSourceConfig==="object")
  shownSettings={...searchSettings,...resultSourceConfig};
 shownShiny=!!resultSourceShiny;resultsStale=!!stale;
 nextQueryAt=Number(nextDue)||0;
 searchActive=!!isSearching;
 mode=m==="iv"?"raw":m;status=String(s||"");shiny=!!shi;shinyPending=!!pending;row=Number(r)||46;period=[0,5,10,15,20].includes(Number(interval))?Number(interval):5;spriteSize=Number(sprite)||45;showTimers=!!timers;generalAlerts=!!general;hasFavorites=!!hasFav;alertMode=notificationMode==="silent"?"silent":generalAlerts?"on":"off";
 if(active>=cards.length)active=-1;
 draw();
};
window.menuSide=side=>document.body.classList.toggle("menu-left",menuOpen&&side==="left");
window.highlight=i=>{active=i;document.querySelectorAll(".spawn").forEach((e,index)=>e.classList.toggle("active",index===i));};
window.setMinimized=value=>{
 document.getElementById("shell").style.display=value?"none":"block";
 if(value)setMenuOpen(false);
 document.getElementById("bubble").style.display=value?"flex":"none";
 if(!value)draw();
};
document.getElementById("clock").addEventListener("click",()=>Native.toggleTimers());
draw();
</script></body></html>
