 </section>

<script src="wwm_catalog.js"></script><script src="sprite_offline.js"></script><script src="sprite_visual_scale.js"></script><script src="cooldown_estimate.js"></script><script src="despawn_visual.js"></script><script src="pokemon_type_icons.js"></script><script src="pokemon_card_metadata.js"></script><script src="pokemon_card_presentation.js"></script>
<script>
let watchName="",currentIndex=-1,expiresAt=0,ticking=null,currentCoords="";
let coordsNote="",coordsPending=false,coordsRequestSeq=0;
let shareReady=false,shareSent=false,sharePending=false,shareAwaitingOffer=false;
let cooldownLinked=false,cooldownActive=false,cooldownReference=null;
function refreshCooldownButtons(){
 const container=document.getElementById("cooldownControls");
 const confirm=document.getElementById("cooldownConfirm");
 const undo=document.getElementById("cooldownUndo");
 const reset=document.getElementById("cooldownReset");
 if(!container||!confirm||!undo||!reset)return;
 // ON/OFF now lives in Personalização > Info Pokémon.
 container.hidden=true; // temporary: experimental capture buttons are intentionally hidden
 const canConfirm=cooldownLinked&&cooldownActive&&!!window.PokeSearchCooldown?.coords(currentCoords)&&currentIndex>=0;
 confirm.hidden=!canConfirm;
 confirm.disabled=!canConfirm;
 undo.hidden=!cooldownLinked||!cooldownActive||!cooldownReference;
 undo.disabled=undo.hidden;
 reset.hidden=!cooldownLinked||!cooldownActive||!cooldownReference;
 reset.disabled=reset.hidden;
}
window.cooldownChanged=function(data){
 cooldownLinked=data?.linked===true;
 cooldownActive=data?.enabled===true;
 cooldownReference=data?.reference||null;
 refreshCooldownButtons();
 resizeEvolutionPanel();
};
window.cooldownFeedback=function(message){
 const note=document.getElementById("cooldownNote");
 note.textContent=String(message||"");
 note.hidden=true; // retain feedback internally while experimental controls are hidden
 resizeEvolutionPanel();
};
function confirmCooldownUi(){
 if(!cooldownLinked||!window.PokeSearchCooldown?.coords(currentCoords)||currentIndex<0)return;
 Native.confirmCooldownCapture(currentIndex);
}
function resetCooldownUi(){
 if(!cooldownLinked||!cooldownReference)return;
 Native.resetCooldown();
}
function shareUi(){
 const icon=document.getElementById("shareIcon");
 if(icon){
  // A capture report is a manual action; revealing coordinates first is not required.
  const available=Number.isInteger(currentIndex)&&currentIndex>=0&&!shareSent&&!sharePending;
  icon.disabled=!available;
  icon.title=shareSent?"Captura já compartilhada":
   sharePending?"Enviando captura ao chat":
   shareAwaitingOffer?"Preparando confirmação da captura":
   "Capturei Pokémon — compartilhar no chat";
  icon.setAttribute("aria-label",icon.title);
 }
 document.getElementById("captureShare").hidden=!shareReady||shareSent||sharePending;
 if(!shareReady||shareSent)document.getElementById("captureConfirm").hidden=true;
}
window.offerCaptureShare=sourceIndex=>{
 // Ignore callbacks queued for a different card or an old result.
 if(sourceIndex!==currentIndex||shareSent)return;
 shareReady=true;sharePending=false;
 const requested=shareAwaitingOffer;
 shareAwaitingOffer=false;
 shareUi();
 if(requested)showCaptureConfirmation();
 resizeEvolutionPanel();
};
window.captureShareAvailability=(ok,message)=>{
 if(ok)return;
 shareAwaitingOffer=false;
 shareUi();
 const status=document.getElementById("captureStatus");
 status.textContent=String(message||"Esta captura não está disponível no momento.");
 status.hidden=false;
 resizeEvolutionPanel();
};
function showCaptureConfirmation(){
 if(!shareReady||shareSent||sharePending||currentIndex<0)return;
 const confirmation=document.getElementById("captureConfirm");
 confirmation.querySelector("span").textContent="Você capturou "+watchName+"?";
 confirmation.hidden=false;
 resizeEvolutionPanel();
}
function captureShareAsk(){
 if(shareSent||sharePending||shareAwaitingOffer||currentIndex<0)return;
 if(shareReady){showCaptureConfirmation();return;}
 shareAwaitingOffer=true;
 shareUi();
 if(typeof Native.prepareCaptureShare==="function"){
  Native.prepareCaptureShare(currentIndex);
 }else{
  window.captureShareAvailability(false,"Atualize o aplicativo para compartilhar capturas.");
 }
}
function captureShareCancel(){
 shareAwaitingOffer=false;
 document.getElementById("captureConfirm").hidden=true;
 shareUi();resizeEvolutionPanel();
}
function captureShareConfirm(){
 if(!shareReady||shareSent||sharePending||currentIndex<0)return;
 sharePending=true;
 document.getElementById("captureConfirm").hidden=true;
 shareUi();
 Native.confirmCaptureShare(currentIndex);
}
window.captureShareFeedback=(ok,message)=>{
 sharePending=false;if(ok){shareSent=true;shareReady=false;}
 else shareReady=true;
 shareUi();
 const status=document.getElementById("captureStatus");
 status.textContent=String(message||"");
 status.hidden=!status.textContent;
 resizeEvolutionPanel();
};
function coordButtons(){
 const fetch=document.getElementById("coords"),copy=document.getElementById("copy");
 if(!fetch||!copy)return;
 fetch.disabled=coordsPending;
 const valid=window.PokeSearchCooldown?.coords?.(currentCoords);
 fetch.className=coordsPending?"isPending":valid?"hasCoords":"";
 // Exact numeric coordinates replace Get coords in the same button.
 // Tapping the numbers copies again without a new reveal.
 fetch.textContent=coordsPending?"⌛ Pegando coordenadas...":valid?
  String(currentCoords).trim().replace(";",", ")+(window.copyVisualUntil>Date.now()?"  ✓":""):
  "⌖ Pegar Coordenadas";
 fetch.title=valid?"Toque nas coordenadas para copiar novamente":
  "Pegar e copiar coordenadas";
 fetch.setAttribute("aria-label",fetch.title);
 copy.hidden=true;
}
function requestCoordsUi(){
 if(window.PokeSearchCooldown?.coords?.(currentCoords)){
  Native.copyCoords(currentCoords);return;
 }
 if(coordsPending||!Number.isInteger(currentIndex)||currentIndex<0)return;
 coordsPending=true;coordsNote="Consultando coordenadas do Pokémon no site...";
 const seq=++coordsRequestSeq;
 setTimeout(()=>{
  if(seq!==coordsRequestSeq||!coordsPending)return;
  coordsPending=false;
  coordsNote="O site não respondeu à solicitação. Toque em Get coords para tentar novamente.";
  const label=document.getElementById("coordsValue");
  if(label)label.textContent=coordsNote;
  const status=document.getElementById("coordsStatus");
  if(status)status.hidden=false;
  coordButtons();
 },9000);
 coordButtons();
 const label=document.getElementById("coordsValue");
 if(label)label.textContent=coordsNote;
 const status=document.getElementById("coordsStatus");
 if(status)status.hidden=false;
 Native.coords(currentIndex);
}
function copyCoords(){
 if(currentCoords)Native.copyCoords(currentCoords);
 else requestCoordsUi();
}
function showCopySuccess(){
 window.copyVisualUntil=Date.now()+1100;
 const copyIdentity=String(currentCoords||"");
 const seq=window.copyVisualGeneration=(Number(window.copyVisualGeneration)||0)+1;
 coordButtons();
 setTimeout(()=>{
  if(window.copyVisualGeneration!==seq||String(currentCoords||"")!==copyIdentity)return;
  window.copyVisualUntil=0;
  coordButtons();
 },1150);
}
window.copyFeedback=msg=>{
 const message=String(msg||"");
 const didCopy=message.startsWith("✓")&&
  !!window.PokeSearchCooldown?.coords?.(currentCoords);
 coordsNote=didCopy?"":message;
 if(didCopy)showCopySuccess();
 const label=document.getElementById("coordsValue");
 if(label&&coordsNote)label.textContent=coordsNote;
 const status=document.getElementById("coordsStatus");
 if(status)status.hidden=!coordsNote;
 coordButtons();
};
function fmt(sec){sec=Math.max(0,Math.floor(sec));return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");}
function updateCountdown(){
 const e=document.getElementById("timer");if(!e)return;
 if(!expiresAt){e.hidden=true;e.className="unknown";return;}
 const remaining=Math.max(0,Math.ceil((expiresAt-Date.now())/1000));
 const state=window.PokeSearchDespawnVisual?.state(remaining)||
  {tone:remaining>900?"good":remaining>300?"warning":
   remaining>120?"pink":"critical",pulse:remaining>0&&remaining<=60};
 e.hidden=false;
 document.getElementById("timeRemaining").textContent=remaining?fmt(remaining):"Expirado";
 e.className=state.tone+(state.pulse?" pulse":"");
 e.title="Despawn: "+(remaining?fmt(remaining):"expirado")+" · "+
  (state.tone==="good"?"Mais de 15 min":state.tone==="warning"?"5–15 min":
   state.tone==="pink"?"2–5 min":"Menos de 2 min");
 if(remaining<=0){
  window.pauseDetailTimer();
  if(Native.expiredResults)Native.expiredResults();
 }
}
let coordsAccountState="unknown",coordsLastQuota={observedOnDevice:0,official:false};
window.coordsAccountUpdated=function(data){
 const next=String(data?.auth||"unknown");
 const allowed=["authenticated","login-required","checking","limited","unknown"];
 const before=coordsAccountState;
 coordsAccountState=allowed.includes(next)?next:"unknown";
 // Never attribute a stale server number to another authenticated account.
 if(before!==coordsAccountState)coordsLastQuota={...coordsLastQuota,official:false};
 window.coordsQuotaUpdated(coordsLastQuota);
};
window.coordsQuotaUpdated=function(data){
 coordsLastQuota=data&&typeof data==="object"?data:{observedOnDevice:0,official:false};
 const el=document.getElementById("coordsQuota");
 if(!el)return;
 const observed=Number.isInteger(data?.observedOnDevice)&&data.observedOnDevice>=0?data.observedOnDevice:0;
 const authoritative=coordsAccountState==="authenticated"&&data?.official===true&&
  Number.isInteger(data.limit)&&data.limit>0&&Number.isInteger(data.remaining)&&
  data.remaining>=0&&data.remaining<=data.limit;

 el.className=authoritative?"official":"";
 // Badge never confuses observed local requests with the full account quota.
 el.textContent=authoritative?String(data.remaining):String(observed);
 el.dataset.scope=authoritative?"official":"local";
 el.setAttribute("aria-label",authoritative?
  "PoGoCoordinates: "+data.remaining+" revelações restantes na última resposta oficial":
  "PoGoCoordinates: "+observed+" revelações observadas neste aparelho; saldo total desconhecido");
 el.title=authoritative?
  "Saldo oficial na última revelação autenticada; pode ter mudado":
  "Usos observados no PokeSearch; não representa o saldo total da conta.";
};
window.coordsResult=function(coords,message){
 coordsRequestSeq++;
 coordsPending=false;
 if(coords){
  currentCoords=coords;coordsNote="";
  if(/copiad/i.test(String(message||""))&&window.PokeSearchCooldown?.coords?.(coords))
   showCopySuccess();
 }else coordsNote=String(message||"Coordenadas indisponíveis");
 coordButtons();
 refreshCooldownButtons();
 const label=document.getElementById("coordsValue");
 if(label)label.textContent=coordsNote||"";
 const status=document.getElementById("coordsStatus");
 if(status)status.hidden=!coordsNote;
 resizeEvolutionPanel();
};
const h=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let detailIdentity="",evolutionExpanded=false;
const evoIdentity=c=>JSON.stringify([
 Number(c?.sourceIndex??-1),String(c?.name||""),String(c?.iv||""),String(c?.cp??"")]);
function resizeEvolutionPanel(){
 requestAnimationFrame(()=>{
  const panel=document.getElementById("panel");
  const height=Math.ceil(panel.scrollHeight)+3;
  Native.resizeDetail(height);
  // The native window resizes on its UI thread. Only enable inner scrolling
  // when expanded evolution data or the physical display forces clipping.
  const recheck=()=>{
   if(!panel?.classList?.toggle)return;
   panel.classList.toggle("needsScroll",panel.scrollHeight>panel.clientHeight+3);
  };
  if(typeof setTimeout==="function")setTimeout(recheck,90);
 });
}
function toggleEvolutionDetails(){
 const section=document.getElementById("evolutions");
 if(section.hidden)return;
 evolutionExpanded=!evolutionExpanded;
 document.getElementById("evoBody").hidden=!evolutionExpanded;
 document.getElementById("evoChevron").textContent=evolutionExpanded?"▴":"▾";
 document.getElementById("evoToggle").setAttribute("aria-expanded",String(evolutionExpanded));
 resizeEvolutionPanel();
}
function evolutionRow(x,first){
 if(!x||typeof x!=="object")return "";
 const rank=Number(x.rank),overall=Number(x.overallRank);
 if(!Number.isInteger(rank)||rank<1||rank>4096)return "";
 const name=String(x.name||"").slice(0,90);
 const pct=/^(?:\d{1,3}),\d{2}$/.test(String(x.statProductPct||""))?
  String(x.statProductPct):"";
 const cp=Number(x.cp),level=Number(x.level);
 const data=[];
 if(Number.isFinite(cp)&&cp>=10&&cp<=10000)data.push("PC "+Math.floor(cp));
 if(Number.isFinite(level)&&level>=1&&level<=55)data.push("Nv "+level.toFixed(1).replace(".",","));
 if(Number.isInteger(overall)&&overall>0)data.push("RG#"+overall);
 let state="";
 if(x.eligible===false)state="Não elegível no nível atual";
 else if(x.eligible===null)state="Elegibilidade não verificada";
 const label=(first?"Atual: ":"↳ ")+name;
 return '<div class="evoLine'+(rank===1&&x.eligible===true?' best':'')+'"><b>'+
  h(label)+'</b> · IV#'+rank+(pct?' · '+h(pct)+'%':"")+
  (data.length?'<div class="evoStats">'+h(data.join(" · "))+'</div>':"")+
  (state?'<div class="evoState">'+h(state)+'</div>':"")+'</div>';
}
window.showEvolutionDetails=payload=>{
 if(!payload||!Array.isArray(payload.leagues)||payload.leagues.length!==3||
    evoIdentity(payload)!==detailIdentity)return false;
 const outer=document.getElementById("evolutions"),body=document.getElementById("evoBody");
 let html="",count=0;
 const labels={gl:"Grande Liga",ul:"Ultra Liga",ml:"Liga Master"};
 for(const league of payload.leagues){
  if(!league||!Object.prototype.hasOwnProperty.call(labels,league.league))continue;
  const entries=Array.isArray(league.evolutions)?league.evolutions.slice(0,24):[];
  const rows=entries.map(e=>evolutionRow(e,false)).filter(Boolean);
  if(!rows.length)continue;
  const own=league.own?evolutionRow({...league.own,name:payload.name},true):"";
  html+='<div class="evoLeague '+league.league+'">'+labels[league.league]+'</div>'+own+rows.join("");
  count+=rows.length;
 }
 if(!count){outer.hidden=true;return false;}
 // LT66: WebView may rerender after each native status tick. Never reset
 // the reader to the top of a long PvP analysis when its content is unchanged.
 const panel=document.getElementById("panel");
 const keepScroll=panel.scrollTop;
 if(body.innerHTML!==html)body.innerHTML=html;
 outer.hidden=false;
 document.getElementById("evoLabel").textContent="Evoluções PvP · "+count+" análises";
 body.hidden=!evolutionExpanded;
 document.getElementById("evoChevron").textContent=evolutionExpanded?"▴":"▾";
 document.getElementById("evoToggle").setAttribute("aria-expanded",String(evolutionExpanded));
 resizeEvolutionPanel();
 requestAnimationFrame(()=>{panel.scrollTop=Math.min(keepScroll,Math.max(0,panel.scrollHeight-panel.clientHeight));});
 return true;
};
const item=(k,v)=>v?'<span class="infoLabel">'+h(k)+':</span><span class="infoValue">'+h(v)+'</span>':"";
window.watchFeedback=watched=>{
 const star=document.getElementById("watch");
 star.className=watched?"isFav":"";
 star.title=watched?"Remover dos favoritos":"Adicionar aos favoritos";
 star.setAttribute("aria-label",star.title);
};
window.pauseDetailTimer=()=>{if(ticking){clearInterval(ticking);ticking=null;}};
window.showDetails=(c,mode,watched)=>{
 const panel=document.getElementById("panel");
 const keepScroll=panel.scrollTop;
 const nextIdentity=evoIdentity(c);
 const changed=detailIdentity!==nextIdentity;
 if(changed){
  detailIdentity=nextIdentity;evolutionExpanded=false;
  coordsRequestSeq++;
  coordsNote="";coordsPending=false;currentCoords=String(c.coords||"");
  window.copyVisualUntil=0;window.copyVisualGeneration=(Number(window.copyVisualGeneration)||0)+1;
  shareReady=false;shareSent=false;sharePending=false;shareAwaitingOffer=false;shareUi();
  const cdNote=document.getElementById("cooldownNote");cdNote.hidden=true;cdNote.textContent="";
  document.getElementById("captureStatus").hidden=true;
  document.getElementById("evolutions").hidden=true;
  document.getElementById("evoBody").hidden=true;
  document.getElementById("evoBody").innerHTML="";
 }
 watchName=String(c.name||"");window.watchFeedback(!!watched);
 currentIndex=Number(c.sourceIndex);
 shareUi();
 if(!currentCoords&&c.coords)currentCoords=String(c.coords);
 coordButtons();
 refreshCooldownButtons();
 const parts=String(c.despawn||"").split(":").map(Number);
 const secs=parts.length===2&&parts.every(Number.isFinite)?parts[0]*60+parts[1]:0;
 // The authorized API supplies an absolute expiry, NOT a legacy MM:SS.
 // Preserve it even when the API returns no "despawn" countdown text.
 const absolute=Number(c.expiresAtMs);
 expiresAt=Number.isFinite(absolute)&&absolute>0?absolute:
   secs?(Number(c.sampledAt)||Date.now())+secs*1000:0;
 window.pauseDetailTimer();
 if(expiresAt)ticking=setInterval(updateCountdown,1000);
 document.getElementById("name").textContent=String(c.name||"Pokémon")+(c.shiny?" ✨":"");
 const presenter=window.PokeSearchCardPresentation,metadata=window.PokeSearchCardMetaData;
 document.getElementById("types").innerHTML=presenter?.types(c,metadata)||"";
 const gender=presenter?.gender(c.gender)||"";
 document.getElementById("dexGender").innerHTML=
  [h(c.number),gender].filter(Boolean).join(" · ");
 document.getElementById("sizeForm").textContent=
  [c.size,c.form].filter(Boolean).join(" · ");
 // Accessible discrete indicators: never visually group a sex icon with XXL.
 document.getElementById("dexGender").innerHTML=
  (c.number?'<span class="dexMeta">'+h(c.number)+'</span>':"")+
  (gender?'<span class="sexChip" title="Sexo" aria-label="Sexo do Pokémon">'+gender+'</span>':"");
 document.getElementById("sizeForm").innerHTML=
  (c.size?'<span class="sizeChip" title="Tamanho" aria-label="Tamanho '+h(c.size)+'">'+h(c.size)+'</span>':"")+
  (c.form?'<span class="formChip">'+h(c.form)+'</span>':"");

 const img=document.getElementById("img"),fallback=document.getElementById("imageFallback");
 // The result list and this separately owned detail WebView MUST resolve
 // identical offline bytes from the APK, without relying on HTTP or a warm
 // WebView cache. Provider/special-form URLs are not rewritten.
 const art=window.PokeSearchOfflineSprite?
   window.PokeSearchOfflineSprite.resolve(c):
   {src:String(c.image||""),original:String(c.image||""),offline:false};
 // Gengar #94 needs an extra reduction for Halloween/costume assets.
 const gd=Number(String(c.number||c.dex||c.pokemon_id||"").replace("#",""));
 const isGengar=gd===94||(/\bgengar\b/i.test(String(c.name||""))&&(gd===0||!Number.isFinite(gd)));
 const fields=[c.costume,c.costume_name,c.costumeName,c.costume_id,c.form,c.form_id,
   c.variant,c.event,c.name,c.image,art.original,art.src].map(x=>String(x??"").slice(0,220)).join(" ");
 const halloweenGengar=isGengar&&(c.isCostume===true||
   /halloween|hallowe|costume|fantasia|disfarce|outfit|event/i.test(fields)||
   (c.costume_id!=null&&Number(c.costume_id)>0));
 document.getElementById("artColumn")?.classList?.toggle?.("gengarSprite",isGengar);
 document.getElementById("artColumn")?.classList?.toggle?.("gengarHalloween",halloweenGengar);
 img.onload=null;img.onerror=null;
 img.style.display="none";fallback.style.display="flex";img.removeAttribute("src");
 let artAttempt=0,displayed=false,verifiedNativeTried=false,loadGeneration=0;
 const nativeFallback=()=>{
  if(verifiedNativeTried)return "";
  verifiedNativeTried=true;
  const engine=window.PokeSearchOfflineSprite;
  return engine?.verifiedBundledData?.(c)||engine?.exactBundledData?.(art)||"";
 };
 const useArt=src=>{
  const generation=++loadGeneration;
  if(!src||!(/^(file:\/\/\/android_asset\/pokemon-sprites\/|https:\/\/|data:image\/)/i.test(src)))return;
  img.onload=()=>{
   if(generation!==loadGeneration)return;
   if(img.naturalWidth>=8&&img.naturalHeight>=8){
    displayed=true;img.style.display="block";fallback.style.display="none";
    if(typeof window!=="undefined")window.PokeSearchSpriteScale?.apply?.(img);
   }
  };
  img.onerror=()=>{
   if(generation!==loadGeneration)return;
   // First recover the precise sprite from the APK through the native bridge;
   // do not substitute a normal variant for an unverified costume/Shiny.
   const direct=nativeFallback();
   if(direct&&direct!==src){useArt(direct);return;}
   if(art.offline&&artAttempt++===0&&art.original&&art.original!==src){
    useArt(art.original);return;
   }
   displayed=false;img.style.display="none";fallback.style.display="flex";
  };
  img.src=src;
  if(img.complete&&img.naturalWidth>=8&&img.naturalHeight>=8)img.onload();
 };
 useArt(art.src);
 // Android WebView can leave a file/remote image pending forever with no
 // error; a strict verified base image can still be restored from our APK.
 const expectedSourceIndex=currentIndex,expectedName=watchName;
 setTimeout(()=>{
  if(!displayed&&img.isConnected&&currentIndex===expectedSourceIndex&&
     watchName===expectedName&&img.naturalWidth<8){
   const direct=nativeFallback();
   if(direct&&img.getAttribute("src")!==direct)useArt(direct);
  }
 },1800);
 const stat=(label,value,css="")=>value?'<span class="'+css+'">'+h(label)+" "+h(value)+"</span>":"";
 const raw=String(c.iv??"").trim();
 const validRaw=/^(?:[0-9]|1[0-5])\/(?:[0-9]|1[0-5])\/(?:[0-9]|1[0-5])$/.test(raw);
 const percent=String(c.ivPercent??"").trim();
 const validPct=/^(?:0|[1-9][0-9]?|100)$/.test(percent);
 const rawPct=validRaw?Math.round(raw.split("/").map(Number)
  .reduce((sum,n)=>sum+n,0)*100/45):null;
 const showPct=validPct&&(rawPct===null||rawPct===Number(percent));
 const showRaw=validRaw&&(!validPct||rawPct===Number(percent));
 const statTile=(label,value)=>'<div class="statTile"><div class="statHeading">'+h(label)+'</div><div class="statValue">'+h(value===null||value===undefined||value===""?"—":value)+'</div></div>';
 document.getElementById("major").innerHTML='<div class="statTile ivTile"><div class="statHeading">IV</div>'+
  (showPct?'<span class="ivPercent">'+h(percent)+'%</span>':"")+
  '<span class="ivTypes" aria-label="Tipos do Pokémon">'+document.getElementById("types").innerHTML+'</span>'+
  '<div class="statValue red">'+h(showRaw?raw:"—")+'</div></div>'+
  statTile("PC",c.cp)+statTile("Nv.",c.level);
 const rankLine=document.getElementById("rankLine");
 rankLine.textContent=c.rank?"Rank "+String(c.rank):"";
 rankLine.hidden=!c.rank;
 const movesHtml=presenter?.moves(c.moves,c,metadata)||h(c.moves||"");
 const locationFlag=presenter?.locationCountryFlag(c.location)||"";
 const locationText=String(c.location||"");
 document.getElementById("info").innerHTML=
  (c.moves?'<span class="infoLabel">Golpes:</span><span class="infoValue">'+movesHtml+'</span>':"")+
  item("Distância",c.distance)+
  (c.location?'<span class="infoLabel">Local:</span><span class="infoValue">'+h(locationFlag?locationFlag+" "+locationText:locationText)+'</span>':"")+
  '<div id="coordsStatus" role="status" hidden><span id="coordsValue"></span></div>';
 updateCountdown();
 resizeEvolutionPanel();
 if(changed)panel.scrollTop=0;
 else requestAnimationFrame(()=>{panel.scrollTop=Math.min(keepScroll,
  Math.max(0,panel.scrollHeight-panel.clientHeight));});
};
</script></body></html>
