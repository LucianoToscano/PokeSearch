<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:#fff;font:11px Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#panel{max-height:calc(100vh - 2px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin;border:1px solid #ffffff50;border-radius:13px;background:rgba(9,13,20,.73);box-shadow:0 5px 18px #0007;padding:9px;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
#header{display:flex;align-items:center;gap:5px;min-width:0}
#img{width:35px;height:35px;object-fit:contain}
#imageFallback{display:flex;align-items:center;justify-content:center;
 width:35px;height:35px;font-size:23px;color:#d5e3ef;opacity:.75}
#names{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#names b{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:12px}
#names small{color:#bfc8d4;font-size:9px}
#x{border-radius:6px;background:#ffffff22;font-size:13px;width:23px;height:23px}
#major{font-weight:bold;color:#fff;line-height:1.5;margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
#major span{border-radius:5px;background:#ffffff1b;padding:2px 5px;font-size:10px}
#major .red{color:#ff9bb0}
#info{color:#d8e0ea;line-height:1.38;margin-top:5px;font-size:10px;overflow-wrap:anywhere}
#info div{margin:2px 0}
#info em{color:#afb9c8;font-style:normal}
#watch{margin-top:6px;width:100%;border:1px solid #edc95778;background:#e8bf3d24;border-radius:7px;padding:6px;font-weight:bold;color:#ffecba;display:flex;align-items:center;justify-content:center;gap:5px}
#watch svg{width:14px;height:14px;flex-shrink:0}
/* RANK-EVO-DETAIL-02: folded section; details always scroll inside the same 226dp card. */
#evolutions[hidden],#evoBody[hidden]{display:none}
#evolutions{margin-top:6px;border:1px solid #ffffff28;border-radius:7px;overflow:hidden}
#evoToggle{width:100%;text-align:left;background:#24425699;color:#d5ecff;
 padding:6px 7px;font-size:10px;font-weight:800;display:flex;justify-content:space-between;gap:4px}
#evoBody{max-height:none;overflow:visible;touch-action:auto;padding:3px 6px}
#panel{height:auto;max-height:calc(100vh - 2px);overflow-y:auto;overflow-x:hidden;
 overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;}
.evoLeague{font-weight:900;color:#cbd8e7;font-size:10px;border-bottom:1px solid #ffffff24;padding:4px 0 2px}
.evoLeague.gl{color:#68b7ff}.evoLeague.ul{color:#ffd17c}.evoLeague.ml{color:#cda9ff}
.evoLine{font-size:10px;line-height:1.32;padding:3px 0;border-bottom:1px solid #ffffff12}
.evoLine b{font-weight:900}.evoLine.best b{color:#83e7bb}
.evoStats{font-size:9px;color:#c1ced9}.evoState{font-size:9px;color:#ffb3ac;font-weight:800}
#copy{margin-top:5px;width:100%;border:1px solid #ffffff35;background:#ffffff22;border-radius:7px;padding:7px;font-weight:bold}#coords{margin-top:7px;width:100%;border-radius:7px;padding:7px;background:#eb2850ce;font-weight:bold}
#coords,#copy{min-height:36px;touch-action:manipulation;position:relative;z-index:1}
#coords:disabled,#copy:disabled{opacity:.65;cursor:default}
#coords:focus-visible,#copy:focus-visible{outline:2px solid #8be1cb;outline-offset:1px}
#coordsQuota{margin:4px 1px 0;padding:4px 6px;background:#ffffff13;border:1px solid #ffffff25;border-radius:6px;color:#d6dce4;font:500 9px/1.35 Roboto,Arial,sans-serif;text-align:center;overflow-wrap:break-word}
#coordsQuota.official{color:#a9f0cf;border-color:#6ad5a549}
#coordsQuota{display:block;width:100%;min-height:26px;touch-action:manipulation}
#captureShare[hidden],#captureConfirm[hidden]{display:none!important}
#captureShare{margin-top:5px;display:block;width:100%;padding:5px;border-radius:7px;
 border:1px solid #e3c96955;background:#d4b65b18;color:#f5dda4;font-size:10px}
#captureConfirm{margin-top:4px;display:flex;align-items:center;gap:4px;font-size:10px}
#captureConfirm>span{flex:1}
#captureConfirm>button{background:#ffffff26;border-radius:5px;padding:5px 8px}
#captureStatus[hidden]{display:none}#captureStatus{display:block;margin-top:3px;color:#a7eac7;font-size:10px}
</style></head><body><div id="panel">
 <div id="header">
  <img id="img" alt="" style="display:none"><span id="imageFallback" aria-label="Imagem indisponível">◇</span>
  <div id="names"><b id="name">Pokémon</b><small id="sub"></small></div>
  <button id="x" onclick="Native.hideDetail()">×</button>
 </div>
 <div id="major"></div><div id="info"></div>
 <section id="evolutions" hidden aria-label="Avaliação de evoluções PvP">
  <button id="evoToggle" type="button" aria-expanded="false" onclick="toggleEvolutionDetails()">
   <span id="evoLabel">Evoluções PvP</span><span id="evoChevron">▾</span>
  </button>
  <div id="evoBody" hidden></div>
 </section>
 <button id="watch" onclick="Native.toggleWatch(watchName)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.4 7.1 1-5.1 4.9 1.2 7-6.3-3.3-6.3 3.3 1.2-7L1.8 9.4l7.1-1L12 2Z"/></svg> <span id="watchLabel">Adicionar aos favoritos</span></button>
 <button id="coords" onclick="requestCoordsUi()">⌖ Get coords</button>
  <button id="coordsQuota" type="button" aria-live="polite" onclick="Native.refreshCoordsAccount()" title="Verificar sessão do PoGoCoordinates sem gastar revelações">⌖ Conta PoGo não verificada · Saldo desconhecido · Atualizar ⟳</button>
  <button id="copy" onclick="copyCoords()">⧉ Copiar coordenadas</button>
 <button id="captureShare" hidden onclick="captureShareAsk()">🎉 Capturou? Compartilhar no chat</button>
 <div id="captureConfirm" hidden><span>Capturou mesmo?</span>
 <button onclick="captureShareCancel()">Não</button>
 <button onclick="captureShareConfirm()">✓ Sim, compartilhar</button></div>
 <small id="captureStatus" hidden></small>
</div>
<script src="wwm_catalog.js"></script><script src="sprite_offline.js"></script>
<script>
let watchName="",currentIndex=-1,expiresAt=0,ticking=null,currentCoords="";
let coordsNote="",coordsPending=false,coordsRequestSeq=0;
let shareReady=false,shareSent=false,sharePending=false;
function shareUi(){
 document.getElementById("captureShare").hidden=!shareReady||shareSent||sharePending;
 if(!shareReady||shareSent)document.getElementById("captureConfirm").hidden=true;
}
window.offerCaptureShare=()=>{
 if(shareSent)return;
 shareReady=true;sharePending=false;shareUi();resizeEvolutionPanel();
};
function captureShareAsk(){
 if(!shareReady||shareSent||sharePending)return;
 document.getElementById("captureShare").hidden=true;
 document.getElementById("captureConfirm").hidden=false;
 resizeEvolutionPanel();
}
function captureShareCancel(){
 document.getElementById("captureConfirm").hidden=true;
 shareUi();resizeEvolutionPanel();
}
function captureShareConfirm(){
 if(!shareReady||shareSent||sharePending||currentIndex<0)return;
 sharePending=true;
 document.getElementById("captureConfirm").hidden=true;
 shareUi();
 Native.confirmCaptureShare(currentIndex);
}
window.captureShareFeedback=(ok,message)=>{
 sharePending=false;if(ok){shareSent=true;shareReady=false;}
 else shareReady=true;
 shareUi();
 const status=document.getElementById("captureStatus");
 status.textContent=String(message||"");
 status.hidden=!status.textContent;
 resizeEvolutionPanel();
};
function coordButtons(){
 const fetch=document.getElementById("coords"),copy=document.getElementById("copy");
 if(!fetch||!copy)return;
 fetch.disabled=coordsPending;
 fetch.textContent=coordsPending?"⌛ Obtendo coordenadas...":"⌖ Get coords";
 copy.disabled=coordsPending&&!currentCoords;
 copy.textContent=currentCoords?"⧉ Copiar coordenadas":
  coordsPending?"⌛ Aguardando coordenadas":"⧉ Obter e copiar";
}
function requestCoordsUi(){
 if(coordsPending||!Number.isInteger(currentIndex)||currentIndex<0)return;
 coordsPending=true;coordsNote="Consultando coordenadas do Pokémon no site...";
 const seq=++coordsRequestSeq;
 setTimeout(()=>{
  if(seq!==coordsRequestSeq||!coordsPending)return;
  coordsPending=false;
  coordsNote="O site não respondeu à solicitação. Toque em Get coords para tentar novamente.";
  const label=document.getElementById("coordsValue");
  if(label)label.textContent=coordsNote;
  coordButtons();
 },9000);
 coordButtons();
 const label=document.getElementById("coordsValue");
 if(label)label.textContent=coordsNote;
 Native.coords(currentIndex);
}
function copyCoords(){
 if(currentCoords)Native.copyCoords(currentCoords);
 else requestCoordsUi();
}
window.copyFeedback=msg=>{
 coordsNote=String(msg||"");
 const label=document.getElementById("coordsValue");
 if(label&&coordsNote)label.textContent=coordsNote;
 coordButtons();
};
function fmt(sec){sec=Math.max(0,Math.floor(sec));return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");}
function updateCountdown(){
 const e=document.getElementById("timer");
 if(!e||!expiresAt)return;
 const remaining=(expiresAt-Date.now())/1000;
 e.textContent=remaining>0?fmt(remaining):"Expirado";
 if(remaining<=0){
  window.pauseDetailTimer();
  if(Native.expiredResults)Native.expiredResults();
 }
}
let coordsAccountState="unknown",coordsLastQuota={observedOnDevice:0,official:false};
window.coordsAccountUpdated=function(data){
 const next=String(data?.auth||"unknown");
 const allowed=["authenticated","login-required","checking","limited","unknown"];
 const before=coordsAccountState;
 coordsAccountState=allowed.includes(next)?next:"unknown";
 // Never attribute a stale server number to another authenticated account.
 if(before!==coordsAccountState)coordsLastQuota={...coordsLastQuota,official:false};
 window.coordsQuotaUpdated(coordsLastQuota);
};
window.coordsQuotaUpdated=function(data){
 coordsLastQuota=data&&typeof data==="object"?data:{observedOnDevice:0,official:false};
 const el=document.getElementById("coordsQuota");
 if(!el)return;
 const observed=Number.isInteger(data?.observedOnDevice)&&data.observedOnDevice>=0?data.observedOnDevice:0;
 const authoritative=coordsAccountState==="authenticated"&&data?.official===true&&
  Number.isInteger(data.limit)&&data.limit>0&&Number.isInteger(data.remaining)&&
  data.remaining>=0&&data.remaining<=data.limit;
 const account=coordsAccountState==="authenticated"?"PoGo conectado":
  coordsAccountState==="login-required"?"Login PoGo necessário":
  coordsAccountState==="checking"?"Conferindo sessão PoGo":
  coordsAccountState==="limited"?"Verificação limitada":"Conta PoGo não verificada";
 el.classList.toggle("official",authoritative);
 el.textContent=authoritative?
  account+" · Último saldo: "+data.remaining+"/"+data.limit+" · Usos locais: "+observed+" ⟳":
  account+" · Saldo desconhecido · Usos locais: "+observed+" ⟳";
 el.title=authoritative?
  "Saldo da última revelação autenticada, não sincronizado continuamente. Toque para conferir a sessão.":
  "Contagem local de revelações neste PokeSearch, inclusive outras contas; não inclui usos no site. Toque para conferir a sessão.";
};
window.coordsResult=function(coords,message){
 coordsRequestSeq++;
 coordsPending=false;
 if(coords){currentCoords=coords;coordsNote="";}
 else coordsNote=String(message||"Coordenadas indisponíveis");
 coordButtons();
 const label=document.getElementById("coordsValue");
 if(label)label.textContent=currentCoords||coordsNote||"Toque em Get coords";
};
const h=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let detailIdentity="",evolutionExpanded=false;
const evoIdentity=c=>JSON.stringify([
 Number(c?.sourceIndex??-1),String(c?.name||""),String(c?.iv||""),String(c?.cp??"")]);
function resizeEvolutionPanel(){
 requestAnimationFrame(()=>Native.resizeDetail(
  Math.ceil(document.getElementById("panel").scrollHeight)+2));
}
function toggleEvolutionDetails(){
 const section=document.getElementById("evolutions");
 if(section.hidden)return;
 evolutionExpanded=!evolutionExpanded;
 document.getElementById("evoBody").hidden=!evolutionExpanded;
 document.getElementById("evoChevron").textContent=evolutionExpanded?"▴":"▾";
 document.getElementById("evoToggle").setAttribute("aria-expanded",String(evolutionExpanded));
 resizeEvolutionPanel();
}
function evolutionRow(x,first){
 if(!x||typeof x!=="object")return "";
 const rank=Number(x.rank),overall=Number(x.overallRank);
 if(!Number.isInteger(rank)||rank<1||rank>4096)return "";
 const name=String(x.name||"").slice(0,90);
 const pct=/^(?:\d{1,3}),\d{2}$/.test(String(x.statProductPct||""))?
  String(x.statProductPct):"";
 const cp=Number(x.cp),level=Number(x.level);
 const data=[];
 if(Number.isFinite(cp)&&cp>=10&&cp<=10000)data.push("PC "+Math.floor(cp));
 if(Number.isFinite(level)&&level>=1&&level<=55)data.push("Nv "+level.toFixed(1).replace(".",","));
 if(Number.isInteger(overall)&&overall>0)data.push("RG#"+overall);
 let state="";
 if(x.eligible===false)state="Não elegível no nível atual";
 else if(x.eligible===null)state="Elegibilidade não verificada";
 const label=(first?"Atual: ":"↳ ")+name;
 return '<div class="evoLine'+(rank===1&&x.eligible===true?' best':'')+'"><b>'+
  h(label)+'</b> · IV#'+rank+(pct?' · '+h(pct)+'%':"")+
  (data.length?'<div class="evoStats">'+h(data.join(" · "))+'</div>':"")+
  (state?'<div class="evoState">'+h(state)+'</div>':"")+'</div>';
}
window.showEvolutionDetails=payload=>{
 if(!payload||!Array.isArray(payload.leagues)||payload.leagues.length!==3||
    evoIdentity(payload)!==detailIdentity)return false;
 const outer=document.getElementById("evolutions"),body=document.getElementById("evoBody");
 let html="",count=0;
 const labels={gl:"Grande Liga",ul:"Ultra Liga",ml:"Liga Master"};
 for(const league of payload.leagues){
  if(!league||!Object.prototype.hasOwnProperty.call(labels,league.league))continue;
  const entries=Array.isArray(league.evolutions)?league.evolutions.slice(0,24):[];
  const rows=entries.map(e=>evolutionRow(e,false)).filter(Boolean);
  if(!rows.length)continue;
  const own=league.own?evolutionRow({...league.own,name:payload.name},true):"";
  html+='<div class="evoLeague '+league.league+'">'+labels[league.league]+'</div>'+own+rows.join("");
  count+=rows.length;
 }
 if(!count){outer.hidden=true;return false;}
 // LT66: WebView may rerender after each native status tick. Never reset
 // the reader to the top of a long PvP analysis when its content is unchanged.
 const panel=document.getElementById("panel");
 const keepScroll=panel.scrollTop;
 if(body.innerHTML!==html)body.innerHTML=html;
 outer.hidden=false;
 document.getElementById("evoLabel").textContent="Evoluções PvP · "+count+" análises";
 body.hidden=!evolutionExpanded;
 document.getElementById("evoChevron").textContent=evolutionExpanded?"▴":"▾";
 document.getElementById("evoToggle").setAttribute("aria-expanded",String(evolutionExpanded));
 resizeEvolutionPanel();
 requestAnimationFrame(()=>{panel.scrollTop=Math.min(keepScroll,Math.max(0,panel.scrollHeight-panel.clientHeight));});
 return true;
};
const item=(k,v)=>v?'<div><em>'+h(k)+':</em> '+h(v)+'</div>':"";
window.watchFeedback=watched=>{
 document.getElementById("watchLabel").textContent=watched?"★ Favorito · remover":"☆ Adicionar aos favoritos";
};
window.pauseDetailTimer=()=>{if(ticking){clearInterval(ticking);ticking=null;}};
window.showDetails=(c,mode,watched)=>{
 const panel=document.getElementById("panel");
 const keepScroll=panel.scrollTop;
 const nextIdentity=evoIdentity(c);
 const changed=detailIdentity!==nextIdentity;
 if(changed){
  detailIdentity=nextIdentity;evolutionExpanded=false;
  coordsRequestSeq++;
  coordsNote="";coordsPending=false;currentCoords=String(c.coords||"");
  shareReady=false;shareSent=false;sharePending=false;shareUi();
  document.getElementById("captureStatus").hidden=true;
  document.getElementById("evolutions").hidden=true;
  document.getElementById("evoBody").hidden=true;
  document.getElementById("evoBody").innerHTML="";
 }
 watchName=String(c.name||"");window.watchFeedback(!!watched);
 currentIndex=Number(c.sourceIndex);
 if(!currentCoords&&c.coords)currentCoords=String(c.coords);
 coordButtons();
 const parts=String(c.despawn||"").split(":").map(Number);
 const secs=parts.length===2&&parts.every(Number.isFinite)?parts[0]*60+parts[1]:0;
 // The authorized API supplies an absolute expiry, NOT a legacy MM:SS.
 // Preserve it even when the API returns no "despawn" countdown text.
 const absolute=Number(c.expiresAtMs);
 expiresAt=Number.isFinite(absolute)&&absolute>0?absolute:
   secs?(Number(c.sampledAt)||Date.now())+secs*1000:0;
 window.pauseDetailTimer();
 if(expiresAt)ticking=setInterval(updateCountdown,1000);
 document.getElementById("name").textContent=String(c.name||"Pokémon")+(c.shiny?" ✨":"");
 document.getElementById("sub").textContent=[c.number,c.gender,c.size,c.form].filter(Boolean).join(" · ");
 const img=document.getElementById("img"),fallback=document.getElementById("imageFallback");
 // The result list and this separately owned detail WebView MUST resolve
 // identical offline bytes from the APK, without relying on HTTP or a warm
 // WebView cache. Provider/special-form URLs are not rewritten.
 const art=window.PokeSearchOfflineSprite?
   window.PokeSearchOfflineSprite.resolve(c):
   {src:String(c.image||""),original:String(c.image||""),offline:false};
 img.onload=null;img.onerror=null;
 img.style.display="none";fallback.style.display="flex";img.removeAttribute("src");
 let artAttempt=0,displayed=false,verifiedNativeTried=false,loadGeneration=0;
 const nativeFallback=()=>{
  if(verifiedNativeTried)return "";
  verifiedNativeTried=true;
  const engine=window.PokeSearchOfflineSprite;
  return engine?.verifiedBundledData?.(c)||engine?.exactBundledData?.(art)||"";
 };
 const useArt=src=>{
  const generation=++loadGeneration;
  if(!src||!(/^(file:\/\/\/android_asset\/pokemon-sprites\/|https:\/\/|data:image\/)/i.test(src)))return;
  img.onload=()=>{
   if(generation!==loadGeneration)return;
   if(img.naturalWidth>=8&&img.naturalHeight>=8){
    displayed=true;img.style.display="block";fallback.style.display="none";
   }
  };
  img.onerror=()=>{
   if(generation!==loadGeneration)return;
   // First recover the precise sprite from the APK through the native bridge;
   // do not substitute a normal variant for an unverified costume/Shiny.
   const direct=nativeFallback();
   if(direct&&direct!==src){useArt(direct);return;}
   if(art.offline&&artAttempt++===0&&art.original&&art.original!==src){
    useArt(art.original);return;
   }
   displayed=false;img.style.display="none";fallback.style.display="flex";
  };
  img.src=src;
  if(img.complete&&img.naturalWidth>=8&&img.naturalHeight>=8)img.onload();
 };
 useArt(art.src);
 // Android WebView can leave a file/remote image pending forever with no
 // error; a strict verified base image can still be restored from our APK.
 const expectedSourceIndex=currentIndex,expectedName=watchName;
 setTimeout(()=>{
  if(!displayed&&img.isConnected&&currentIndex===expectedSourceIndex&&
     watchName===expectedName&&img.naturalWidth<8){
   const direct=nativeFallback();
   if(direct&&img.getAttribute("src")!==direct)useArt(direct);
  }
 },1800);
 const stat=(label,value,css="")=>value?'<span class="'+css+'">'+h(label)+" "+h(value)+"</span>":"";
 const raw=String(c.iv??"").trim();
 const validRaw=/^(?:[0-9]|1[0-5])\/(?:[0-9]|1[0-5])\/(?:[0-9]|1[0-5])$/.test(raw);
 const percent=String(c.ivPercent??"").trim();
 const validPct=/^(?:0|[1-9][0-9]?|100)$/.test(percent);
 const rawPct=validRaw?Math.round(raw.split("/").map(Number)
  .reduce((sum,n)=>sum+n,0)*100/45):null;
 const showPct=validPct&&(rawPct===null||rawPct===Number(percent));
 const showRaw=validRaw&&(!validPct||rawPct===Number(percent));
 document.getElementById("major").innerHTML=
  stat("PC",c.cp)+stat("Nv.",c.level)+
  stat("IV%",showPct?percent+"%":"","red")+
  stat("A/D/S",showRaw?raw:"","red")+stat("Rank",c.rank);
 document.getElementById("info").innerHTML=
  item("Golpes",c.moves)+item("Local",c.location)+item("Distância",c.distance)+
  (expiresAt?'<div><span id="timer" aria-label="Tempo até desaparecer"></span></div>':
    (c.despawn?'<div>'+h(c.despawn)+'</div>':""))+
  '<div><em>Coordenadas:</em> <span id="coordsValue">'+
  h(currentCoords||coordsNote||"Toque em Get coords")+'</span></div>';
 updateCountdown();
 resizeEvolutionPanel();
 if(changed)panel.scrollTop=0;
 else requestAnimationFrame(()=>{panel.scrollTop=Math.min(keepScroll,
  Math.max(0,panel.scrollHeight-panel.clientHeight));});
};
</script></body></html>
