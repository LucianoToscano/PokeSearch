<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>

/* PokeSearch dock compact styling */
#choices.locationPanel{width:232px;max-width:calc(100vw - 8px);padding:5px;background:#151c27ed;border:1px solid #ffffff38}

#choices.locationPanel .locTitleHelp{appearance:none;border:0;background:transparent;

#choices .locCooldownPreview.is-visible{opacity:1}

/* LT216: same always-visible compact 16-row table as Pokemon Location.
   Never inherit the ordinary 145px !important locationPanel restriction.
   Full table is displayed at once without ANY internal scroll container. */
#choices.locationCooldownTable{
 box-sizing:border-box;display:block;top:34px;left:0;

</style></head><body>
<div id="controls" role="toolbar" aria-label="Controles Doce Raro">
<button id="location" aria-label="Localização e raio" onclick="openPanel('location')" title="Localização"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></button>
<button id="refresh" aria-label="Toque: atualizar; segure: intervalo" title="Atualizar · segurar: OFF, 3, 5, 10, 15 ou 20 minutos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M5.5 9A7 7 0 0 1 18 7l2 4M4 13l2 4a7 7 0 0 0 12.5-2"/></svg><span id="period" class="autoTime">3m</span></button>
<button id="infos" aria-label="Mostrar ou ocultar informações" onclick="openPanel('infos')" title="Informações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6a9 9 0 0 1 9 6 9 9 0 0 1-18 0 9 9 0 0 1 9-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
<button id="close" title="Fechar menu" aria-label="Recolher opções" onclick="Native.closeCandyMenu()">×</button>
</div>
<div id="choices" role="group"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
let settings={coords:"",radius:1000,period:3,name:false,location:false,despawn:true,distance:false,pendingCandyPickup:false,showCollected:false,hasCollected:false,candyAutoPickupOptIn:false,candyAutoPickupActive:false};
let currentPanel="";
let candyLocationSession=0,candyLocationDraftDirty=false,candyLocationDraft=null;
let candyCooldownPreviewTimer=null;
// Advisory distances already used by the app's CandyCooldownPolicy and Pokemon
// Location reference. A search radius is NOT the actual distance traveled.
const CANDY_COOLDOWN_REFERENCE=Object.freeze([
 ["< 10 m","0s"],["10 – 99 m","3s"],["100 – 499 m","15s"],
 ["500 – 999 m","30s"],["1 – 4 km","2m"],["5 – 9 km","6m"],
 ["10 – 24 km","11m"],["25 – 29 km","14m"],["30 – 64 km","22m"],
 ["65 – 80 km","25m"],["81 – 99 km","35m"],["100 – 249 km","45m"],
 ["250 – 499 km","1h"],["500 – 749 km","1h 15m"],
 ["750 – 999 km","1h 30m"],["≥ 1000 km","2h"]
]);
function candyCooldownReferenceForKm(raw){
 const km=Math.max(0,Math.min(1000,Math.round(Number(raw)||0)));
 const index=km===0?0:km<=4?4:km<=9?5:km<=24?6:km<=29?7:
  km<=64?8:km<=80?9:km<=99?10:km<=249?11:km<=499?12:
  km<=749?13:km<=999?14:15;
 return CANDY_COOLDOWN_REFERENCE[index];
}
function renderCandyCooldownReference(){
 const el=$("choices");
 el.className="visible locationCooldownTable";
 const rows=CANDY_COOLDOWN_REFERENCE.map(([d,t])=>
  '<div class="candyCooldownRow" role="listitem"><span>'+d+'</span><span>'+t+'</span></div>').join("");
 el.innerHTML='<button type="button" class="candyCooldownBack" onclick="backToCandyLocation()" aria-label="Voltar à Localização">‹ Localização</button>'+
  '<div class="candyCooldownHead"><span>Distância</span><span>Cooldown</span></div>'+
  '<div class="candyCooldownRows" role="list" aria-label="16 distâncias e tempos de cooldown">'+rows+'</div>'+
  '<p class="candyCooldownNotice">Estimativa não oficial · entre coletas</p>';
 // 34px controls + 22px back + 18px header + 16×18px lines + 12px
 // disclaimer + 9px card gaps = 383px total. Use 396dp native hitbox.
 requestHeight(396,false);
}
function showCandyCooldownReference(){
 if(currentPanel!=="location")return;
 candyLocationDraft={coords:$("candyCoords")?.value||"",
   radius:$("candyRadius")?.value||"",
   slider:$("candyRadiusSlider")?.value||"1",dirty:candyLocationDraftDirty};
 currentPanel="location-cooldown";
 renderPanel();
}
function backToCandyLocation(){
 if(currentPanel!=="location-cooldown")return;
 currentPanel="location";renderPanel();
}
function showCandyCooldownPreview(){
 const slide=$("candyRadiusSlider"),preview=$("candyCooldownPreview");
 if(!slide||!preview)return;
 const km=Number(slide.value)||0,[tier,wait]=candyCooldownReferenceForKm(km);
 preview.textContent=tier+" · ≈"+wait;
 preview.style.setProperty("--loc-preview-position",Math.max(8,Math.min(92,km/10))+"%");
 preview.title="Simulação para "+km+" km, não é um cooldown real.";
 slide.setAttribute("aria-valuetext",km+" km de raio; referência ≈"+wait);
 preview.classList.add("is-visible");
 if(candyCooldownPreviewTimer!==null)clearTimeout(candyCooldownPreviewTimer);
 candyCooldownPreviewTimer=setTimeout(()=>{preview.classList.remove("is-visible");
   candyCooldownPreviewTimer=null;},1350);
}

// Same colors, opacity formula and blur as visual_editor.js for P1/P2.
function applyCandyMenuTheme(mode,transparency,blur){
 const light=mode==="light";
 const t=Math.max(0,Math.min(100,Number(transparency)||0));
 const b=Math.max(0,Math.min(16,Number(blur)||0));
 const base=light?"255,255,255":"15,19,26";
 const rgba=a=>"rgba("+base+","+a.toFixed(2)+")";
 const readable=a=>"rgba("+base+","+(1-Math.pow(a/100,2.8)).toFixed(3)+")";
 const root=document.documentElement;
 const set=(key,value)=>root.style.setProperty("--visual-menu-"+key,value);
 set("bg",rgba(1-t/100));
 set("button-bg",rgba(1-t/100));
 set("readable-bg",readable(t));
 set("readable-button-bg",readable(Math.min(100,t+12)));
 set("border","rgba("+(light?"49,69,91":"227,233,241")+","+
     ((1-t/100)*.45).toFixed(2)+")");
 set("tile-shadow",t===100?"none":
     "0 1px 3px rgba(0,0,0,"+((1-t/100)*.36).toFixed(2)+")");
 set("fg",light?"#152231":"#f2f7fc");
 set("blur",b+"px");
 document.body.classList.toggle("visual-light-menu",light);
}
window.applyCandyMenuTheme=applyCandyMenuTheme;
function setCandyRefreshState(state) {
 const refreshing=!!(state&&state.busy);
 const waiting=!!(state&&!refreshing&&(state.pending||state.blocked));
 const button=$("refresh");
 button.classList.toggle("refreshing",refreshing);
 button.classList.toggle("waiting",waiting);
 button.setAttribute("aria-busy",refreshing?"true":"false");
 button.setAttribute("aria-label",refreshing?"Atualizando Doce Raro":
   waiting?"Aguardando atualização do Doce Raro":
   "Toque: atualizar; segure: intervalo");
}
function syncCandy(json) {
 try{settings=Object.assign(settings,JSON.parse(json||"{}"));}catch(e){}
 $("period").textContent=settings.period===0?"OFF":String(settings.period||3)+"m";
 $("location").classList.toggle("locOn",!!settings.coords);
 $("infos").classList.toggle("active",!!(settings.name||settings.location||settings.distance));
 if(currentPanel==="infos"||currentPanel==="period")renderPanel();
 // Do not rebuild the location editor while a user is typing.
}
function requestHeight(height,focus) {
 Native.candyMenuHeight(Math.max(34,Math.min(currentPanel==="location-cooldown"?396:290,height)),!!focus,currentPanel);
}
function closePanel(){
 currentPanel="";$("choices").innerHTML="";$("choices").className="";
 document.body.classList.remove("expanded");requestHeight(34,false);
}
function openPanel(name){
 if(currentPanel===name){closePanel();return}
 currentPanel=name;
 if(name==="location"){
   candyLocationSession++;candyLocationDraftDirty=false;candyLocationDraft=null;
 }
 renderPanel();
 if(name==="location"&&Native.autoPasteCandyLocation)
   Native.autoPasteCandyLocation(candyLocationSession);
}
const copyGlyph='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h12v12H8zM16 8V4H4v12h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>';
const pasteGlyph='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h2a2 2 0 0 1 4 0h2v3H8zM8 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M12 9v10m-4-4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>';
const applyGlyph='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>';
const clearGlyph='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m5 4v7m4-7v7"/></svg>';
function kmDisplay(meters){return String(Math.round(Number(meters||1000))/1000)}
function renderPanel(){
 const el=$("choices");document.body.classList.add("expanded");
 el.className="visible"+(currentPanel==="location"?" locationPanel":
   currentPanel==="period"?" periodPanel":" infoPanel");
 if(currentPanel==="period"){
   el.innerHTML=[0,3,5,10,15,20].map(n=>'<button type="button" class="periodTile'+
     (settings.period===n?' chosen':'')+'" onclick="choosePeriod('+n+')">'+
     (n===0?'OFF':n)+'</button>').join("");
   requestHeight(34+6*30+5*3+6,false);
  }else if(currentPanel==="infos"){
   // Same compact grid as the Pokémon information menu.
   el.innerHTML='<div class="choiceHeader">Info'+
    '<button type="button" class="autoCaptureToggle'+
    (settings.candyAutoPickupActive?' autoCaptureOn':'')+
    '" onclick="toggleAutoCandy()" title="Detectar coleta automaticamente: '+
    (settings.candyAutoPickupActive?'ligado':'desligado')+
    ' · precisa permitir captura de tela do Android" aria-label="Detecção automática de coleta: '+
    (settings.candyAutoPickupActive?'ligada':'desligada')+
    '">A</button>'+
    (settings.pendingCandyPickup?
     '<button type="button" class="pickedCandy" onclick="confirmPickedCandy()" title="Confirmar doce pego" aria-label="Peguei este doce">✓</button>':'')+
    (settings.hasCollected?
     '<button type="button" class="showCollected" onclick="toggleCollected()" title="'+
     (settings.showCollected?'Ocultar coletados':'Mostrar coletados')+
     '" aria-label="'+(settings.showCollected?'Ocultar coletados':'Mostrar coletados')+
     '">'+(settings.showCollected?'◉':'◌')+'</button>':'')+
    '<button type="button" class="resetCooldown" onclick="resetCooldown()" title="Limpar referência do contador" aria-label="Limpar contador dos doces">↺</button></div><div class="infoGrid">'+

    [["name","Nome"],["location","Local"],["despawn","Despawn"],["distance","Dist."]]
    .map(([id,label])=>'<button type="button" class="infoTile'+
      (settings[id]?' chosen':'')+'" data-key="'+id+'" aria-pressed="'+
      (!!settings[id])+'" onclick="toggleInfo(this.dataset.key)"><span>'+
      label+'</span><b>'+(settings[id]?'✓':'–')+'</b></button>').join("")+'</div>'+
    (settings.candyAutoPickupActive?
     '<div id="candyDetectStatus" class="candyDetectStatus" role="status" aria-live="polite">Aguardando aviso…</div>':'');
   if(settings.candyAutoPickupActive)requestHeight(161,false);
   else requestHeight(142,false);
 }else if(currentPanel==="location-cooldown"){
   renderCandyCooldownReference();
 }else if(currentPanel==="location"){
   el.innerHTML='<div class="choiceHeader"><button type="button" class="locTitleHelp" onclick="showCandyCooldownReference()" title="Abrir tabela de cooldown por distância" aria-label="Localização · abrir referência de cooldown">Localização</button><div class="locClipboardTools">'+
    '<button type="button" onclick="copyCoords()" title="Copiar coordenadas" aria-label="Copiar coordenadas">'+copyGlyph+'</button>'+
    '<button type="button" onclick="pasteCoords()" title="Colar coordenadas" aria-label="Colar coordenadas">'+pasteGlyph+'</button></div></div>'+
    '<div class="locCoordsRow"><input class="locField" id="candyCoords" onfocus="Native.candyMenuFocus(true)" oninput="candyLocationDraftDirty=true" placeholder="53.759856,-1.495755" inputmode="decimal" maxlength="30" autocomplete="off" spellcheck="false" aria-label="Coordenadas latitude e longitude"></div>'+
    '<div class="locSliderRow"><input id="candyRadiusSlider" aria-label="Raio de 1 a 1000 quilômetros" type="range" min="1" max="1000" step="1" onpointerdown="showCandyCooldownPreview()" oninput="setRadiusFromSlider(this.value)"><span id="candyCooldownPreview" class="locCooldownPreview" aria-hidden="true"></span></div>'+
    '<div class="locRadiusRow"><div class="locRadiusInputWrap"><input class="locRadiusNumber" id="candyRadius" onfocus="Native.candyMenuFocus(true)" type="number" min="0.001" max="1000" step="0.001" oninput="setSliderFromRadius(this.value)" aria-label="Raio em quilômetros"><span class="locRadiusUnit">km</span></div>'+
    '<div class="compactLocationActions">'+
    '<button type="button" class="locSave" onclick="applyLocation()" aria-label="Aplicar localização" title="Aplicar">'+applyGlyph+'</button>'+
    '<button type="button" onclick="clearLocation()" aria-label="Limpar localização" title="Limpar">'+clearGlyph+'</button></div></div>'+
    '<div id="locError" class="locError" role="status"></div>';
   $("candyCoords").value=settings.coords||"";
   $("candyRadius").value=kmDisplay(settings.radius);
   $("candyRadiusSlider").value=String(Math.max(1,Math.min(1000,Math.round(settings.radius/1000))));
   if(candyLocationDraft){
      $("candyCoords").value=candyLocationDraft.coords;
      $("candyRadius").value=candyLocationDraft.radius;
      $("candyRadiusSlider").value=candyLocationDraft.slider;
      candyLocationDraftDirty=candyLocationDraft.dirty;
      candyLocationDraft=null;
   }
   requestHeight(172,false);
 }
}
function setRadiusFromSlider(km){
 if($("candyRadius"))$("candyRadius").value=String(km);
 candyLocationDraftDirty=true;showCandyCooldownPreview();
}
function setSliderFromRadius(value){
 const n=Number(value);
 if(Number.isFinite(n)&&n>=.001&&n<=1000&&$("candyRadiusSlider"))
   $("candyRadiusSlider").value=String(Math.max(1,Math.round(n)));
 if(Number.isFinite(n)&&n>=.001&&n<=1000){
   candyLocationDraftDirty=true;showCandyCooldownPreview();
 }
}
function choosePeriod(value){
 if(![0,3,5,10,15,20].includes(value))return;
 settings.period=value;Native.setCandyPeriod(value);closePanel();
}
function changeInfo(key,checked){
 if(!["name","location","despawn","distance"].includes(key))return;
 settings[key]=checked;Native.setCandyInfo(key,checked);
 if(currentPanel==="infos")renderPanel();
}
function toggleInfo(key){changeInfo(key,!settings[key])}
window.setCandyDetectionStatus=function(status){
 if(currentPanel!=="infos")return;
 const el=$("candyDetectStatus");
 if(el)el.textContent=String(status||"Aguardando aviso").slice(0,80);
};
function toggleAutoCandy(){
 // A dead Android projection requires fresh consent, never a fake ON state.
 const enable=!settings.candyAutoPickupActive;
 settings.candyAutoPickupOptIn=enable;
 Native.setAutoCandyPickup(enable);
 closePanel();
}
function confirmPickedCandy(){Native.confirmCandyPicked();closePanel()}
function toggleCollected(){
 settings.showCollected=!settings.showCollected;
 Native.setShowCollected(!!settings.showCollected);
 if(currentPanel==="infos")renderPanel();
}
function resetCooldown(){Native.clearCandyCooldown();closePanel()}
function applyLocation(){
 const center=$("candyCoords").value.trim(),km=Number($("candyRadius").value);
 const meters=Math.round(km*1000);
 if(!Number.isFinite(km)||km<.001||km>1000||meters<1||meters>1000000||
   (center&&!/^-?\d{1,2}(?:\.\d+)?\s*,\s*-?\d{1,3}(?:\.\d+)?$/.test(center))){
   $("locError").textContent="Coordenadas ou raio inválidos";return;
 }
 if(center){const [lat,lng]=center.split(",").map(Number);
   if(Math.abs(lat)>90||Math.abs(lng)>180){
     $("locError").textContent="Latitude/longitude inválidas";return;
   }
 }
 Native.setCandyLocation(center,meters);
 settings.coords=center;settings.radius=meters;closePanel();
}
function clearLocation(){
 settings.coords="";settings.radius=1000;
 Native.setCandyLocation("",1000);closePanel();
}
function copyCoords(){if($("candyCoords"))Native.copyCandyLocation($("candyCoords").value.trim())}
function pasteCoords(){Native.pasteCandyLocation()}
function setPastedCoords(value,automatic=false,session=-1,reason=""){
 if(automatic&&session!==candyLocationSession)return;
 if(currentPanel!=="location")return;
 const field=$("candyCoords");if(!field)return;
 if(automatic&&candyLocationDraftDirty)return;
 if(value){
   field.value=value;
   candyLocationDraftDirty=!automatic;
 }else if(!automatic&&$("locError")){
   $("locError").textContent=reason==="ambiguous"?
      "Mais de um par de coordenadas. Copie só um.":reason==="invalid"?
      "Não há coordenadas válidas no texto copiado.":
      "Android bloqueou a leitura. Use Colar no teclado.";
 }
 // Restore compact non-focusable popup only for automatic clipboard reads.
 if(automatic&&Native.candyMenuFocus)Native.candyMenuFocus(false);
}
// One-shot short tap via pointerup with click fallback for WebViews that
// drop pointerup after pointerleave. Deduplicate synthetic click after touch.
// A held press only opens the interval menu: never send a search on release.
const refresh=$("refresh");
let pointerActive=false,refreshHeld=false,refreshHold=null;
let lastRefreshRequestAt=-10000;
function cancelRefreshHold(){clearTimeout(refreshHold);refreshHold=null}
function requestRefreshNow(){
  const now=Date.now();
  if(now-lastRefreshRequestAt<400)return;
  lastRefreshRequestAt=now;
  // Start rotating instantly, then trust the native search state for the end.
  setCandyRefreshState({busy:true});
  Native.refreshCandy();
}
refresh.addEventListener("pointerdown",event=>{
  if(event.isPrimary===false)return;
  pointerActive=true;
  refreshHeld=false;
  cancelRefreshHold();
  refreshHold=setTimeout(()=>{
    if(!pointerActive)return;
    refreshHeld=true;
    openPanel("period");
  },550);
});
refresh.addEventListener("pointerup",event=>{
  if(!pointerActive)return;
  pointerActive=false;
  cancelRefreshHold();
  if(!refreshHeld)requestRefreshNow();
});
refresh.addEventListener("pointercancel",()=>{
  pointerActive=false;
  cancelRefreshHold();
});
refresh.addEventListener("pointerleave",()=>{
  // A slight move can cancel pointerup on Android. Let click handle the tap.
  pointerActive=false;
  cancelRefreshHold();
});
refresh.addEventListener("contextmenu",event=>{
  event.preventDefault();
  if(pointerActive&&!refreshHeld){
    refreshHeld=true;
    cancelRefreshHold();
    openPanel("period");
  }
});
refresh.addEventListener("click",event=>{
  event.preventDefault();
  if(refreshHeld){refreshHeld=false;return}
  // Works for keyboard/assistive technology and missing pointerup.
  requestRefreshNow();
});
window.syncCandy=syncCandy;window.setPastedCoords=setPastedCoords;
window.setCandyRefreshState=setCandyRefreshState;
</script></body></html>
