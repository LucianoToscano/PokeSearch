<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent!important;color:#fff;font:10px Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#controls{display:grid;grid-template-columns:repeat(4,34px);grid-auto-rows:30px;gap:2px;padding:0;margin:0;align-items:center}
#controls button{height:30px;width:100%;min-width:0;padding:0;background:#151b26e6;border:1px solid #ffffff23;border-radius:5px;font-size:10px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;white-space:nowrap}
#controls button.active{background:#db2d4bdb}
#controls button svg{width:16px;height:16px;display:block;pointer-events:none}
#controls button.locOn{background:#1e6150e8;color:#b2ffe0;border-color:#5de7b1a6}
#controls button .autoTime{font-size:9px;position:absolute;margin-top:20px}
#controls button#refresh{flex-direction:column;gap:0}
#controls button#refresh svg{width:19px;height:19px;margin-top:-2px;transform-origin:center;transform-box:view-box}
@keyframes candyRefreshSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#controls button#refresh.refreshing svg{animation:candyRefreshSpin .8s linear infinite}
#controls button#refresh.waiting svg{opacity:.65}
#controls button#close{font-size:18px;font-weight:800;color:#ff596c;background:#151b26e6;border-color:#ff596c5c}
#choices{display:none;position:absolute;top:34px;left:0;z-index:12;width:232px;max-width:calc(100vw - 8px);padding:5px;background:#151c27f5;border:1px solid #ffffff38;border-radius:10px;box-shadow:0 4px 12px #0008}
#choices.visible{display:block}
#choices.locationPanel{width:232px}
#choices .choiceHeader{padding:5px 7px 7px;color:#b9c7d9;font-weight:700;font-size:11px;letter-spacing:.1px}
#choices .locField{box-sizing:border-box;width:100%;height:34px;min-height:34px;background:#111722;border:1px solid #536174;border-radius:7px;padding:6px 8px;color:#fff;font-size:11px;margin:3px 0;outline:none}
#choices .locField:focus{border-color:#77c9b2;box-shadow:0 0 0 1px #77c9b244}
#choices .locLine{display:flex;align-items:center;justify-content:space-between;gap:5px;margin:5px 0}
#choices .locLine button,#choices button.choice{flex:1;width:auto;padding:7px;background:#223147;border:1px solid #51647b;border-radius:7px;color:#e7edf9;font-size:11px;min-height:30px}
#choices button.choice{display:block;width:100%;text-align:left;background:transparent;border:0;padding:8px 9px;margin:1px 0}
#choices button.choice.chosen{background:#263f39;color:#a2efd3;font-weight:700}
#choices button.locSave{color:#a8efd4}
#choices .extraNote{margin:3px 2px 5px;font-size:9px;color:#b7c3d1;line-height:1.3}
#choices label.checkbox{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;padding:5px 8px;font-size:11px;color:#e2e9f2;border-radius:6px}
#choices label.checkbox:active{background:#263444}
#choices .periodChoices{display:flex;gap:5px;margin:5px 3px 7px}
#choices .periodChoices button{flex:1;min-height:32px;border:1px solid #536174;background:#223147;border-radius:7px;font-size:11px}
#choices .periodChoices button.chosen{border-color:#68d7ad;background:#214d41;color:#c6ffe7}
#choices .infoDivider{height:1px;background:#ffffff22;margin:4px 2px}
#choices .hint{font-size:9px;line-height:1.3;color:#aab9ca;padding:5px 7px 2px}
#choices input[type=checkbox]{accent-color:#5bba96;width:16px;height:16px}

/* PokeSearch dock compact styling */
#choices.locationPanel{width:232px;max-width:calc(100vw - 8px);padding:5px;background:#151c27ed;border:1px solid #ffffff38}
#choices .choiceHeader{height:27px;display:flex;align-items:center;justify-content:space-between;padding:1px 5px 4px;color:#d3d4d6;font-size:11px}
#choices .locClipboardTools{display:flex;align-items:center;gap:3px}
#choices .locClipboardTools button{width:25px;min-width:25px;height:25px;padding:2px;border:1px solid #ffffff35;background:#343b49e0;border-radius:6px;color:#e3ecf7;display:flex;align-items:center;justify-content:center}
#choices .locClipboardTools button svg{display:block;width:17px;height:17px}
#choices .locCoordsRow{height:32px;margin-bottom:3px;display:flex}
#choices .locCoordsRow input{min-width:0;width:100%;height:32px;padding:4px 6px;background:#17191bdc;border:1px solid #96999c88;border-radius:7px;color:#f1f5fb;font:500 11px/1.2 monospace}
#choices .locSliderRow{display:flex;align-items:center;width:100%;height:25px;margin:0 0 3px;padding:0}
#choices .locSliderRow input{width:100%;height:23px;accent-color:#6ad4b2;margin:0;touch-action:pan-x}
#choices .locRadiusRow{display:flex;align-items:center;justify-content:space-between;gap:4px;height:30px}
#choices .locRadiusInputWrap{display:flex;align-items:center;gap:3px}
#choices .locRadiusInputWrap input{width:58px;height:29px;padding:2px 3px;text-align:center;background:#17191bdc;border:1px solid #96999c88;border-radius:7px;color:#f5f6f8;font:500 11px/1 monospace}
#choices .locRadiusUnit{font-size:10px;color:#d0d5de}
#choices .compactLocationActions{display:flex;align-items:center;gap:3px}
#choices .compactLocationActions button{width:30px;height:29px;min-height:29px;padding:2px;background:#343b49db;color:#e9edf4;border:1px solid #ffffff35;border-radius:7px;display:flex;align-items:center;justify-content:center}
#choices .compactLocationActions button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#choices .compactLocationActions button.locSave{color:#a8efd4}
#choices .locError{font-size:9px;color:#ffaaa9;margin:4px 1px 0}
#choices.periodPanel{left:36px;width:36px;max-width:36px;padding:0;margin:0;background:transparent;border:0;border-radius:0;box-shadow:none;display:flex;flex-direction:column;gap:4px}
#choices.periodPanel .periodTile{box-sizing:border-box;width:36px;min-width:36px;height:34px;min-height:34px;flex:0 0 34px;padding:0;background:#151b26e6;border:1px solid #ffffff37;border-radius:6px;color:#e3e8f0;font-size:11px;font-weight:700;text-align:center}
#choices.periodPanel .periodTile.chosen{border-color:#70d6b1;color:#c3ffe7;background:#265a46ed}
body:not(.expanded) #choices{display:none}

/* LT181: exact compact Pokébola menu geometry and theme tokens */
:root{--visual-menu-bg:rgba(15,19,26,.5);--visual-menu-button-bg:rgba(15,19,26,.5);
--visual-menu-readable-bg:rgba(15,19,26,.86);--visual-menu-readable-button-bg:rgba(15,19,26,.7);
--visual-menu-border:rgba(227,233,241,.22);--visual-menu-fg:#f2f7fc;
--visual-menu-blur:4px;--visual-menu-tile-shadow:0 1px 3px #0004}
#controls button,#controls button#close{background:var(--visual-menu-button-bg)!important;border:1px solid var(--visual-menu-border)!important;box-shadow:var(--visual-menu-tile-shadow)!important;color:var(--visual-menu-fg);backdrop-filter:blur(var(--visual-menu-blur))}
#controls button#close{color:#ff596c}#controls button.locOn{color:#a8efd4}
#choices.locationPanel,#choices.infoPanel{left:0!important;width:148px!important;min-width:148px!important;max-width:148px!important;max-height:145px!important;height:max-content!important;padding:4px 5px 5px!important;overflow:visible!important;background:var(--visual-menu-readable-bg)!important;color:var(--visual-menu-fg)!important;border:1px solid var(--visual-menu-border)!important;border-radius:8px!important;box-shadow:var(--visual-menu-tile-shadow)!important;backdrop-filter:blur(var(--visual-menu-blur))}
#choices.locationPanel>.choiceHeader,#choices.infoPanel>.choiceHeader{box-sizing:border-box!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:3px!important;width:100%!important;height:26px!important;min-height:26px!important;margin:0 0 4px!important;padding:0!important;font:700 11.5px/1.12 Roboto,Arial,sans-serif!important;white-space:nowrap}
#choices.locationPanel .locClipboardTools{box-sizing:border-box!important;display:inline-flex!important;align-items:center!important;gap:3px!important;flex:0 0 auto!important;height:25px!important}
#choices.locationPanel .locClipboardTools button{flex:0 0 25px!important;width:25px!important;height:25px!important;min-width:25px!important;min-height:25px!important;padding:3px!important;margin:0!important;background:var(--visual-menu-readable-button-bg)!important;border:1px solid var(--visual-menu-border)!important;color:var(--visual-menu-fg)!important}
#choices.locationPanel>.locCoordsRow{display:flex!important;align-items:center!important;width:100%!important;height:32px!important;margin:0 0 3px!important;padding:0!important}
#choices.locationPanel>.locCoordsRow>input.locField{flex:1 1 auto!important;min-width:0!important;width:100%!important;height:32px!important;min-height:32px!important;margin:0!important;padding:3px 4px!important;font:500 8px/1.15 monospace!important;letter-spacing:-.2px!important;background:var(--visual-menu-readable-button-bg)!important;color:var(--visual-menu-fg)!important;border:1px solid var(--visual-menu-border)!important}
#choices.locationPanel>.locSliderRow{height:24px!important;margin:0 0 3px!important;padding:0!important}
#choices.locationPanel>.locSliderRow>input{width:100%!important;height:22px!important;margin:0!important}
#choices.locationPanel>.locRadiusRow{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:29px!important;min-height:29px!important;gap:4px!important;margin:0!important;padding:0!important}
#choices.locationPanel>.locRadiusRow>.locRadiusInputWrap{display:inline-flex!important;align-items:center!important;gap:1px!important;flex:0 0 65px!important;width:65px!important;height:29px!important}
#choices.locationPanel>.locRadiusRow>.locRadiusInputWrap>input.locRadiusNumber{flex:0 0 46px!important;width:46px!important;height:29px!important;min-height:29px!important;padding:2px!important;margin:0!important;font:500 12px/1.1 monospace!important;text-align:center!important;background:var(--visual-menu-readable-button-bg)!important;color:var(--visual-menu-fg)!important;border:1px solid var(--visual-menu-border)!important}
#choices.locationPanel>.locRadiusRow>.locRadiusInputWrap>.locRadiusUnit{font-size:10px!important}
#choices.locationPanel>.locRadiusRow>.compactLocationActions{display:inline-flex!important;align-items:center!important;gap:3px!important;flex:0 0 auto!important;height:29px!important;min-height:29px!important}
#choices.locationPanel>.locRadiusRow>.compactLocationActions>button{box-sizing:border-box!important;flex:0 0 29px!important;width:29px!important;height:29px!important;min-height:29px!important;max-height:29px!important;padding:4px!important;margin:0!important;border-radius:6px!important;background:var(--visual-menu-readable-button-bg)!important;border:1px solid var(--visual-menu-border)!important;box-shadow:var(--visual-menu-tile-shadow)!important}
#choices.periodPanel{left:32px!important;width:30px!important;min-width:30px!important;max-width:30px!important;display:flex!important;flex-direction:column!important;gap:3px!important;padding:0!important;margin:0!important;background:transparent!important;border:0!important;box-shadow:none!important}
#choices.periodPanel>.periodTile{box-sizing:border-box!important;flex:0 0 30px!important;width:30px!important;min-width:30px!important;max-width:30px!important;height:30px!important;min-height:30px!important;max-height:30px!important;padding:0!important;border-radius:6px!important;background:var(--visual-menu-button-bg)!important;color:var(--visual-menu-fg)!important;border:1px solid var(--visual-menu-border)!important;box-shadow:var(--visual-menu-tile-shadow)!important}
#choices.periodPanel>.periodTile.chosen{border-color:#a8efd4!important;color:#a8efd4!important}
#choices.infoPanel>.infoGrid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:3px!important}
#choices.infoPanel .infoTile{box-sizing:border-box!important;min-width:0!important;width:100%!important;height:30px!important;min-height:30px!important;padding:2px 3px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:2px!important;font-size:9px!important;text-align:left!important;background:var(--visual-menu-readable-button-bg)!important;color:var(--visual-menu-fg)!important;border:1px solid var(--visual-menu-border)!important;border-radius:6px!important}
#choices.infoPanel .infoTile.chosen{border-color:#a8efd4!important}
#choices.infoPanel .infoTile b{font-size:11px!important;color:#a8efd4!important}

</style></head><body>
<div id="controls" role="toolbar" aria-label="Controles Doce Raro">
<button id="location" aria-label="Localização e raio" onclick="openPanel('location')" title="Localização"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></button>
<button id="refresh" aria-label="Toque: atualizar; segure: intervalo" title="Atualizar · segurar: OFF, 3, 5, 10, 15 ou 20 minutos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M5.5 9A7 7 0 0 1 18 7l2 4M4 13l2 4a7 7 0 0 0 12.5-2"/></svg><span id="period" class="autoTime">3m</span></button>
<button id="infos" aria-label="Mostrar ou ocultar informações" onclick="openPanel('infos')" title="Informações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6a9 9 0 0 1 9 6 9 9 0 0 1-18 0 9 9 0 0 1 9-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
<button id="close" title="Fechar menu" aria-label="Recolher opções" onclick="Native.closeCandyMenu()">×</button>
</div>
<div id="choices" role="group"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
let settings={coords:"",radius:1000,period:3,name:false,location:false,despawn:true,distance:false};
let currentPanel="";
function setCandyRefreshState(state) {
 const refreshing=!!(state&&state.busy);
 const waiting=!!(state&&!refreshing&&(state.pending||state.blocked));
 const button=$("refresh");
 button.classList.toggle("refreshing",refreshing);
 button.classList.toggle("waiting",waiting);
 button.setAttribute("aria-busy",refreshing?"true":"false");
 button.setAttribute("aria-label",refreshing?"Atualizando Doce Raro":
   waiting?"Aguardando atualização do Doce Raro":
   "Toque: atualizar; segure: intervalo");
}
function syncCandy(json) {
 try{settings=Object.assign(settings,JSON.parse(json||"{}"));}catch(e){}
 $("period").textContent=settings.period===0?"OFF":String(settings.period||3)+"m";
 $("location").classList.toggle("locOn",!!settings.coords);
 $("infos").classList.toggle("active",!!(settings.name||settings.location||settings.distance));
 if(currentPanel==="infos"||currentPanel==="period")renderPanel();
 // Do not rebuild the location editor while a user is typing.
}
function requestHeight(height,focus) {
 Native.candyMenuHeight(Math.max(34,Math.min(290,height)),!!focus,currentPanel);
}
function closePanel(){
 currentPanel="";$("choices").innerHTML="";$("choices").className="";
 document.body.classList.remove("expanded");requestHeight(34,false);
}
function openPanel(name){
 if(currentPanel===name){closePanel();return}
 currentPanel=name;renderPanel();
}
const copyGlyph='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h12v12H8zM16 8V4H4v12h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>';
const pasteGlyph='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h2a2 2 0 0 1 4 0h2v3H8zM8 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M12 9v10m-4-4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>';
const applyGlyph='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>';
const clearGlyph='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m5 4v7m4-7v7"/></svg>';
function kmDisplay(meters){return String(Math.round(Number(meters||1000))/1000)}
function renderPanel(){
 const el=$("choices");document.body.classList.add("expanded");
 el.className="visible"+(currentPanel==="location"?" locationPanel":
   currentPanel==="period"?" periodPanel":" infoPanel");
 if(currentPanel==="period"){
   el.innerHTML=[0,3,5,10,15,20].map(n=>'<button type="button" class="periodTile'+
     (settings.period===n?' chosen':'')+'" onclick="choosePeriod('+n+')">'+
     (n===0?'OFF':n)+'</button>').join("");
   requestHeight(34+6*30+5*3+6,false);
  }else if(currentPanel==="infos"){
   // Same compact grid as the Pokémon information menu.
   el.innerHTML='<div class="choiceHeader">Informações</div><div class="infoGrid">'+
    [["name","Nome"],["location","Local"],["despawn","Despawn"],["distance","Dist."]]
    .map(([id,label])=>'<button type="button" class="infoTile'+
      (settings[id]?' chosen':'')+'" data-key="'+id+'" aria-pressed="'+
      (!!settings[id])+'" onclick="toggleInfo(this.dataset.key)"><span>'+
      label+'</span><b>'+(settings[id]?'✓':'–')+'</b></button>').join("")+'</div>';
   requestHeight(116,false);
 }else if(currentPanel==="location"){
   el.innerHTML='<div class="choiceHeader"><span>Localização</span><div class="locClipboardTools">'+
    '<button type="button" onclick="copyCoords()" title="Copiar coordenadas" aria-label="Copiar coordenadas">'+copyGlyph+'</button>'+
    '<button type="button" onclick="pasteCoords()" title="Colar coordenadas" aria-label="Colar coordenadas">'+pasteGlyph+'</button></div></div>'+
    '<div class="locCoordsRow"><input class="locField" id="candyCoords" onfocus="Native.candyMenuFocus(true)" placeholder="53.759856,-1.495755" inputmode="decimal" maxlength="30" autocomplete="off" spellcheck="false" aria-label="Coordenadas latitude e longitude"></div>'+
    '<div class="locSliderRow"><input id="candyRadiusSlider" aria-label="Raio de 1 a 1000 quilômetros" type="range" min="1" max="1000" step="1" oninput="setRadiusFromSlider(this.value)"></div>'+
    '<div class="locRadiusRow"><div class="locRadiusInputWrap"><input class="locRadiusNumber" id="candyRadius" onfocus="Native.candyMenuFocus(true)" type="number" min="0.001" max="1000" step="0.001" oninput="setSliderFromRadius(this.value)" aria-label="Raio em quilômetros"><span class="locRadiusUnit">km</span></div>'+
    '<div class="compactLocationActions">'+
    '<button type="button" class="locSave" onclick="applyLocation()" aria-label="Aplicar localização" title="Aplicar">'+applyGlyph+'</button>'+
    '<button type="button" onclick="clearLocation()" aria-label="Limpar localização" title="Limpar">'+clearGlyph+'</button></div></div>'+
    '<div id="locError" class="locError" role="status"></div>';
   $("candyCoords").value=settings.coords||"";
   $("candyRadius").value=kmDisplay(settings.radius);
   $("candyRadiusSlider").value=String(Math.max(1,Math.min(1000,Math.round(settings.radius/1000))));
   requestHeight(141,false);
 }
}
function setRadiusFromSlider(km){if($("candyRadius"))$("candyRadius").value=String(km)}
function setSliderFromRadius(value){
 const n=Number(value);
 if(Number.isFinite(n)&&n>=.001&&n<=1000&&$("candyRadiusSlider"))
   $("candyRadiusSlider").value=String(Math.max(1,Math.round(n)));
}
function choosePeriod(value){
 if(![0,3,5,10,15,20].includes(value))return;
 settings.period=value;Native.setCandyPeriod(value);closePanel();
}
function changeInfo(key,checked){
 if(!["name","location","despawn","distance"].includes(key))return;
 settings[key]=checked;Native.setCandyInfo(key,checked);
 if(currentPanel==="infos")renderPanel();
}
function toggleInfo(key){changeInfo(key,!settings[key])}
function applyLocation(){
 const center=$("candyCoords").value.trim(),km=Number($("candyRadius").value);
 const meters=Math.round(km*1000);
 if(!Number.isFinite(km)||km<.001||km>1000||meters<1||meters>1000000||
   (center&&!/^-?\d{1,2}(?:\.\d+)?\s*,\s*-?\d{1,3}(?:\.\d+)?$/.test(center))){
   $("locError").textContent="Coordenadas ou raio inválidos";return;
 }
 if(center){const [lat,lng]=center.split(",").map(Number);
   if(Math.abs(lat)>90||Math.abs(lng)>180){
     $("locError").textContent="Latitude/longitude inválidas";return;
   }
 }
 Native.setCandyLocation(center,meters);
 settings.coords=center;settings.radius=meters;closePanel();
}
function clearLocation(){
 settings.coords="";settings.radius=1000;
 Native.setCandyLocation("",1000);closePanel();
}
function copyCoords(){if($("candyCoords"))Native.copyCandyLocation($("candyCoords").value.trim())}
function pasteCoords(){Native.pasteCandyLocation()}
function setPastedCoords(value){
 if(currentPanel==="location"&&$("candyCoords"))$("candyCoords").value=value||"";
}
// One-shot short tap via pointerup with click fallback for WebViews that
// drop pointerup after pointerleave. Deduplicate synthetic click after touch.
// A held press only opens the interval menu: never send a search on release.
const refresh=$("refresh");
let pointerActive=false,refreshHeld=false,refreshHold=null;
let lastRefreshRequestAt=-10000;
function cancelRefreshHold(){clearTimeout(refreshHold);refreshHold=null}
function requestRefreshNow(){
  const now=Date.now();
  if(now-lastRefreshRequestAt<400)return;
  lastRefreshRequestAt=now;
  // Start rotating instantly, then trust the native search state for the end.
  setCandyRefreshState({busy:true});
  Native.refreshCandy();
}
refresh.addEventListener("pointerdown",event=>{
  if(event.isPrimary===false)return;
  pointerActive=true;
  refreshHeld=false;
  cancelRefreshHold();
  refreshHold=setTimeout(()=>{
    if(!pointerActive)return;
    refreshHeld=true;
    openPanel("period");
  },550);
});
refresh.addEventListener("pointerup",event=>{
  if(!pointerActive)return;
  pointerActive=false;
  cancelRefreshHold();
  if(!refreshHeld)requestRefreshNow();
});
refresh.addEventListener("pointercancel",()=>{
  pointerActive=false;
  cancelRefreshHold();
});
refresh.addEventListener("pointerleave",()=>{
  // A slight move can cancel pointerup on Android. Let click handle the tap.
  pointerActive=false;
  cancelRefreshHold();
});
refresh.addEventListener("contextmenu",event=>{
  event.preventDefault();
  if(pointerActive&&!refreshHeld){
    refreshHeld=true;
    cancelRefreshHold();
    openPanel("period");
  }
});
refresh.addEventListener("click",event=>{
  event.preventDefault();
  if(refreshHeld){refreshHeld=false;return}
  // Works for keyboard/assistive technology and missing pointerup.
  requestRefreshNow();
