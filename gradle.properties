# Firebase Auth and Realtime Database depend on AndroidX artifacts.
android.useAndroidX=true
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Reuse cacheable Gradle task outputs across CI runs (dependencies are already
# cached by gradle/actions/setup-gradle). Keep configuration cache disabled:
# protected signing workflows read environment credentials at configuration time.
org.gradle.caching=true
