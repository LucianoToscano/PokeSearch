name: PokeSearch permanent official release
on:
  push:
    branches: [main]
    paths:
      - release/official-request.json
      - .github/workflows/pokesearch-official-release.yml
      - scripts/official-release-request.cjs
      - scripts/official-release-request.test.cjs
  pull_request:
    paths:
      - release/official-request.json
      - .github/workflows/pokesearch-official-release.yml
      - scripts/official-release-request.cjs
      - scripts/official-release-request.test.cjs
permissions:
  contents: read
concurrency:
  group: pokesearch-approved-public-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.request.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test release safety gates
        run: node scripts/official-release-request.test.cjs
      - name: Validate request without private signing material
        id: request
        if: github.event_name == 'push' && github.repository == 'LucianoToscano/PokeSearch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/official-release-request.cjs plan
  publish:
    needs: preflight
    if: needs.preflight.outputs.needed == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    environment: official-updates
    timeout-minutes: 85
    env:
      POKE_CONTROLLED_DISTRIBUTION: 'true'
      POKE_RELEASE_CERT_SHA256: '34766c15d09013ad65873f9976539c8fa2f826e917dae3af57ea628cad689e8e'
      POKE_RELEASE_STORE_PASSWORD: ${{ secrets.POKE_TEST_STORE_PASSWORD }}
      POKE_RELEASE_KEY_ALIAS: ${{ secrets.POKE_TEST_KEY_ALIAS }}
      POKE_RELEASE_KEY_PASSWORD: ${{ secrets.POKE_TEST_KEY_PASSWORD }}
      POKE_GOOGLE_WEB_CLIENT_ID: ${{ vars.POKE_GOOGLE_WEB_CLIENT_ID }}
      POKE_CHAT_GOOGLE_WEB_CLIENT_ID: '1007816617051-abhc4riftns3om8gs0o67ce1s386ue9d.apps.googleusercontent.com'
      POKE_SCRAPBOOK_STAGE1_QA: 'false'
      POKE_SCRAPBOOK_ONLINE_QA: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false, ref: "${{ github.sha }}"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Prepare approved version and notes
        run: node scripts/official-release-request.cjs prepare
      - name: SDK and exact permanent signer
        shell: bash
        env:
          POKE_TEST_KEYSTORE_B64: ${{ secrets.POKE_TEST_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          for k in POKE_TEST_KEYSTORE_B64 POKE_RELEASE_STORE_PASSWORD POKE_RELEASE_KEY_ALIAS POKE_RELEASE_KEY_PASSWORD; do test -n "$(printenv "$k")"; done
          umask 077
          printf '%s' "$POKE_TEST_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/official-release.p12"
          chmod 600 "$RUNNER_TEMP/official-release.p12"
          echo "POKE_RELEASE_KEYSTORE=$RUNNER_TEMP/official-release.p12" >> "$GITHUB_ENV"
          CERT="$(keytool -exportcert -rfc -keystore "$RUNNER_TEMP/official-release.p12" -storetype PKCS12 -storepass "$POKE_RELEASE_STORE_PASSWORD" -alias "$POKE_RELEASE_KEY_ALIAS" | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':\r' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$POKE_RELEASE_CERT_SHA256"
      - name: Run Node and OTA regressions
        shell: bash
        run: |
          set -euo pipefail
          node app/tests/lt192-iv-evidence-mode-transition.test.js
          node app/tests/lt193-api-decimal-iv-native.test.js
          node app/tests/lt194-api-dom-iv-evidence-parity.test.js
          node app/tests/lt195-candy-next-hop-cooldown.test.js
          node app/tests/lt196-candy-compact-sprite.test.js
          node app/tests/lt196-candy-pickup-confirmation.test.js
          node app/tests/lt196-candy-collected-visibility.test.js
          node app/tests/lt197-candy-visual-consent.test.js
          node app/tests/lt198-candy-capture-watchdog-ack.test.js
          node app/tests/lt199-pokemon-filter-pause.test.js
          node app/tests/location-probe.test.js
          node app/tests/pokemon-picker.test.js
          node app/tests/lt200-location-cooldown.test.js
          node app/tests/lt200-api-dom-failures.test.js
          node app/tests/lt202-shiny-for-provider-spec.test.js
          node app/tests/lt203-ota-installer-handoff.test.js
          node app/tests/lt204-login-optional-shiny-paused.test.js
          node app/tests/lt205-candy-account-429.test.js
          node app/tests/lt206-retry-after-details.test.js
          node app/tests/lt226-visible-sprite-alpha-fill.test.js
          node app/tests/lt227-frameless-results.test.js
          mkdir -p "$RUNNER_TEMP/lt197-vision"
          javac --release 17 -d "$RUNNER_TEMP/lt197-vision" app/src/main/java/com/lucianotoscano/pokesearchoverlay/CandyPickupEvidence.java app/tests/CandyPickupEvidenceTest.java
          java -cp "$RUNNER_TEMP/lt197-vision" com.lucianotoscano.pokesearchoverlay.CandyPickupEvidenceTest
          mkdir -p "$RUNNER_TEMP/lt195-candy-tests"
          javac --release 17 -d "$RUNNER_TEMP/lt195-candy-tests" app/src/main/java/com/lucianotoscano/pokesearchoverlay/CandyCooldownPolicy.java app/tests/CandyCooldownPolicyTest.java
          java -cp "$RUNNER_TEMP/lt195-candy-tests" com.lucianotoscano.pokesearchoverlay.CandyCooldownPolicyTest
          mkdir -p "$RUNNER_TEMP/lt233-verified-coords"
          javac --release 17 -d "$RUNNER_TEMP/lt233-verified-coords" app/src/main/java/com/lucianotoscano/pokesearchoverlay/VerifiedEncounterCoordinates.java app/tests/VerifiedEncounterCoordinatesTest.java
          java -cp "$RUNNER_TEMP/lt233-verified-coords" com.lucianotoscano.pokesearchoverlay.VerifiedEncounterCoordinatesTest
          javac --release 17 -d "$RUNNER_TEMP/lt233-verified-coords" app/src/main/java/com/lucianotoscano/pokesearchoverlay/ResultsSpacingPolicy.java app/tests/ResultsSpacingPolicyTest.java
          java -cp "$RUNNER_TEMP/lt233-verified-coords" com.lucianotoscano.pokesearchoverlay.ResultsSpacingPolicyTest
          for t in app/tests/*.test.js; do
            [ "$t" = app/tests/lt74-local-update-preview.test.js ] && continue
            node "$t" >/dev/null || { node "$t"; exit 1; }
          done
          python3 scripts/test_ota_builder.py
      - name: Generate complete official assets
        shell: bash
        run: |
          set -euo pipefail
          python3 app/scripts/build_pokemon_card_metadata.py
          python3 app/scripts/update_wwm_catalog.py app/src/main/assets
          python3 app/scripts/build_sprite_bundle.py --workers 12 --minimum-normal 950
      - name: Build signed protected release
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Validate APK and signer
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          test -s app/build/outputs/mapping/release/mapping.txt
          unzip -t "$APK" >/dev/null
          # Abort before publication unless Halloween costume PNGs are truly inside the APK.
          python3 - "$APK" <<'PYSCRIPT'
          import sys,zipfile,hashlib
          expected=[
            "pm656.cFALL_2024.icon.png","pm656.cFALL_2024.s.icon.png",
            "pm722.cFALL_2024.icon.png","pm722.cFALL_2024.s.icon.png",
            # LT260: all exact Sea form variants MUST ship in the signed APK.
            "pm422.fEAST_SEA.icon.png","pm422.fEAST_SEA.s.icon.png",
            "pm422.fWEST_SEA.icon.png","pm422.fWEST_SEA.s.icon.png",
            "pm423.fEAST_SEA.icon.png","pm423.fEAST_SEA.s.icon.png",
            "pm423.fWEST_SEA.icon.png","pm423.fWEST_SEA.s.icon.png"
          ]
          with zipfile.ZipFile(sys.argv[1]) as apk:
            names=set(apk.namelist())
            for filename in expected:
              key="assets/pokemon-sprites/costumes/"+filename
              assert key in names, "Missing verified costume "+key
              data=apk.read(key)
              assert data[:8]==bytes([137,80,78,71,13,10,26,10]), "Invalid PNG "+key
              assert len(data)>500, "Empty sprite "+key
            # LT262: the user-supplied GL/UL PNGs must be in the signed APK.
            # Preserve the exact approved bytes (not just filenames).
            league_icons={
              "GLBadgeLT262.png": "e8c54075550edd0c54e5df66720b6db40faf344e03a69072ae34521fcc9138bf",
              "ULBadgeLT262.png": "25e7d4cc49585210df25d2acb0d14e78830ad10d04a5ec07e511994b92dad1fe"
            }
            for filename,digest in league_icons.items():
              key="assets/result-icons/modes/"+filename
              assert key in names, "Missing requested league mode icon "+key
              data=apk.read(key)
              assert data[:8]==bytes([137,80,78,71,13,10,26,10]), "Invalid PNG "+key
              assert hashlib.sha256(data).hexdigest()==digest, "Changed mode image "+key
            # LT262: new icons are scoped to rank/MT/Raid/Mega cards and the
            # existing Modos GL/UL badges. PNG hashes pin the exact user art.
            ui_icons={
              "league-gl-flag.png": "3f19907174fc273b242eb379773cfcf51f43f9d3a2418e0f28d64c93947c33ad",
              "league-ul-flag.png": "7e5869d09c616db93bc2cca29f3edeec9aba731364b30733d1e59407626719f4",
              "league-ml-flag.png": "7b3eebe07a8ea8640b0454afecb62b76bc708cee848c7e239de4475d0ed8f859",
              "league-cup-flag.png": "4ffdd290a519cdf2fa68622f0fbca2d42f42819601dc36fe08de09bcc6d010ea",
              "raid-badge.png": "a9761e07ed670b1ed702cfabd6d1d032f94eebeeca06ff96e5295cfdbebefdef",
              "mt-elite.png": "8569b664c557130798dc3038e94250de0e3600a3a87a0e5fd522bf27393d91c6",
              "mt-normal.png": "aaee8981343025e786481837984acbf081c17617a10a076ae5afb07516e719fa",
              "mt-unknown.png": "1c7e9a80311bc1cd4187adf83e7b583f096a0c825a429bea015795dcee4be69e",
              "mega-symbol.png": "ed8d845ab02a575b90f331a98068efc78d3aca87ed9d9235afec1711f2492f26",
              # LT265: uploaded user scrolls and bordered, transparent league badges.
              "mt-carregada-elite-lt265.png": "1862fa4d03ad560c62b54f315aac9b88fd33ab29c94e61d78c47df030da60d38",
              "mt-agil-elite-lt265.png": "7439896d33dd28ee62c389015c0094a7ac34c459d6af4a3e47ad5c88c98fd595",
              "league-gl-bordered-lt265.png": "fc3c1bbf45be5d6c934d761bd1369641fafb8bf0b009500a1748833e93d0c05b",
              "league-ul-bordered-lt265.png": "89bb9c0db2e3a10602797f747046f379de267120b119181f3a2b4f4b3682bdda",
              "league-ml-bordered-lt265.png": "470aa8ab0e54d48481d8cbecdaba3590fa929d35e45d910d411765595f8f413d",
              "league-cup-bordered-lt265.png": "a7fa6b7a626adef27e808deff83985ebfddfd43050280b8c0d5bdfbb20bbc6e7"
            }
            for filename,digest in ui_icons.items():
              key="assets/ui-icons/"+filename
              assert key in names, "Missing requested user icon "+key
              data=apk.read(key)
              assert data[:8]==bytes([137,80,78,71,13,10,26,10]), "Invalid PNG "+key
              assert hashlib.sha256(data).hexdigest()==digest, "Unexpected icon bytes "+key
            # LT266: exact, transparent high-resolution originals supplied by the user.
            type_icons={
              "type-normal-lt266.png": "7c3e8db6a036882144635569731b4ff1bd1069244ebd511abf85acc7387c97c1",
              "type-fire-lt266.png": "eee2666cd4fbc95ab6060d62635d79b6cd4a675d58c5e07e01f3d101da19fbaa",
              "type-water-lt266.png": "2b2eda40305b646da9f71baeb35e62018a267664cd25179c3c234b21d512768c",
              "type-electric-lt266.png": "323cea49075c7584379a7e0d5b8c6fb7a26fc9ce8b9f9f354e30f82e1bd3615b",
              "type-grass-lt266.png": "c49414da04c03c276a5a5d60f670f16b5daf2c26b941f5f4cf02cc39a9655d81",
              "type-ice-lt266.png": "5fb1abb611ab61292c468255872cadb7ec8065ed991fef1377669daecb24230f",
              "type-fighting-lt266.png": "fa9703782fe470a917c1b9907022d0345b5080e6c90b25ec893c277fb184757c",
              "type-poison-lt266.png": "bcfd0174bd88c3e4390c6ef61d9ecf09116acceea662023f86c0ff23419d16b1",
              "type-ground-lt266.png": "06ece24a35fc3aa23fbeafbc068113993748efb280a1632a2e7d9e2b3286cfde",
              "type-flying-lt266.png": "5d2cc557f3f816997bb5a6c5d1d8b18d9fc3e2de9eda88ebe64bb82d52b229a7",
              "type-psychic-lt266.png": "b847fc5829d10f03ad82e2ec8b00df56d564fe8cce2dc7c50868efa06570073e",
              "type-bug-lt266.png": "b537e6a51c8bff0ce14fdd1aa14439a5a039847699e64cea0b53cd12f19d0330",
              "type-rock-lt266.png": "8225478cbecf84f0c71a77ee0b903bb6822835d4249ef9329f8c1eb7afde7795",
              "type-ghost-lt266.png": "798a74aa82f41d274f64df8c0ae079a269532493d0fe86a68f23b5794552eba5",
              "type-dragon-lt266.png": "8b89a6b037842a9c3b6fb9417bbff7ce17cd18acb2e1c119570091e4a17195ed",
              "type-dark-lt266.png": "67307a902fb021eb59ff1b0f0785e8a34258e63971e0a60550844b579719959a",
              "type-steel-lt266.png": "9317b660180461e71f730c5c5a196103a9e8f422ff0e5839ff933d96a8466fd8",
              "type-fairy-lt266.png": "ebeb5bfb874550bc52e9b5db5a3d65e3d3083f2af71f55bf991ea35edf2f50e1"
            }
            for filename,digest in type_icons.items():
              key="assets/ui-icons/"+filename
              assert key in names, "Missing LT266 Pokemon type icon "+key
              image=apk.read(key)
              assert image.startswith(b"\x89PNG\r\n\x1a\n"), "Invalid LT266 PNG "+key
              assert image[16:24]==bytes.fromhex("0000040000000400"), "Wrong LT266 PNG dimensions "+key
              assert image[25]==6, "LT266 icon must have RGBA alpha "+key
              assert hashlib.sha256(image).hexdigest()==digest, "Changed LT266 user type icon "+key
          print("Official Sea/Halloween sprites (12) + GL/UL mode emblems (2) + card badges (15) checked")
          PYSCRIPT
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > PACKAGE-VERSION.txt
          grep -Fq "name='com.lucianotoscano.pokesearch'" PACKAGE-VERSION.txt
          grep -Fq "versionCode='$POKE_TEST_VERSION_CODE'" PACKAGE-VERSION.txt
          grep -Fq "versionName='$POKE_TEST_PUBLIC_VERSION'" PACKAGE-VERSION.txt
          ! grep -q '^application-debuggable' PACKAGE-VERSION.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > SIGNING-REPORT.txt
          grep -Eq '^Verified using v2 scheme.*: true$' SIGNING-REPORT.txt
          ACTUAL="$(grep 'Signer #1 certificate SHA-256 digest:' SIGNING-REPORT.txt | awk '{print $NF}')"
          test "$ACTUAL" = "$POKE_RELEASE_CERT_SHA256"
          test "$(stat -c %s "$APK")" -lt 35000000
          cp "$APK" "$OFFICIAL_APK"
          sha256sum "$OFFICIAL_APK" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          git rev-parse HEAD > SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PokeSearch-${{ env.OFFICIAL_TAG }}-Signed-Verified
          path: |
            ${{ env.OFFICIAL_APK }}
            SHA256SUMS.txt
            SIGNING-REPORT.txt
            PACKAGE-VERSION.txt
            SOURCE_COMMIT.txt
          retention-days: 90
          if-no-files-found: error
      - name: Release to all app users
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = "$PREVIOUS_TAG"
          ! gh release view "$OFFICIAL_TAG" >/dev/null 2>&1
          gh release create "$OFFICIAL_TAG" "$OFFICIAL_APK" --target "$GITHUB_SHA" --latest --title "PokeSearch $POKE_TEST_PUBLIC_VERSION — Atualização oficial" --notes-file RELEASE-NOTES.md
      - name: Verify public release and hash
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > RELEASE-VERIFIED.json
          python3 - <<'PY'
          import json,hashlib,os,pathlib
          r=json.load(open('RELEASE-VERIFIED.json'))
          assert r['tag_name']==os.environ['OFFICIAL_TAG'] and not r['draft'] and not r['prerelease']
          data=pathlib.Path(os.environ['OFFICIAL_APK']).read_bytes()
          a=[x for x in r['assets'] if x['name']==os.environ['OFFICIAL_APK']]
          assert len(a)==1 and a[0]['state']=='uploaded'
          assert a[0]['size']==len(data)
          assert a[0]['digest']=='sha256:'+hashlib.sha256(data).hexdigest()
          PY
      - name: Erase private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/official-release.p12"
