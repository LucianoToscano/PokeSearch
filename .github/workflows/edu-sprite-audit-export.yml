name: Exportar e auditar 68 sprites Edu LT320

on:
  push:
    branches:
      - qa/edu-sprite-export-lt320-20261108
    paths:
      - .github/workflows/edu-sprite-audit-export.yml
      - scripts/edu_68_export_audit.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar fontes oficiais do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Separar 68 quadros e gerar auditoria + ZIP
        run: python scripts/edu_68_export_audit.py

      - name: Verificar integridade da entrega
        shell: bash
        run: |
          set -euo pipefail
          file="exports/EDU_68_SPRITES_LT320_AUDITORIA_2026-11-08.zip"
          test -s "$file"
          python - <<'PY'
          import zipfile
          name="exports/EDU_68_SPRITES_LT320_AUDITORIA_2026-11-08.zip"
          with zipfile.ZipFile(name) as z:
              assert z.testzip() is None, "ZIP com erro de CRC"
              members=z.namelist()
              assert sum("/02_PNG_128_originais/" in m and m.endswith(".png") for m in members)==68
              assert sum("/03_PNG_512_pixel_art_derivado/" in m and m.endswith(".png") for m in members)==68
              assert sum("/04_PNG_512_amostragem_derivada/" in m and m.endswith(".png") for m in members)==68
          print("PASSOU: 68 originais, 68 pixel-art 512, 68 amostradas 512 e ZIP íntegro")
          PY
          sha256sum "$file"

      - name: Gerar artefato acessível pelo workflow
        uses: actions/upload-artifact@v4
        with:
          name: EDU_68_SPRITES_LT320_AUDITORIA
          path: |
            exports/EDU_68_SPRITES_LT320_AUDITORIA_2026-11-08.zip
            exports/EDU_68_SPRITES_LT320_AUDITORIA_2026-11-08_RESUMO.json
          retention-days: 90

      - name: Publicar arquivo para download público em branch QA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f exports/EDU_68_SPRITES_LT320_AUDITORIA_2026-11-08.zip
          git add -f exports/EDU_68_SPRITES_LT320_AUDITORIA_2026-11-08_RESUMO.json
          git commit -m "qa(edu): disponibilizar ZIP auditado de 68 sprites LT320"
          git push origin HEAD:qa/edu-sprite-export-lt320-20261108
