name: PokeSearch 51192 - APK Amigos 20 dias
on:
  push:
    branches:
      - distribution/friends-51192-expira-20261110
    paths:
      - 'app/**'
      - '.github/workflows/distribute-friends-51192.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk-amigos:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      POKE_TEST_SIGNING_REQUIRED: "true"
      POKE_FRIENDS_DISTRIBUTION: "true"
      POKE_TEST_STORE_PASSWORD: ${{ secrets.POKE_TEST_STORE_PASSWORD }}
      POKE_TEST_KEY_ALIAS: ${{ secrets.POKE_TEST_KEY_ALIAS }}
      POKE_TEST_KEY_PASSWORD: ${{ secrets.POKE_TEST_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore permanent test signing key
        shell: bash
        env:
          POKE_TEST_KEYSTORE_B64: ${{ secrets.POKE_TEST_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for value in "${POKE_TEST_KEYSTORE_B64:-}" "${POKE_TEST_STORE_PASSWORD:-}" "${POKE_TEST_KEY_ALIAS:-}" "${POKE_TEST_KEY_PASSWORD:-}"; do
            test -n "$value" || { echo "::error::Missing stable test-signing secret"; exit 1; }
          done
          umask 077
          printf '%s' "$POKE_TEST_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pokesearch-friends-signing.p12"
          chmod 600 "$RUNNER_TEMP/pokesearch-friends-signing.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/pokesearch-friends-signing.p12" -storepass "$POKE_TEST_STORE_PASSWORD" -alias "$POKE_TEST_KEY_ALIAS" >/dev/null
          echo "POKE_TEST_KEYSTORE=$RUNNER_TEMP/pokesearch-friends-signing.p12" >> "$GITHUB_ENV"
          # Previous official test APK 51192 is versionCode 54192.
          echo "POKE_TEST_VERSION_CODE=54193" >> "$GITHUB_ENV"
          echo "POKE_TEST_VERSION_LABEL=51192" >> "$GITHUB_ENV"
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Source validation
        run: |
          node --check app/src/main/assets/probe.js
          node app/tests/location-probe.test.js
          node app/tests/probe-smoke.test.js
          node app/tests/pokemon-picker.test.js
          node app/tests/login-entry.test.js
          node app/tests/overlay-ux.test.js
          node app/tests/visual-editor.test.js
          node app/tests/signing-contract.test.js
          node app/tests/friends-expiry.test.js
      - name: Build non-debuggable minified release with permanent key
        run: gradle --no-daemon :app:assembleRelease :app:testDebugUnitTest
      - name: Verify APK, pinned signer, exact version and no debuggable flag
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          grep -Fq "name='com.lucianotoscano.pokesearch' versionCode='54193' versionName='0.51-beta.test.51192'" <<< "$BADGING"
          if grep -q '^application-debuggable' <<< "$BADGING"; then
            echo "::error::Debuggable APK may not be shared"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signature-report.txt"
          grep -Eq '^Verified using v2 scheme.*: true$' "$RUNNER_TEMP/signature-report.txt"
          grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/signature-report.txt" | awk '{print $NF}' > SIGNING_CERT_SHA256.txt
          test "$(tr -d ':\r\n ' < SIGNING_CERT_SHA256.txt | tr '[:upper:]' '[:lower:]')" = '34766c15d09013ad65873f9976539c8fa2f826e917dae3af57ea628cad689e8e'
          if unzip -Z1 "$APK" | grep -E '(^|/)([^/]+\.(java|kt|jks|p12|keystore)|mapping\.txt)$'; then
            echo "::error::Source/mapping/secrets found in APK"
            exit 1
          fi
          cp "$APK" PokeSearch-0.51-beta.test.51192-Amigos.apk
          sha256sum PokeSearch-0.51-beta.test.51192-Amigos.apk > SHA256SUMS.txt
      - name: Publish APK only (no source, extraction ZIP, or mapping)
        uses: actions/upload-artifact@v4
        with:
          name: PokeSearch-51192-Amigos-APK
          path: |
            PokeSearch-0.51-beta.test.51192-Amigos.apk
            SHA256SUMS.txt
            SIGNING_CERT_SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Delete temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pokesearch-friends-signing.p12"
