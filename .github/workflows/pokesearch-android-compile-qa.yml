name: PokeSearch LT63 Android Java compile (sem APK)
on:
  push:
    branches: [fix/lt63-samsung-cascade-ui-20261023]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle.kts'
      - '.github/workflows/pokesearch-android-compile-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle.kts'
      - '.github/workflows/pokesearch-android-compile-qa.yml'
permissions:
  contents: read
concurrency:
  group: pokesearch-android-compile-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  android-compile-only:
    name: Compilar Java Android sem APK nem assinatura
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout do SHA exato da PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar SDK Android 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Compilar apenas fontes e recursos de debug
        shell: bash
        env:
          POKE_TEST_SIGNING_REQUIRED: 'false'
        run: |
          set -euo pipefail
          echo "Commit validado: $(git rev-parse HEAD)"
          gradle :app:compileDebugJavaWithJavac --no-daemon --stacktrace
          if find app/build/outputs -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::A compilação não deveria gerar APK"
            exit 1
          fi
          echo "Compile Java/Android OK; nenhum APK gerado."
