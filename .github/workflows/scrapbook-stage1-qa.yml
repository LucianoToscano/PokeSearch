name: PokeSearch Scrapbook Stage 1 QA (no APK)
on:
  push:
    branches:
      - feature/pokesearch-community-scrapbook-stage1-20261025
    paths:
      - 'app/tests/scrapbook-stage1.test.js'
      - 'app/src/main/java/com/lucianotoscano/pokesearchoverlay/CommunityScrapbook*.java'
      - 'app/src/main/java/com/lucianotoscano/pokesearchoverlay/MainActivity.java'
      - 'app/src/main/AndroidManifest.xml'
      - '.github/workflows/scrapbook-stage1-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scrapbook-stage1-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    name: Stage 1 + all historical Node regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all JS tests without publishing
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          for suite in app/tests/*.test.js; do
            # Pre-existing LT74 debug preview fixture is excluded in the
            # upstream successful LT88 R8 signed QA workflow as well.
            if [ "$suite" = "app/tests/lt74-local-update-preview.test.js" ]; then
              echo "::notice::Upstream-known LT74 obsolete debug-preview test excluded"
              continue
            fi
            echo "::group::$suite"
            node "$suite"
            echo "::endgroup::"
          done
          test -z "$(git status --porcelain)"
          echo "All Node tests successful; no release artifacts"
  android-compile:
    name: Compile Java and manifest only (no APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ensure SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Java without signing or generating APK
        shell: bash
        env:
          POKE_TEST_SIGNING_REQUIRED: 'false'
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          gradle :app:compileDebugJavaWithJavac --no-daemon --stacktrace
          if find app/build/outputs -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Unexpected APK output"
            exit 1
          fi
          echo "Android source compile PASS; no APK created"
