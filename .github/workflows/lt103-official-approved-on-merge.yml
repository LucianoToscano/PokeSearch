name: PokeSearch LT103 official - explicitly approved one-time promotion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lt103-official-approved-on-merge.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: pokesearch-approved-public-release
  cancel-in-progress: false
jobs:
  approve-and-release-lt103:
    if: github.repository == 'LucianoToscano/PokeSearch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: official-updates
    timeout-minutes: 25
    env:
      QA_RUN_ID: '40202166900'
      QA_SOURCE: 'e86c1fb385e7345fbe8414c5932d17babc38c267'
      QA_ARTIFACT: 'PokeSearch-v0.00.103-LT-Compact-Location-Integrated-Thanks-QA-protected-release'
      QA_APK: 'PokeSearch-v0.00.103-LT-Compact-Location-Integrated-Thanks-QA.apk'
      OFFICIAL_APK: 'PokeSearch-v0.00.103-LT.apk'
      VERSION: '0.00.103'
      VERSION_CODE: '54306'
      TAG: 'v0.00.103-54306'
      CERT: '34766c15d09013ad65873f9976539c8fa2f826e917dae3af57ea628cad689e8e'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact approved source is preserved in main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git cat-file -e "$QA_SOURCE^{commit}"
          git merge-base --is-ancestor "$QA_SOURCE" HEAD
          git diff --quiet "$QA_SOURCE" HEAD -- app/src/main app/build.gradle.kts firebase-realtime.rules.json
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Official $TAG already published. Nothing will be overwritten."
            exit 0
          fi
      - name: Download the previously signed successful QA artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view "$QA_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" = success
          mkdir -p "$RUNNER_TEMP/approved"
          gh run download "$QA_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$QA_ARTIFACT" --dir "$RUNNER_TEMP/approved"
      - name: Ensure Android 36 build tools for APK verification
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'build-tools;36.0.0'
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Check exact APK hash, original source, release identity and signature
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/approved"
          test -s "$QA_APK"
          test -s SOURCE_COMMIT.txt
          test -s SHA256SUMS.txt
          test "$(tr -d '\r\n' < SOURCE_COMMIT.txt)" = "$QA_SOURCE"
          sha256sum -c SHA256SUMS.txt
          unzip -t "$QA_APK" >/dev/null
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          echo "Checking signed APK with Android Build Tools 36"
          test -x "$BUILD_TOOLS/aapt"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/aapt" dump badging "$QA_APK" > "$RUNNER_TEMP/badging.txt"
          grep '^package: ' "$RUNNER_TEMP/badging.txt"
          grep -Fq "name='com.lucianotoscano.pokesearch'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionCode='$VERSION_CODE'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionName='$VERSION'" "$RUNNER_TEMP/badging.txt"
          ! grep -q '^application-debuggable' "$RUNNER_TEMP/badging.txt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$QA_APK" > "$RUNNER_TEMP/signing.txt"
          grep -E 'Verified using v2 scheme|Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/signing.txt"
          grep -Eq '^Verified using v2 scheme.*: true$' "$RUNNER_TEMP/signing.txt"
          FINGERPRINT="$(grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/signing.txt" | awk '{print $NF}')"
          test "$FINGERPRINT" = "$CERT"
          cp "$QA_APK" "$RUNNER_TEMP/$OFFICIAL_APK"
          sha256sum "$RUNNER_TEMP/$OFFICIAL_APK" > "$RUNNER_TEMP/official-SHA256SUMS.txt"
      - name: Publish stable GitHub Release for in-app automatic updater
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Stable $TAG already exists. Refusing to overwrite."
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## PokeSearch 0.00.103 LT — atualização oficial
          - Preservado o trabalho LT88–LT93, os filtros/IV/GL/UL, Shiny, Favoritos, API autorizada e overlay.
          - Preservadas as correções de sprites da LT102, mantendo fallback neutro quando o provedor não entrega imagem verificada.
          - Correção urgente Samsung: popup de Localização limitado a 148 dp também na janela nativa, com Colar/Copiar, coordenadas até 30 caracteres, slider alinhado, km, Aplicar e Limpar.
          - Home: Agradecimentos integrados à linha de Compartilhar app (sem banner isolado), Mural scrapbook e homenagem offline intactos.
          - **Publicações do Mural:** exigem regras Firebase implantadas e `scrapbook/config/allowDirectPosts=true`. Sem essa configuração, o servidor pode bloquear o envio. Nenhuma alteração remota ao Firebase faz parte desta Release.
          - APK não depurável, R8/ProGuard, certificado permanente e SHA-256 verificados.
          - QA automatizada aprovada; homologação física Samsung ainda deve confirmar dimensões e toque. Algumas formas especiais podem permanecer sem sprite quando a origem não fornece imagem.
          NOTES
          gh release create "$TAG" "$RUNNER_TEMP/$OFFICIAL_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$QA_SOURCE" \
            --title "PokeSearch 0.00.103 LT" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
      - name: Verify final official update metadata
        shell: bash
        run: |
          set -euo pipefail
          DATA="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(echo "$DATA" | jq -r .draft)" = false
          test "$(echo "$DATA" | jq -r .prerelease)" = false
          NAME="$(echo "$DATA" | jq -r --arg n "$OFFICIAL_APK" '.assets[] | select(.name == $n) | .name')"
          test "$NAME" = "$OFFICIAL_APK"
          DIGEST="$(echo "$DATA" | jq -r --arg n "$OFFICIAL_APK" '.assets[] | select(.name == $n) | .digest')"
          test "${DIGEST#sha256:}" = "$(sha256sum "$RUNNER_TEMP/$OFFICIAL_APK" | cut -d' ' -f1)"
