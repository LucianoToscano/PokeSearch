name: PokeSearch LT104 Dual Pokeballs - signed QA APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lt104-dual-pokeballs-signed-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pokesearch-lt104-dual-pokeballs-protected-qa
  cancel-in-progress: false
jobs:
  dual-overlay-signed-qa:
    if: github.repository == 'LucianoToscano/PokeSearch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      POKE_TEST_VERSION_CODE: '54307'
      POKE_TEST_VERSION_LABEL: '51107'
      POKE_TEST_PUBLIC_VERSION: '0.00.104'
      POKE_RELEASE_CERT_SHA256: '34766c15d09013ad65873f9976539c8fa2f826e917dae3af57ea628cad689e8e'
      POKE_RELEASE_STORE_PASSWORD: ${{ secrets.POKE_TEST_STORE_PASSWORD }}
      POKE_RELEASE_KEY_ALIAS: ${{ secrets.POKE_TEST_KEY_ALIAS }}
      POKE_RELEASE_KEY_PASSWORD: ${{ secrets.POKE_TEST_KEY_PASSWORD }}
      # Preserve the explicitly signed LT103 QA state for scrapbook.
      POKE_SCRAPBOOK_STAGE1_QA: 'true'
      POKE_SCRAPBOOK_QA_ACK: 'stage1-readonly'
      POKE_SCRAPBOOK_ONLINE_QA: 'true'
      POKE_SCRAPBOOK_ONLINE_ACK: 'direct-posting-owner-monitored'
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore permanent keystore privately
        shell: bash
        env:
          POKE_TEST_KEYSTORE_B64: ${{ secrets.POKE_TEST_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for key in POKE_TEST_KEYSTORE_B64 POKE_RELEASE_STORE_PASSWORD POKE_RELEASE_KEY_ALIAS POKE_RELEASE_KEY_PASSWORD; do
            test -n "$(printenv "$key")" || { echo "::error::Missing protected signing secret"; exit 1; }
          done
          umask 077
          printf '%s' "$POKE_TEST_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pokesearch-lt104-signing.p12"
          chmod 600 "$RUNNER_TEMP/pokesearch-lt104-signing.p12"
          keytool -list -keystore "$RUNNER_TEMP/pokesearch-lt104-signing.p12" -storetype PKCS12 -storepass "$POKE_RELEASE_STORE_PASSWORD" -alias "$POKE_RELEASE_KEY_ALIAS" >/dev/null
          echo "POKE_RELEASE_KEYSTORE=$RUNNER_TEMP/pokesearch-lt104-signing.p12" >> "$GITHUB_ENV"
      - name: Verify JavaScript and regression suites
        shell: bash
        run: |
          set -euo pipefail
          for file in probe.js api_result_contract.js api_browser_transport.js api_android_session.js api_catalog_cache.js api_integration_router.js; do
            node --check "app/src/main/assets/$file"
          done
          for suite in app/tests/*.test.js; do
            if [ "$suite" = "app/tests/lt74-local-update-preview.test.js" ]; then
              echo "::notice::Historical debug-only LT74 preview skipped (as in LT103 QA)"
              continue
            fi
            echo "::group::$suite"
            node "$suite"
            echo "::endgroup::"
          done
          mkdir -p "$RUNNER_TEMP/qa"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/qa" app/src/main/java/com/lucianotoscano/pokesearchoverlay/SupportMissionPolicy.java app/src/main/java/com/lucianotoscano/pokesearchoverlay/UpdatePolicy.java app/src/main/java/com/lucianotoscano/pokesearchoverlay/PopupTouchGeometry.java app/tests/SupportMissionPolicyTest.java app/tests/UpdatePolicyTest.java app/tests/PopupTouchGeometryTest.java
          java -cp "$RUNNER_TEMP/qa" com.lucianotoscano.pokesearchoverlay.SupportMissionPolicyTest
          java -cp "$RUNNER_TEMP/qa" com.lucianotoscano.pokesearchoverlay.UpdatePolicyTest
          java -cp "$RUNNER_TEMP/qa" com.lucianotoscano.pokesearchoverlay.PopupTouchGeometryTest
      - name: Assemble signed protected LT104 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Audit release, package, certificate and source
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          OUTPUT="PokeSearch-v0.00.104-LT-Dual-Pokeballs-QA.apk"
          test -s "$APK"
          test -s app/build/outputs/mapping/release/mapping.txt
          unzip -t "$APK" > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > PACKAGE-BADGING.txt
          PACKAGE="$(grep '^package: ' PACKAGE-BADGING.txt)"
          grep -Fq "name='com.lucianotoscano.pokesearch'" <<< "$PACKAGE"
          grep -Fq "versionCode='54307'" <<< "$PACKAGE"
          grep -Fq "versionName='0.00.104'" <<< "$PACKAGE"
          ! grep -q '^application-debuggable' PACKAGE-BADGING.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > SIGNING-REPORT.txt
          grep -Eq '^Verified using v2 scheme.*: true$' SIGNING-REPORT.txt
          ACTUAL="$(grep 'Signer #1 certificate SHA-256 digest:' SIGNING-REPORT.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$POKE_RELEASE_CERT_SHA256"
          test -s app/src/main/java/com/lucianotoscano/pokesearchoverlay/SecondaryOverlayService.java
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" > SHA256SUMS.txt
          git rev-parse HEAD > SOURCE_COMMIT.txt
          echo "$PACKAGE" > PACKAGE-VERSION.txt
          printf 'Protected RELEASE, non-debuggable, R8; permanent certificate preserved.\n' > PROTECTION.txt
          cat SOURCE_COMMIT.txt
          cat SHA256SUMS.txt
      - name: Upload signed LT104 APK, QA only
        uses: actions/upload-artifact@v4
        with:
          name: PokeSearch-v0.00.104-LT-Dual-Pokeballs-QA-protected-release
          path: |
            PokeSearch-v0.00.104-LT-Dual-Pokeballs-QA.apk
            SHA256SUMS.txt
            SOURCE_COMMIT.txt
            SIGNING-REPORT.txt
            PACKAGE-VERSION.txt
            PROTECTION.txt
          retention-days: 30
          if-no-files-found: error
      - name: Delete temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pokesearch-lt104-signing.p12"
