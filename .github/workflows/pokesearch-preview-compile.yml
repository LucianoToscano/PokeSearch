name: FastDev Preview Android compile (no signing, no APK)
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/preview/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/lucianotoscano/pokesearchoverlay/GitHubUpdateCenter.java'
      - 'app/build.gradle.kts'
      - '.github/workflows/pokesearch-preview-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fastdev-preview-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preview-java:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile actual Preview Java (no APK, no secrets)
        run: gradle --no-daemon --build-cache :app:compilePreviewJavaWithJavac --stacktrace
