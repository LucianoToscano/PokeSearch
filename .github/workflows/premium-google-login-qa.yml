name: PokeSearch Premium Google Sign-In — isolated Android QA
on:
  push:
    branches:
      - feature/premium-google-login-qa-20261027
    paths:
      - 'app/**'
      - 'docs/POKESEARCH_PREMIUM_GOOGLE_LOGIN_QA_20261027.md'
      - 'package.json'
      - '.github/workflows/premium-google-login-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-google-firebase-login:
    runs-on: ubuntu-24.04
    # This is an OAuth client ID, not a secret. Do not commit actual credentials.
    env:
      POKE_GOOGLE_WEB_CLIENT_ID: ${{ vars.POKE_GOOGLE_WEB_CLIENT_ID }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test Premium contracts (no Firebase or Pix writes)
        run: npm run test:premium
      - name: Preserve dual-overlay regression tests
        run: |
          node app/tests/lt104-dual-overlays.test.js
          node app/tests/lt112-dual-overlay-parity.test.js
          node app/tests/lt113-get-coords-canonical-dual.test.js
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Compile debug variant only (no signature or APK publication)
        run: gradle --no-daemon :app:assembleDebug
