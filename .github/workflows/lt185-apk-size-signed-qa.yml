name: 'LT185 — APK menor, QA assinado (sem distribuicao)'
on:
  push:
    branches: ['optimize/lt185-apk-size-20261029']
    paths:
      - 'scripts/optimize_apk_size_lt185.py'
      - '.github/workflows/lt185-apk-size-signed-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pokesearch-lt185-slim
  cancel-in-progress: false
jobs:
  optimize-and-qa:
    if: github.repository == 'LucianoToscano/PokeSearch' && github.ref == 'refs/heads/optimize/lt185-apk-size-20261029'
    runs-on: ubuntu-24.04
    environment: official-updates
    timeout-minutes: 85
    env:
      POKE_TEST_VERSION_CODE: '54390'
      POKE_TEST_VERSION_LABEL: '51190'
      POKE_TEST_PUBLIC_VERSION: '0.01.85'
      POKE_RELEASE_CERT_SHA256: '34766c15d09013ad65873f9976539c8fa2f826e917dae3af57ea628cad689e8e'
      POKE_CONTROLLED_DISTRIBUTION: 'true'
      POKE_RELEASE_STORE_PASSWORD: ${{ secrets.POKE_TEST_STORE_PASSWORD }}
      POKE_RELEASE_KEY_ALIAS: ${{ secrets.POKE_TEST_KEY_ALIAS }}
      POKE_RELEASE_KEY_PASSWORD: ${{ secrets.POKE_TEST_KEY_PASSWORD }}
      POKE_GOOGLE_WEB_CLIENT_ID: ${{ vars.POKE_GOOGLE_WEB_CLIENT_ID }}
      POKE_CHAT_GOOGLE_WEB_CLIENT_ID: '1007816617051-abhc4riftns3om8gs0o67ce1s386ue9d.apps.googleusercontent.com'
      POKE_SCRAPBOOK_STAGE1_QA: 'true'
      POKE_SCRAPBOOK_QA_ACK: 'stage1-readonly'
      POKE_SCRAPBOOK_ONLINE_QA: 'true'
      POKE_SCRAPBOOK_ONLINE_ACK: 'read-only-moderation-pending'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: optimize/lt185-apk-size-20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optimizar PNG com qualidade minima e verificar economia
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y pngquant
          python3 -m pip install 'Pillow==11.3.0'
          git merge-base --is-ancestor v0.01.84-54389 HEAD
          python3 scripts/optimize_apk_size_lt185.py --apply --report LT185-SIZE-REPORT.json
          python3 - <<'PY'
          import json
          r=json.load(open("LT185-SIZE-REPORT.json"))
          assert r["baseline_saved_bytes"] >= 1048576, "Economia de recursos inferior a 1 MiB"
          assert r["baseline_optimized_files"] >= 5
          print("Arquivos reduzidos vs LT184:",r["baseline_optimized_files"],"Bytes economizados:",r["baseline_saved_bytes"])
          PY
      - name: Registrar os binarios reduzidos somente na branch QA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi app/src/main/assets/branding \
            app/src/main/assets/result-icons app/src/main/assets/weather-icons/v2
          if ! git diff --cached --quiet; then
            git commit -m 'LT185 QA: otimizar imagens PNG sem alterar interface'
            git push origin HEAD:refs/heads/optimize/lt185-apk-size-20261029
          fi
          git rev-parse HEAD > SOURCE_COMMIT.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK Android 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restaurar assinatura permanente no ambiente protegido
        shell: bash
        env:
          POKE_TEST_KEYSTORE_B64: ${{ secrets.POKE_TEST_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for k in POKE_TEST_KEYSTORE_B64 POKE_RELEASE_STORE_PASSWORD POKE_RELEASE_KEY_ALIAS POKE_RELEASE_KEY_PASSWORD; do
            test -n "$(printenv "$k")" || exit 1
          done
          umask 077
          printf '%s' "$POKE_TEST_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lt185.p12"
          echo "POKE_RELEASE_KEYSTORE=$RUNNER_TEMP/lt185.p12" >> "$GITHUB_ENV"
          CERT="$(keytool -exportcert -rfc -keystore "$RUNNER_TEMP/lt185.p12" -storetype PKCS12 -storepass "$POKE_RELEASE_STORE_PASSWORD" -alias "$POKE_RELEASE_KEY_ALIAS" |
            openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':\r' | tr 'A-F' 'a-f')"
          test "$CERT" = "$POKE_RELEASE_CERT_SHA256"
      - name: Regressao completa incluindo LT184 P1/P2 e Doce Raro
        shell: bash
        run: |
          set -euo pipefail
          for t in app/tests/*.test.js; do
            [ "$t" = 'app/tests/lt74-local-update-preview.test.js' ] && continue
            node "$t" > /dev/null || { echo "FALHOU: $t"; node "$t"; exit 1; }
          done
          python3 scripts/test_ota_builder.py
          node --check app/src/main/assets/rare_candy_probe.js
      - name: Restaurar sprites identicas ao processo oficial LT184
        shell: bash
        run: |
          set -euo pipefail
          python3 app/scripts/build_pokemon_card_metadata.py
          python3 app/scripts/update_wwm_catalog.py app/src/main/assets
          python3 app/scripts/build_sprite_bundle.py --workers 12 --minimum-normal 950
          test -s app/src/main/assets/pokemon-sprites/manifest.json
      - name: Compilar APK R8 com assinatura permanente apenas para QA
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Validar APK, versao, assinatura, economia e SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          test -s app/build/outputs/mapping/release/mapping.txt
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" > APK-ENTRIES.txt
          for asset in assets/dock.html assets/probe.js assets/rare_candy_controls.html \
            assets/rare_candy_probe.js assets/rare_candy_icon.b64 assets/pokemon-sprites/manifest.json; do
            grep -Fxq "$asset" APK-ENTRIES.txt
          done
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > PACKAGE-VERSION.txt
          grep -Fq "name='com.lucianotoscano.pokesearch'" PACKAGE-VERSION.txt
          grep -Fq "versionCode='54390'" PACKAGE-VERSION.txt
          grep -Fq "versionName='0.01.85'" PACKAGE-VERSION.txt
          ! grep -Fq 'application-debuggable' PACKAGE-VERSION.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > SIGNING-REPORT.txt
          grep -Eq '^Verified using v2 scheme.*: true$' SIGNING-REPORT.txt
          ACTUAL="$(grep 'Signer #1 certificate SHA-256 digest:' SIGNING-REPORT.txt | awk '{print $NF}' | tr 'A-F' 'a-f')"
          test "$ACTUAL" = "$POKE_RELEASE_CERT_SHA256"
          BYTES="$(stat -c %s "$APK")"
          echo "LT184: 49547006 bytes | LT185 QA: $BYTES bytes"
          test "$BYTES" -lt 49547006
          cp "$APK" PokeSearch-v0.01.85-LT185-Size-QA.apk
          sha256sum PokeSearch-v0.01.85-LT185-Size-QA.apk > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Entrega APK QA (nenhuma publicacao)
        uses: actions/upload-artifact@v4
        with:
          name: PokeSearch-LT185-54390-Size-QA-Assinado
          path: |
            PokeSearch-v0.01.85-LT185-Size-QA.apk
            LT185-SIZE-REPORT.json
            SHA256SUMS.txt
            SOURCE_COMMIT.txt
            SIGNING-REPORT.txt
            PACKAGE-VERSION.txt
            APK-ENTRIES.txt
          if-no-files-found: error
          retention-days: 90
      - name: Descartar chave de assinatura
        if: always()
        run: rm -f "$RUNNER_TEMP/lt185.p12"
