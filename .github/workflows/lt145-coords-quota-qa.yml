name: LT145 quota regression
on:
  push:
    branches:
      - feature/lt145-coords-quota-account-20261028
jobs:
  quota-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate LT145 sources and tests
        run: |
          node --check app/src/main/assets/coords_quota.js
          node --check app/src/main/assets/api_browser_transport.js
          node --check app/src/main/assets/api_android_session.js
          python3 app/scripts/build_pokemon_card_metadata.py
          node --check app/src/main/assets/pokemon_type_icons.js
          node --check app/src/main/assets/pokemon_card_metadata.js
          node --check app/src/main/assets/pokemon_card_presentation.js
          for suite in app/tests/*.test.js; do
            if [ "$suite" = "app/tests/lt74-local-update-preview.test.js" ]; then continue; fi
            echo "Running $suite"
            node "$suite"
          done
