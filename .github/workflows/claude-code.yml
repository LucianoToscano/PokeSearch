# Integração manual, sob demanda, do Claude Code no PokeSearch.
# Não roda em push, agenda, abertura de PR ou por terceiros.
name: Claude Code - PokeSearch (sob demanda)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: claude-pokesearch-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # Repositório público: somente comentários do proprietário contendo @claude.
    if: >-
      github.actor == 'LucianoToscano' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Verificar autenticação Anthropic
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" && -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::Configure um secret: ANTHROPIC_API_KEY ou CLAUDE_CODE_OAUTH_TOKEN."
            exit 1
          fi
          if [[ -n "$ANTHROPIC_API_KEY" && -n "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::Configure somente um dos dois tipos de credenciais."
            exit 1
          fi

      - name: Claude Code - executar tarefa solicitada
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          claude_args: |
            --max-turns 8
          additional_permissions: |
            actions: read
