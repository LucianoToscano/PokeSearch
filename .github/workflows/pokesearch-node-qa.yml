name: PokeSearch Node QA (sem APK)
on:
  push:
    branches:
      - main
      - fix/lt57-compact-single-form-20261022
      - feature/pokesearch-51081-visual-editor-20261021
      - feature/release-notes-20261022
    paths:
      - 'app/tests/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/java/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - '.github/workflows/pokesearch-node-qa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/tests/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/java/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - '.github/workflows/pokesearch-node-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokesearch-node-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-only-qa:
    name: Suítes Node, sem Gradle e sem APK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exato
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Registrar SHA testado
        shell: bash
        run: |
          echo "HEAD validado: $(git rev-parse HEAD)"
          node --version
          git status --short
      - name: Verificar sintaxe do probe e scripts locais
        shell: bash
        run: |
          node --check app/src/main/assets/probe.js
          node --check app/src/main/assets/pvpoke-overall-ranks.js
          node --check app/src/main/assets/pvpoke-iv-gamemaster.js
          node - <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          for(const file of ['app/src/main/assets/dock.html','app/src/main/assets/detail.html']){
            const html=fs.readFileSync(file,'utf8');
            let count=0;
            const blocks=html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g);
            for(const match of blocks){
              new vm.Script(match[1],{filename:file+':inline-'+(++count)});
            }
            if(!count)throw Error('Sem scripts inline: '+file);
            console.log(file+': '+count+' blocos JS validados');
          }
          NODE
      - name: Executar suítes Node até LT196, incluindo P1/P2, IV e Doce Raro compacto
        shell: bash
        run: |
          set -euo pipefail
          for suite in             app/tests/location-probe.test.js             app/tests/probe-smoke.test.js             app/tests/pokemon-picker.test.js             app/tests/login-entry.test.js             app/tests/overlay-ux.test.js             app/tests/visual-editor.test.js             app/tests/signing-contract.test.js             app/tests/firebase-stats.test.js             app/tests/lt62-menu-visual-states.test.js             app/tests/lt104-dual-overlays.test.js             app/tests/lt112-dual-overlay-parity.test.js             app/tests/lt113-get-coords-canonical-dual.test.js             app/tests/lt165-pvp-costume-evolution-references.test.js             app/tests/lt167-chat-capture-uid-avatar-icons.test.js             app/tests/lt168-legacy-chat-identity-icon-matte.test.js             app/tests/lt168-home-data-import.test.js             app/tests/lt169-all-go-sprites-api-dom-parity.test.js             app/tests/lt188-dual-mode-filters.test.js             app/tests/lt189-api-default-schema.test.js             app/tests/lt190-provider-429-backoff-dual.test.js             app/tests/lt191-provider-backoff-24h.test.js             app/tests/lt192-iv-evidence-mode-transition.test.js             app/tests/lt193-api-decimal-iv-native.test.js             app/tests/lt194-api-dom-iv-evidence-parity.test.js             app/tests/lt195-candy-next-hop-cooldown.test.js             app/tests/lt196-candy-compact-sprite.test.js; do
            echo "::group::$suite"
            node "$suite"
            echo "::endgroup::"
          done
      - name: Validar histórico da Home LT79–LT83
        run: node app/tests/lt83-home-release-notes.test.js
      - name: Validar geometria Java de janela popup isolada sem Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testar limites de toque sem Android nem APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pokesearch-popup-geometry"
          javac --release 17 -d "$RUNNER_TEMP/pokesearch-popup-geometry" \
            app/src/main/java/com/lucianotoscano/pokesearchoverlay/PopupTouchGeometry.java \
            app/tests/PopupTouchGeometryTest.java
          java -cp "$RUNNER_TEMP/pokesearch-popup-geometry" \
            com.lucianotoscano.pokesearchoverlay.PopupTouchGeometryTest
      - name: Executar política nativa Java de IV (produção) sem Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pokesearch-iv-policy"
          javac --release 17 -d "$RUNNER_TEMP/pokesearch-iv-policy" \
            app/src/main/java/com/lucianotoscano/pokesearchoverlay/VerifiedIvMath.java \
            app/tests/VerifiedIvMathTest.java
          java -cp "$RUNNER_TEMP/pokesearch-iv-policy" \
            com.lucianotoscano.pokesearchoverlay.VerifiedIvMathTest
      - name: Testar cooldown real de produção dos Doces Raros na JVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pokesearch-candy-cooldown"
          javac --release 17 -d "$RUNNER_TEMP/pokesearch-candy-cooldown" \
            app/src/main/java/com/lucianotoscano/pokesearchoverlay/CandyCooldownPolicy.java \
            app/tests/CandyCooldownPolicyTest.java
          java -cp "$RUNNER_TEMP/pokesearch-candy-cooldown" \
            com.lucianotoscano.pokesearchoverlay.CandyCooldownPolicyTest
      - name: Verificar checkout somente leitura
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          echo "Nenhuma alteração no checkout. Nenhum Gradle, build, merge ou APK."
