name: PokeSearch Premium Pix — isolated QA (no production deploy)
on:
  push:
    branches:
      - feature/premium-pix-remote-control-qa-20261027
    paths:
      - 'app/**'
      - 'functions/**'
      - '.github/workflows/premium-pix-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate billing functions and fail-closed contracts
        run: |
          node --check functions/index.js
          node --check functions/premium.js
          node app/tests/premium-controlled-distribution.test.js
      - name: Preserve existing dual overlay regressions
        run: |
          node app/tests/lt104-dual-overlays.test.js
          node app/tests/lt112-dual-overlay-parity.test.js
          node app/tests/lt113-get-coords-canonical-dual.test.js
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android Debug only; no charge, secret or release
        run: gradle --no-daemon :app:assembleDebug
