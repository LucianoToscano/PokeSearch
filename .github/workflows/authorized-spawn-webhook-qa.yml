name: Authorized spawn webhook normalization QA

on:
  push:
    branches:
      - feat/authorized-spawn-webhook-normalizer-20261122
    paths:
      - 'functions/spawn-observation-normalizer.js'
      - 'functions/spawn-observation-normalizer.test.js'
      - 'functions/spawn-observation-cli.test.js'
      - 'scripts/normalize-authorized-spawns.js'
      - '.github/workflows/authorized-spawn-webhook-qa.yml'
  pull_request:
    paths:
      - 'functions/spawn-observation-normalizer.js'
      - 'functions/spawn-observation-normalizer.test.js'
      - 'functions/spawn-observation-cli.test.js'
      - 'scripts/normalize-authorized-spawns.js'
      - '.github/workflows/authorized-spawn-webhook-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feed-normalizer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check functions/spawn-observation-normalizer.js
          node --check functions/spawn-observation-normalizer.test.js
          node --check functions/spawn-observation-cli.test.js
          node --check scripts/normalize-authorized-spawns.js
      - name: Run isolated authorization and data-integrity checks
        run: node --test functions/spawn-observation-normalizer.test.js functions/spawn-observation-cli.test.js
