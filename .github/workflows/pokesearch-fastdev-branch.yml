name: PokeSearch FastDev - rapid branch smoke (no APK)
on:
  push:
    branches:
      - 'fastdev/**'
    paths:
      - 'app/**'
      - 'scripts/fastdev.cjs'
      - 'scripts/fastdev.test.cjs'
      - 'scripts/fastdev-automatic-home.test.cjs'
      - 'scripts/fastdev-qa-scope.cjs'
      - 'scripts/fastdev-qa-scope.test.cjs'
      - '.github/workflows/secure-release.yml'
      - 'scripts/fastdev-manifest.cjs'
      - 'scripts/fastdev-manifest.test.cjs'
      - 'scripts/fastdev-branch-contract.test.cjs'
      - '.github/workflows/pokesearch-fastdev-branch.yml'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'fastdev/**'
permissions:
  contents: read
concurrency:
  group: fastdev-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-smoke:
    name: FastDev incremental tests - no SDK, Gradle or APK
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit with full diff history
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node for lightweight source contracts
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check FastDev selector and safe branch-only policy
        run: |
          node --check scripts/fastdev.cjs
          node --test scripts/fastdev.test.cjs scripts/fastdev-branch-contract.test.cjs scripts/fastdev-automatic-home.test.cjs scripts/fastdev-qa-scope.test.cjs
      - name: Run only the tests affected by changes since main
        run: node scripts/fastdev.cjs --base origin/main
