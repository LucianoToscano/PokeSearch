name: LT145 QA11 — signed APK direct test download
on:
  push:
    branches: [feature/lt145-coords-quota-account-20261028]
    paths: ['.github/workflows/lt145-qa11-direct-apk.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish-private-track-qa-prerelease:
    if: github.repository == 'LucianoToscano/PokeSearch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '40788984674'
      SOURCE_COMMIT: '4f07ba2a6d3893678638f6e61ba0fdfe9dd59f66'
      ARTIFACT: 'PokeSearch-v0.01.45-LT145-CoordsQuota-QA-Assinado'
      PACKAGE_APK: 'PokeSearch-v0.01.45-LT-QA.apk'
      QA_APK: 'PokeSearch-LT145-QA11-COMPACTO.apk'
      QA_TAG: 'v0.01.45-54350-compact-qa11'
      RELEASE_CERT: '34766c15d09013ad65873f9976539c8fa2f826e917dae3af57ea628cad689e8e'
    steps:
      - name: Wait for successful signed QA11 artifact from exact source commit
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --exit-status
          mkdir -p qa
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir qa
          test "$(cat qa/SOURCE_COMMIT.txt)" = "$SOURCE_COMMIT"
          test -s "qa/$PACKAGE_APK"
          (cd qa && sha256sum --check SHA256SUMS.txt)
          test "$(stat -c%s "qa/$PACKAGE_APK")" -gt 30000000
          unzip -t "qa/$PACKAGE_APK" >/dev/null
          grep -Fq "Verified using v2 scheme" qa/SIGNING-REPORT.txt
          grep -Fq "$RELEASE_CERT" qa/SIGNING-REPORT.txt
          grep -Fq "versionCode='54350'" qa/PACKAGE-VERSION.txt
          grep -Fq "versionName='0.01.45'" qa/PACKAGE-VERSION.txt
          sha256sum "qa/$PACKAGE_APK"
          mv "qa/$PACKAGE_APK" "qa/$QA_APK"
          (cd qa && sha256sum "$QA_APK" > QA11-SHA256SUMS.txt)
      - name: Publish standalone QA11 prerelease, never touch public manifest
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$QA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::QA11 prerelease already exists; refusing overwrite"
            exit 1
          fi
          APK_SHA256="$(sha256sum "qa/$QA_APK" | cut -d ' ' -f1)"
          gh release create "$QA_TAG"             "qa/$QA_APK" "qa/QA11-SHA256SUMS.txt" "qa/SIGNING-REPORT.txt"             --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT"             --title "PokeSearch LT145 QA11 compacto - teste apenas"             --notes "Apenas homologação: card com largura 252dp e altura proporcional ao conteúdo, limite de 520dp dentro da tela, cabeçalho e rótulos organizados, Despawn antes da Pokédex e botão Pegar Coordenadas vermelho no repouso, vermelho-claro na consulta e verde quando pronto. Não atualiza Home, Firebase ou o manifesto de distribuição da LT144. Commit do APK: $SOURCE_COMMIT. APK SHA-256: $APK_SHA256."             --prerelease --latest=false
          gh release view "$QA_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets,isPrerelease             --jq '{url: .url, prerelease: .isPrerelease, assets: [.assets[].name]}'
