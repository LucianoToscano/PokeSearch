name: LT82 approved - publish verified GitHub update once
on:
  push:
    branches:
      - fix/lt82-samsung-ui-polish-20261025
    paths:
      - '.github/workflows/lt82-official-publish-once.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: official-release-pokesearch-v0.00.82-54285
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'LucianoToscano/PokeSearch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: official-updates
    env:
      GH_TOKEN: ${{ github.token }}
      QA_RUN: '40158722313'
      QA_ARTIFACT: 'PokeSearch-v0.00.82-LT-Samsung-QA-protected-release'
      EXPECTED_SOURCE: '0d7019d62704af560c44c7b7549a2614062fb5d9'
      EXPECTED_CERT: '34766c15d09013ad65873f9976539c8fa2f826e917dae3af57ea628cad689e8e'
      PUBLIC_NAME: '0.00.82'
      PUBLIC_CODE: '54285'
      TAG: 'v0.00.82-54285'
    steps:
      - name: Checkout release candidate (do not merge main)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: fix/lt82-samsung-ui-polish-20261025
      - name: Verify approved CI run and artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'LucianoToscano/PokeSearch'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN" --jq '.head_sha')" = "$EXPECTED_SOURCE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Version already published; refusing overwrite."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/verified"
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" --name "$QA_ARTIFACT" --dir "$RUNNER_TEMP/verified"
          cd "$RUNNER_TEMP/verified"
          test "$(cat SOURCE_COMMIT.txt)" = "$EXPECTED_SOURCE"
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test -s PROTECTION.txt
          APK=PokeSearch-v0.00.82-LT-Samsung-QA.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          grep -Fq "name='com.lucianotoscano.pokesearch'" PACKAGE-VERSION.txt
          grep -Fq "versionCode='$PUBLIC_CODE'" PACKAGE-VERSION.txt
          grep -Fq "versionName='$PUBLIC_NAME'" PACKAGE-VERSION.txt
          ! grep -q '^application-debuggable' PACKAGE-VERSION.txt
          grep -Fxq "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT" SIGNING-REPORT.txt
          grep -Eq '^Verified using v2 scheme.*: true$' SIGNING-REPORT.txt
          cp "$APK" "$RUNNER_TEMP/PokeSearch-v${PUBLIC_NAME}-LT.apk"
          sha256sum "$RUNNER_TEMP/PokeSearch-v${PUBLIC_NAME}-LT.apk" > "$RUNNER_TEMP/PUBLISHED-SHA256SUMS.txt"
      - name: Publish new stable version for LT79 GitHubUpdateCenter
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          PokeSearch 0.00.82 LT — melhorias na interface para Samsung e atualização automática.

          Novidades:
          - Localização com título e todos os controles centralizados em painel compacto: coordenadas em linha própria, barra de raio, Colar ↑, km, Aplicar e Limpar.
          - Campo de coordenadas mais legível, inclusive entradas como 24.9407581,121.1889794.
          - Aplicação e remoção de localização aprimoradas com reconfirmação no site antes de pesquisar.
          - Clima: seleção sincronizada via filtro do site, sem avisos técnicos que atrapalhem o menu.
          - Favoritos: diálogo reposicionado acima ou abaixo da estrela conforme espaço livre.
          - Tutorial de gestos somente no primeiro uso, com explicações curtas de Pokébola e ↻.
          - Dicas repetitivas/longas do botão de atualização removidas.
          - Correção LT80 do Get coords e proteções de identidade do Pokémon preservadas.
          - Configurações anteriores, IV/PvP, Shiny e favoritos preservados.
          - APK protegido com R8, não depurável e assinatura permanente verificada.

          Atualização automática: usuários LT79 e LT80 com suporte a GitHub Releases recebem esta versão ao verificar a Home, respeitando as condições de notificação e instalação do Android. A instalação requer confirmação do usuário.
          O Google Drive legado segue na LT79 como ponte para instalações antigas. GitHub é a fonte das novas versões.

          Homologação: testes automatizados, Gradle e verificação do APK aprovados. A validação manual desta versão num Samsung físico ainda depende do retorno do usuário; este lançamento foi expressamente autorizado antes dessa validação.
          Código-fonte testado: 0d7019d62704af560c44c7b7549a2614062fb5d9.
          NOTES
          gh release create "$TAG" "$RUNNER_TEMP/PokeSearch-v${PUBLIC_NAME}-LT.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$EXPECTED_SOURCE" \
            --title "PokeSearch 0.00.82 LT" --notes-file "$RUNNER_TEMP/notes.md" --latest
      - name: Verify GitHub Release metadata and asset digest
        shell: bash
        run: |
          set -euo pipefail
          ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')"
          test -n "$ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '.draft')" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '.prerelease')" = false
          APKNAME="PokeSearch-v${PUBLIC_NAME}-LT.apk"
          ASSET="$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --jq ".[] | select(.name==\"$APKNAME\") | .id")"
          test -n "$ASSET"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET" --jq '.state')" = uploaded
          DIGEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET" --jq '.digest')"
          SHA="$(cut -d' ' -f1 "$RUNNER_TEMP/PUBLISHED-SHA256SUMS.txt")"
          test "$DIGEST" = "sha256:$SHA"
          echo "Official update available for LT79 and LT80: $TAG / $APKNAME"
