name: LT77 - Exportar auditoria completa (sem APK)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/lt77-authorized-api-contract-20261024
    paths:
      - "docs/GUIA_MESTRE.md"
      - "docs/auditoria/LT77_AUDITORIA_CONSOLIDADA_20261024.md"
      - ".github/workflows/lt77-auditoria-export.yml"
permissions:
  contents: read
jobs:
  exportar-auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter commit exato da branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Node para validar todos os contratos
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exportar Guia Mestre integral e fontes da auditoria
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="PokeSearch_LT77_Auditoria_Completa"
          mkdir -p "$BUNDLE"
          test -s docs/GUIA_MESTRE.md
          test -s docs/auditoria/LT77_AUDITORIA_CONSOLIDADA_20261024.md
          grep -Fq 'LT77 — CONSOLIDAÇÃO FORMAL PARA AUDITORIA' docs/GUIA_MESTRE.md
          while IFS= read -r file; do
            test -f "$file"
            install -D -m 0644 "$file" "$BUNDLE/$file"
          done <<'FILES'
          docs/GUIA_MESTRE.md
          docs/auditoria/LT77_AUDITORIA_CONSOLIDADA_20261024.md
          app/src/main/assets/api_result_contract.js
          app/src/main/assets/api_reveal_contract.js
          app/src/main/assets/api_browser_transport.js
          app/tests/lt77-api-contract.test.js
          app/tests/lt77-api-reveal.test.js
          app/tests/lt77-api-browser-transport.test.js
          .github/workflows/lt77-authorized-api-contract-qa.yml
          .github/workflows/lt77-auditoria-export.yml
          FILES
          {
            echo "PokeSearch — exportacao integral do Guia Mestre para auditoria LT77"
            echo "repo=LucianoToscano/PokeSearch"
            echo "branch=$GITHUB_REF_NAME"
            echo "commit=$(git rev-parse HEAD)"
            echo "commit_data=$(git show -s --format=%cI HEAD)"
            echo "ci_previo_38_38=https://github.com/LucianoToscano/PokeSearch/actions/runs/40133524298"
            echo "lt76_publicada=0.00.76 versionCode=54276"
            echo "aviso=Este pacote nao homologa a API real nem o Samsung; nao inclui tokens ou APK."
          } > "$BUNDLE/ORIGEM_GIT.txt"
          {
            echo "POKESEARCH — AUDITORIA LT77 (24/10/2026)"
            echo "1. Leia docs/auditoria/LT77_AUDITORIA_CONSOLIDADA_20261024.md"
            echo "2. Confira docs/GUIA_MESTRE.md completo (historico preservado)"
            echo "3. Confira fontes, testes, workflow e hashes"
            echo "4. Verifique a integridade: sha256sum -c MANIFESTO_SHA256.txt"
            echo "5. A LT76 e a versao publicada; LT77 e experimental e sem APK."
            echo "6. Nao copie tokens JWT ou codigos de revelacao reais para os relatorios."
          } > "$BUNDLE/LEIA_PRIMEIRO.txt"
          wc -c docs/GUIA_MESTRE.md
          {
            node app/tests/lt77-api-contract.test.js
            node app/tests/lt77-api-reveal.test.js
            node app/tests/lt77-api-browser-transport.test.js
          } | tee "$BUNDLE/QA_LT77_TESTES.txt"
          grep -Fq "LT77 experimental API contract: 12/12 PASS" "$BUNDLE/QA_LT77_TESTES.txt"
          grep -Fq "LT77 experimental reveal contract: 12/12 PASS" "$BUNDLE/QA_LT77_TESTES.txt"
          grep -Fq "LT77 browser transport: 14/14 PASS" "$BUNDLE/QA_LT77_TESTES.txt"
          (
            cd "$BUNDLE"
            find . -type f ! -name 'MANIFESTO_SHA256.txt' -print0 | sort -z | xargs -0 sha256sum > MANIFESTO_SHA256.txt
            sha256sum --check --status MANIFESTO_SHA256.txt
          )
          test ! -f app/build/outputs/apk/release/app-release.apk
          echo "PACOTE AUDITORIA INTEGRAL OK; 38/38; SEM APK."
      - name: Disponibilizar arquivo completo para download
        uses: actions/upload-artifact@v4
        with:
          name: PokeSearch_LT77_Auditoria_Completa
          path: PokeSearch_LT77_Auditoria_Completa/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 9
