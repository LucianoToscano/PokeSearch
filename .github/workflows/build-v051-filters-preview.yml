name: PokeSearch v0.51 stable-signed test APK
on:
  push:
    branches:
      - plan/v051-pogocoordinates-filtros-20261017
      - ux/iv-color-shiny-separate-20261018
    paths:
      - 'app/**'
      - '.github/workflows/build-v051-filters-preview.yml'
  workflow_dispatch:
  # One-time, owner-approved APK build for PR 27. Retry after javac field-order fix. REMOVE after run.
  pull_request:
    types: [synchronize]
    branches:
      - fix/ux-icon-layout-overlay-20261018
    paths:
      - '.github/workflows/build-v051-filters-preview.yml'
permissions:
  contents: read
jobs:
  build:
    # Never expose signing material to unrelated PRs or forked pull requests.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.number == 27 && github.event.pull_request.head.ref == 'fix/ps009-stable-test-signing-20261018' && github.event.pull_request.head.repo.full_name == 'LucianoToscano/PokeSearch' && github.event.pull_request.base.ref == 'fix/ux-icon-layout-overlay-20261018') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Fail closed: no downloadable APK from an ephemeral debug key.
    env:
      POKE_TEST_SIGNING_REQUIRED: "true"
      POKE_TEST_STORE_PASSWORD: ${{ secrets.POKE_TEST_STORE_PASSWORD }}
      POKE_TEST_KEY_ALIAS: ${{ secrets.POKE_TEST_KEY_ALIAS }}
      POKE_TEST_KEY_PASSWORD: ${{ secrets.POKE_TEST_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore private persistent test keystore (required)
        shell: bash
        env:
          POKE_TEST_KEYSTORE_B64: ${{ secrets.POKE_TEST_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for value in "${POKE_TEST_KEYSTORE_B64:-}" "${POKE_TEST_STORE_PASSWORD:-}" "${POKE_TEST_KEY_ALIAS:-}" "${POKE_TEST_KEY_PASSWORD:-}"; do
            if [ -z "$value" ]; then
              echo "::error::Stable signing secrets are missing. Configure them under repository Actions secrets."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$POKE_TEST_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pokesearch-stable-test.p12"
          test -s "$RUNNER_TEMP/pokesearch-stable-test.p12"
          chmod 600 "$RUNNER_TEMP/pokesearch-stable-test.p12"
          keytool -list -keystore "$RUNNER_TEMP/pokesearch-stable-test.p12" \
            -storetype PKCS12 -storepass "$POKE_TEST_STORE_PASSWORD" \
            -alias "$POKE_TEST_KEY_ALIAS" > /dev/null
          echo "POKE_TEST_KEYSTORE=$RUNNER_TEMP/pokesearch-stable-test.p12" >> "$GITHUB_ENV"
          echo "POKE_TEST_VERSION_CODE=$((51000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Syntax and search tests
        run: |
          node --check app/src/main/assets/probe.js
          node app/tests/probe-smoke.test.js
          node app/tests/overlay-ux.test.js
          node app/tests/signing-contract.test.js
          python3 - <<'PY'
          from pathlib import Path
          t=Path('app/src/main/assets/dock.html').read_text()
          Path('/tmp/pokesearch-dock-preview.js').write_text(t.split('<script>')[1].split('</script>')[0])
          PY
          node --check /tmp/pokesearch-dock-preview.js
      - name: Build versioned stable-signed debug APK
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Verify package, signature, certificate and checksum
        shell: bash
        env:
          POKE_TEST_CERT_SHA256: ${{ vars.POKE_TEST_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          EXPECTED_CODE="${POKE_TEST_VERSION_CODE:?Missing signed test versionCode}"
          if [[ ! "$EXPECTED_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid signed test versionCode."
            exit 1
          fi
          PACKAGE_LINE="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep '^package: ')"
          for expected in \
            "name='com.lucianotoscano.pokesearch'" \
            "versionCode='${EXPECTED_CODE}'" \
            "versionName='0.51-beta.test.${EXPECTED_CODE}'"; do
            if ! grep -Fq -- "$expected" <<< "$PACKAGE_LINE"; then
              echo "::error::APK package/version mismatch: refusing to distribute."
              exit 1
            fi
          done
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signature-report.txt"
          if ! grep -Eq '^Verified using v2 scheme.*: true$' "$RUNNER_TEMP/signature-report.txt"; then
            echo "::error::APK Signature Scheme v2 is not verified as true."
            exit 1
          fi
          grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/signature-report.txt" | awk '{print $NF}' > SIGNING_CERT_SHA256.txt
          test -s SIGNING_CERT_SHA256.txt
          ACTUAL_CERT="$(tr -d ':\r\n ' < SIGNING_CERT_SHA256.txt | tr '[:upper:]' '[:lower:]')"
          if [ -n "${POKE_TEST_CERT_SHA256:-}" ]; then
            EXPECTED_CERT="$(printf '%s' "$POKE_TEST_CERT_SHA256" | tr -d ':\r\n ' | tr '[:upper:]' '[:lower:]')"
            if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
              echo "::error::Unexpected signing certificate; refusing to distribute an incompatible APK."
              exit 1
            fi
          fi
          cp "$APK" PokeSearch-v0.51-Teste-Atualizavel.apk
          sha256sum PokeSearch-v0.51-Teste-Atualizavel.apk > SHA256SUMS.txt
      - name: Publish only stable-signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: PokeSearch-v0.51-APK-TESTE-ATUALIZAVEL
          path: |
            PokeSearch-v0.51-Teste-Atualizavel.apk
            SHA256SUMS.txt
            SIGNING_CERT_SHA256.txt
          retention-days: 30
      - name: Remove restored keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pokesearch-stable-test.p12"
