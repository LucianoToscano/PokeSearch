name: PokeSearch v0.51 stable-signed test APK
on:
  push:
    branches:
      - plan/v051-pogocoordinates-filtros-20261017
      - ux/iv-color-shiny-separate-20261018
      - fix/ps009-stable-test-signing-20261018
      - feature/pokesearch-51081-visual-editor-20261021
    paths:
      - 'app/**'
      - '.github/workflows/build-v051-filters-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Isolated branch builds only after explicit owner approval or workflow_dispatch.
    if: "${{ github.event_name == 'workflow_dispatch' || github.ref_name != 'feature/pokesearch-51081-visual-editor-20261021' || startsWith(github.event.head_commit.message, 'build: approved icon colors') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Fail closed: no downloadable APK from an ephemeral debug key.
    env:
      POKE_TEST_SIGNING_REQUIRED: "true"
      POKE_TEST_STORE_PASSWORD: ${{ secrets.POKE_TEST_STORE_PASSWORD }}
      POKE_TEST_KEY_ALIAS: ${{ secrets.POKE_TEST_KEY_ALIAS }}
      POKE_TEST_KEY_PASSWORD: ${{ secrets.POKE_TEST_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore private persistent test keystore (required)
        shell: bash
        env:
          POKE_TEST_KEYSTORE_B64: ${{ secrets.POKE_TEST_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for value in "${POKE_TEST_KEYSTORE_B64:-}" "${POKE_TEST_STORE_PASSWORD:-}" "${POKE_TEST_KEY_ALIAS:-}" "${POKE_TEST_KEY_PASSWORD:-}"; do
            if [ -z "$value" ]; then
              echo "::error::Stable signing secrets are missing. Configure them under repository Actions secrets."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$POKE_TEST_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pokesearch-stable-test.p12"
          test -s "$RUNNER_TEMP/pokesearch-stable-test.p12"
          chmod 600 "$RUNNER_TEMP/pokesearch-stable-test.p12"
          keytool -list -keystore "$RUNNER_TEMP/pokesearch-stable-test.p12" \
            -storetype PKCS12 -storepass "$POKE_TEST_STORE_PASSWORD" \
            -alias "$POKE_TEST_KEY_ALIAS" > /dev/null
          echo "POKE_TEST_KEYSTORE=$RUNNER_TEMP/pokesearch-stable-test.p12" >> "$GITHUB_ENV"
          echo "POKE_TEST_VERSION_CODE=$((54000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "POKE_TEST_VERSION_LABEL=$((51000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Syntax and search tests
        run: |
          node --check app/src/main/assets/probe.js
          node app/tests/location-probe.test.js
          node app/tests/probe-smoke.test.js
          node app/tests/pokemon-picker.test.js
          node app/tests/login-entry.test.js
          node app/tests/overlay-ux.test.js
          node app/tests/visual-editor.test.js
          node app/tests/signing-contract.test.js
          node app/tests/coordsgo-preview.test.js
          python3 - <<'PY'
          from pathlib import Path
          t=Path('app/src/main/assets/dock.html').read_text()
          Path('/tmp/pokesearch-dock-preview.js').write_text(t.split('<script>')[1].split('</script>')[0])
          PY
          node --check /tmp/pokesearch-dock-preview.js
      - name: Build versioned stable-signed debug APK
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Verify package, signature, certificate and checksum
        shell: bash
        env:
          POKE_TEST_CERT_SHA256: ${{ vars.POKE_TEST_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          EXPECTED_CODE="${POKE_TEST_VERSION_CODE:?Missing signed test versionCode}"
          EXPECTED_LABEL="${POKE_TEST_VERSION_LABEL:?Missing signed test label}"
          if [[ ! "$EXPECTED_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid signed test versionCode."
            exit 1
          fi
          PACKAGE_LINE="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep '^package: ')"
          for expected in \
            "name='com.lucianotoscano.pokesearch'" \
            "versionCode='${EXPECTED_CODE}'" \
            "versionName='0.51-beta.test.${EXPECTED_LABEL}'"; do
            if ! grep -Fq -- "$expected" <<< "$PACKAGE_LINE"; then
              echo "::error::APK package/version mismatch: refusing to distribute."
              exit 1
            fi
          done
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signature-report.txt"
          if ! grep -Eq '^Verified using v2 scheme.*: true$' "$RUNNER_TEMP/signature-report.txt"; then
            echo "::error::APK Signature Scheme v2 is not verified as true."
            exit 1
          fi
          grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/signature-report.txt" | awk '{print $NF}' > SIGNING_CERT_SHA256.txt
          test -s SIGNING_CERT_SHA256.txt
          ACTUAL_CERT="$(tr -d ':\r\n ' < SIGNING_CERT_SHA256.txt | tr '[:upper:]' '[:lower:]')"
          if [ -n "${POKE_TEST_CERT_SHA256:-}" ]; then
            EXPECTED_CERT="$(printf '%s' "$POKE_TEST_CERT_SHA256" | tr -d ':\r\n ' | tr '[:upper:]' '[:lower:]')"
            if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
              echo "::error::Unexpected signing certificate; refusing to distribute an incompatible APK."
              exit 1
            fi
          fi
          cp "$APK" PokeSearch-v0.51-Teste-Atualizavel.apk
          sha256sum PokeSearch-v0.51-Teste-Atualizavel.apk > SHA256SUMS.txt
      - name: Publish only stable-signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: PokeSearch-v0.51-APK-TESTE-ATUALIZAVEL
          path: |
            PokeSearch-v0.51-Teste-Atualizavel.apk
            SHA256SUMS.txt
            SIGNING_CERT_SHA256.txt
          retention-days: 30
      - name: Package complete editable source and extracted APK (no secrets)
        shell: bash
        run: |
          set -euo pipefail
          test -s PokeSearch-v0.51-Teste-Atualizavel.apk
          mkdir -p "$RUNNER_TEMP/pokesearch-source" "$RUNNER_TEMP/pokesearch-unpacked" "$RUNNER_TEMP/pokesearch-package"
          # Every committed source, asset, image, script, document and config:
          git archive --format=zip --output="$RUNNER_TEMP/pokesearch-package/PokeSearch-Codigo-Fonte-Completo.zip" HEAD
          # Every byte-identifiable member from the signed APK, including DEX and resources:
          unzip -q PokeSearch-v0.51-Teste-Atualizavel.apk -d "$RUNNER_TEMP/pokesearch-unpacked"
          (cd "$RUNNER_TEMP/pokesearch-unpacked" && zip -q -r "$RUNNER_TEMP/pokesearch-package/PokeSearch-Conteudo-Extraido-APK.zip" .)
          cp PokeSearch-v0.51-Teste-Atualizavel.apk SHA256SUMS.txt SIGNING_CERT_SHA256.txt "$RUNNER_TEMP/pokesearch-package/"
          git rev-parse HEAD > "$RUNNER_TEMP/pokesearch-package/SOURCE_COMMIT.txt"
          git ls-tree -r --name-only HEAD > "$RUNNER_TEMP/pokesearch-package/LISTA-ARQUIVOS-FONTE.txt"
          (cd "$RUNNER_TEMP/pokesearch-unpacked" && find . -type f | sort) > "$RUNNER_TEMP/pokesearch-package/LISTA-ARQUIVOS-APK.txt"
          cat > "$RUNNER_TEMP/pokesearch-package/LEIA-ME-EDICAO.txt" <<'TXT'
          PokeSearch — pacote completo para inspecao e edicao
          1. PokeSearch-Codigo-Fonte-Completo.zip: todos os arquivos versionados do repositorio no commit de compilacao (Android Java, recursos, imagens, JS, testes, docs, Gradle, workflows).
          2. PokeSearch-Conteudo-Extraido-APK.zip: todos os arquivos internos do APK como distribuidos (inclui recursos binarios, DEX, manifest compilado, assinatura publica).
          3. PokeSearch-v0.51-Teste-Atualizavel.apk: APK assinado completo.
          4. SHA256SUMS.txt, SIGNING_CERT_SHA256.txt, SOURCE_COMMIT.txt e listas dos arquivos.
          PARA EDITAR E RECOMPILAR: use o ZIP de codigo-fonte com Android Studio/JDK 17/Gradle e Android SDK.
          Arquivos .dex / resource.arsc / AndroidManifest.xml no ZIP do APK sao formatos compilados e nao substituem o codigo-fonte editavel.
          Arquivos de assinatura privada, passwords, tokens, caches temporarios do runner e diretorio .git nao fazem parte deste pacote.
          Uma compilacao modificada exige sua propria chave ou o processo seguro de assinatura persistente do projeto.
          TXT
          (cd "$RUNNER_TEMP/pokesearch-package" && sha256sum PokeSearch-Codigo-Fonte-Completo.zip PokeSearch-Conteudo-Extraido-APK.zip >> SHA256SUMS-PACOTE.txt)
          (cd "$RUNNER_TEMP/pokesearch-package" && zip -q -r "$GITHUB_WORKSPACE/PokeSearch-Pacote-Completo-Edicao.zip" .)
          unzip -t PokeSearch-Pacote-Completo-Edicao.zip >/dev/null
      - name: Publish complete source and APK-analysis package
        uses: actions/upload-artifact@v4
        with:
          name: PokeSearch-PACOTE-COMPLETO-EDICAO
          path: PokeSearch-Pacote-Completo-Edicao.zip
          retention-days: 30
      - name: Remove restored keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pokesearch-stable-test.p12"
