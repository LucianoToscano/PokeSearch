name: LT189 — QA assinado para corrigir API invalid-request P1 P2
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/assets/api_result_contract.js'
      - 'app/tests/lt189-api-default-schema.test.js'
      - '.github/workflows/lt189-api-invalid-request-signed-qa.yml'
permissions:
  contents: read
concurrency:
  group: lt189-dual-api-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  signed-lt189-candidate:
    if: github.repository == 'LucianoToscano/PokeSearch' && github.event.pull_request.head.repo.full_name == 'LucianoToscano/PokeSearch'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      POKE_TEST_VERSION_CODE: '54394'
      POKE_TEST_VERSION_LABEL: '51194'
      POKE_TEST_PUBLIC_VERSION: '0.01.89'
      POKE_RELEASE_CERT_SHA256: '34766c15d09013ad65873f9976539c8fa2f826e917dae3af57ea628cad689e8e'
      POKE_CONTROLLED_DISTRIBUTION: 'true'
      POKE_RELEASE_STORE_PASSWORD: ${{ secrets.POKE_TEST_STORE_PASSWORD }}
      POKE_RELEASE_KEY_ALIAS: ${{ secrets.POKE_TEST_KEY_ALIAS }}
      POKE_RELEASE_KEY_PASSWORD: ${{ secrets.POKE_TEST_KEY_PASSWORD }}
      POKE_GOOGLE_WEB_CLIENT_ID: ${{ vars.POKE_GOOGLE_WEB_CLIENT_ID }}
      POKE_CHAT_GOOGLE_WEB_CLIENT_ID: '1007816617051-abhc4riftns3om8gs0o67ce1s386ue9d.apps.googleusercontent.com'
      POKE_SCRAPBOOK_STAGE1_QA: 'false'
      POKE_SCRAPBOOK_ONLINE_QA: 'false'
    steps:
      - name: Read exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Check updated API schema and previous test suites
        run: |
          set -euo pipefail
          node app/tests/lt189-api-default-schema.test.js
          node app/tests/lt188-dual-mode-filters.test.js
          node app/tests/lt77-api-browser-transport.test.js
          node app/tests/lt77-api-contract.test.js
          for test in app/tests/*.test.js; do
            [ "$test" = 'app/tests/lt74-local-update-preview.test.js' ] && continue
            node "$test" > /dev/null || { echo "::error::Failed $test"; node "$test"; exit 1; }
          done
          python3 scripts/test_ota_builder.py
      - name: Install Android SDK and validate permanent signer
        shell: bash
        env:
          POKE_TEST_KEYSTORE_B64: ${{ secrets.POKE_TEST_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          for k in POKE_TEST_KEYSTORE_B64 POKE_RELEASE_STORE_PASSWORD POKE_RELEASE_KEY_ALIAS POKE_RELEASE_KEY_PASSWORD; do
            test -n "$(printenv "$k")" || { echo "::error::Missing signing environment"; exit 1; }
          done
          umask 077
          printf '%s' "$POKE_TEST_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lt189-qa.p12"
          chmod 600 "$RUNNER_TEMP/lt189-qa.p12"
          echo "POKE_RELEASE_KEYSTORE=$RUNNER_TEMP/lt189-qa.p12" >> "$GITHUB_ENV"
          CERT="$(keytool -exportcert -rfc -keystore "$RUNNER_TEMP/lt189-qa.p12" -storetype PKCS12 -storepass "$POKE_RELEASE_STORE_PASSWORD" -alias "$POKE_RELEASE_KEY_ALIAS" | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':\r' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$POKE_RELEASE_CERT_SHA256"
      - name: Build exact offline sprite metadata and full signed R8 QA APK
        shell: bash
        run: |
          set -euo pipefail
          python3 app/scripts/build_pokemon_card_metadata.py
          python3 app/scripts/update_wwm_catalog.py app/src/main/assets
          python3 app/scripts/build_sprite_bundle.py --workers 12 --minimum-normal 950
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Verify package, version, SHA, signature and audit trail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > qa/PACKAGE-VERSION.txt
          grep -Fq "name='com.lucianotoscano.pokesearch'" qa/PACKAGE-VERSION.txt
          grep -Fq "versionCode='54394'" qa/PACKAGE-VERSION.txt
          grep -Fq "versionName='0.01.89'" qa/PACKAGE-VERSION.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > qa/SIGNING-REPORT.txt
          grep -Eq '^Verified using v2 scheme.*: true$' qa/SIGNING-REPORT.txt
          CERT="$(grep 'Signer #1 certificate SHA-256 digest:' qa/SIGNING-REPORT.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$POKE_RELEASE_CERT_SHA256"
          cp "$APK" qa/PokeSearch-LT189-API-P1-P2-QA-Assinado.apk
          git rev-parse HEAD > qa/SOURCE_COMMIT.txt
          (cd qa && sha256sum PokeSearch-LT189-API-P1-P2-QA-Assinado.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          printf '%s\n' 'CANDIDATO QA, NAO RELEASE PUBLICA, NAO HOMOLOGADO EM SAMSUNG' > qa/LEIA-ANTES-DE-INSTALAR.txt
          stat -c '%n: %s bytes' qa/PokeSearch-LT189-API-P1-P2-QA-Assinado.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PokeSearch-LT189-54394-API-P1-P2-QA-Assinado
          path: qa/
          if-no-files-found: error
          retention-days: 30
      - name: Erase signing key from temporary CI
        if: always()
        run: rm -f "$RUNNER_TEMP/lt189-qa.p12"
