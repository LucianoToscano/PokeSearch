name: PokeSearch FastDev - smoke, visual, isolated APK Preview
on:
  # Only an explicit request on main may start a signed APK Preview.
  # Ordinary development edits use pokesearch-fastdev-branch.yml instead.
  push:
    branches: [main]
    paths:
      - 'fastdev/preview-request.json'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/fastdev.cjs'
      - 'scripts/fastdev.test.cjs'
      - 'scripts/fastdev-audit.cjs'
      - 'scripts/fastdev-request.cjs'
      - 'scripts/fastdev-request.test.cjs'
      - 'scripts/fastdev-version.test.cjs'
      - 'scripts/fastdev-adb.sh'
      - 'scripts/fastdev-signing-setup.sh'
      - 'scripts/fastdev-signing-preflight.sh'
      - 'scripts/fastdev-signing-preflight.test.cjs'
      - 'fastdev/preview-request.json'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/pokesearch-fastdev.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'FastDev operation (preview is NOT an official update)'
        type: choice
        required: true
        default: fast
        options: [fast, visual, java-check, apk-preview]
permissions:
  contents: read
concurrency:
  group: fastdev-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'fast' }}
  cancel-in-progress: true

jobs:
  quick:
    name: FastDev advisory smoke (no APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      selected_mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - name: Exact source checkout with diff history
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate FastDev selector
        run: |
          node --check scripts/fastdev.cjs
          node --check scripts/fastdev-audit.cjs
          node --test scripts/fastdev.test.cjs
          node --test scripts/fastdev-branch-contract.test.cjs
          node --check scripts/fastdev-request.cjs
          node --test scripts/fastdev-request.test.cjs
          node --test scripts/fastdev-version.test.cjs
          bash -n scripts/fastdev-signing-preflight.sh
          node --test scripts/fastdev-signing-preflight.test.cjs
      - name: Select a validated on-demand request without release signing
        id: select-mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            MODE="$(node scripts/fastdev-request.cjs fastdev/preview-request.json)"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            MODE="$DISPATCH_MODE"
          else
            MODE="fast"
          fi
          case "$MODE" in fast|visual|java-check|apk-preview) ;; *) echo "Invalid mode" >&2; exit 1 ;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Selected opt-in FastDev mode: $MODE"
      - name: Inventory historical workflows without deleting them
        run: node scripts/fastdev-audit.cjs
      - name: Run only affected smoke contracts (full QA remains mandatory)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/fastdev.cjs --base "${{ github.event.pull_request.base.sha }}"
          else
            node scripts/fastdev.cjs --base origin/main
          fi

  java-check:
    name: Android Java compile on demand (no APK)
    if: needs.quick.outputs.selected_mode == 'java-check' && github.event_name != 'pull_request'
    needs: quick
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 36 only for explicit Java checks
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile native sources without packaging or signing APK
        shell: bash
        env:
          POKE_TEST_SIGNING_REQUIRED: 'false'
        run: |
          set -euo pipefail
          gradle --no-daemon --build-cache :app:compileDebugJavaWithJavac --stacktrace
          if find app/build/outputs -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Java check must never package an APK"
            exit 1
          fi
          echo "Native Android compile passed, no APK was produced."

  visual:
    name: Real HTML screenshots (not physical Android)
    if: needs.quick.outputs.selected_mode == 'visual'
    needs: quick
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned visual runner
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Screenshot actual PokeSearch detail.html at P/M/G
        env:
          LT253_VISUAL_OUTPUT: fastdev-visual-evidence
        run: node app/tests/lt253-visual-screenshots.cjs
      - name: Preserve visual images even on assertion failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PokeSearch-FastDev-Visual-${{ github.run_id }}
          path: fastdev-visual-evidence/*.png
          retention-days: 10
          if-no-files-found: warn

  apk-preview:
    name: Isolated permanently signed APK (never an official release)
    # Publish only from trusted main, never PR/fork or arbitrary branch.
    if: needs.quick.outputs.selected_mode == 'apk-preview' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quick
    permissions:
      contents: write
    environment: fastdev-signing
    runs-on: ${{ vars.POKE_FASTDEV_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      POKE_FASTDEV_STORE_PASSWORD: ${{ secrets.POKE_FASTDEV_STORE_PASSWORD }}
      POKE_FASTDEV_KEY_ALIAS: ${{ secrets.POKE_FASTDEV_KEY_ALIAS }}
      POKE_FASTDEV_KEY_PASSWORD: ${{ secrets.POKE_FASTDEV_KEY_PASSWORD }}
      POKE_FASTDEV_SIGNING_REQUIRED: 'true'
      EXPECTED_FASTDEV_CERT: ${{ vars.POKE_FASTDEV_CERT_SHA256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate dedicated signing configuration before SDK setup
        shell: bash
        env:
          FASTDEV_KEYSTORE_B64: ${{ secrets.POKE_FASTDEV_KEYSTORE_B64 }}
        run: bash scripts/fastdev-signing-preflight.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 36 (no protected signing keys)
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore permanent preview signer and monotonic Android version
        shell: bash
        env:
          FASTDEV_KEYSTORE_B64: ${{ secrets.POKE_FASTDEV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$FASTDEV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fastdev-release.p12"
          chmod 600 "$RUNNER_TEMP/fastdev-release.p12"
          echo "POKE_FASTDEV_KEYSTORE=$RUNNER_TEMP/fastdev-release.p12" >> "$GITHUB_ENV"
          code=$((1000000 + GITHUB_RUN_NUMBER))
          echo "POKE_FASTDEV_VERSION_CODE=$code" >> "$GITHUB_ENV"
          cert="$(keytool -exportcert -rfc -keystore "$RUNNER_TEMP/fastdev-release.p12" -storetype PKCS12 -storepass "$POKE_FASTDEV_STORE_PASSWORD" -alias "$POKE_FASTDEV_KEY_ALIAS" | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':\r' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "$EXPECTED_FASTDEV_CERT" || { echo "::error::FastDev signer changed unexpectedly"; exit 1; }
          echo "FASTDEV_CERT=$cert" >> "$GITHUB_ENV"
      - name: Build signed FastDev Preview (no R8)
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          gradle --no-daemon --build-cache :app:assemblePreview --stacktrace
          echo "Preview compilation: $((SECONDS-start)) seconds" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify isolated package, permanent certificate and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fastdev-apk
          APK=app/build/outputs/apk/preview/app-preview.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.lucianotoscano.pokesearch.preview' versionCode='$POKE_FASTDEV_VERSION_CODE'"
          "$SIGNER" verify --verbose --print-certs "$APK" | tee fastdev-apk/SIGNING-REPORT.txt
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' fastdev-apk/SIGNING-REPORT.txt | tr -d '\r' | head -1)"
          test -n "$CERT"
          test "$CERT" = "$FASTDEV_CERT"
          test "$CERT" != "34766c15d09013ad65873f9976539c8fa2f826e917dae3af57ea628cad689e8e"
          cp "$APK" fastdev-apk/PokeSearch-FastDev-Preview.apk
          (cd fastdev-apk && sha256sum PokeSearch-FastDev-Preview.apk > SHA256SUMS.txt)
          git rev-parse HEAD > fastdev-apk/SOURCE_COMMIT.txt
          printf '%s\n' 'FASTDEV STABLE-SIGNED PREVIEW: no R8; separate from public PokeSearch official OTA.' > fastdev-apk/README.txt
          cat fastdev-apk/SHA256SUMS.txt
      - name: Upload APK for manual phone testing, without publishing
        uses: actions/upload-artifact@v4
        with:
          name: PokeSearch-FastDev-APK-Preview-${{ github.run_id }}
          path: fastdev-apk/
          retention-days: 10
          if-no-files-found: error
      - name: Publish signed FastDev prerelease for the Preview updater
        shell: bash
        env:
          APK_TAG: fastdev-${{ env.POKE_FASTDEV_VERSION_CODE }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "LucianoToscano/PokeSearch"
          ! gh release view "$APK_TAG" >/dev/null 2>&1
          gh release create "$APK_TAG" fastdev-apk/PokeSearch-FastDev-Preview.apk \
            --prerelease --target "$GITHUB_SHA" --title "FastDev $POKE_FASTDEV_VERSION_CODE (somente testes)" \
            --notes "Preview assinado, pacote separado e atualização opcional. SHA source: $GITHUB_SHA. Não é a release oficial."
          gh release view "$APK_TAG" --json isPrerelease,isDraft,tagName,assets \
            --jq '{prerelease:.isPrerelease,draft:.isDraft,tag:.tagName,assets:[.assets[].name]}'
      - name: Wipe restored key material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/fastdev-release.p12"
