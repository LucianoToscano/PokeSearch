# LT169: combined GO sprite audit, Home privacy and linked trainer switcher.
name: PokeSearch LT169 — assinatura permanente e distribuição oficial no aplicativo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lt169-combined-official-release.yml']
permissions:
  contents: write
concurrency:
  group: pokesearch-lt169-official-once
  cancel-in-progress: false
jobs:
  signed-chat-backup-official-lt168:
    if: github.repository == 'LucianoToscano/PokeSearch'
    runs-on: ubuntu-24.04
    environment:
      name: official-updates
    timeout-minutes: 65
    env:
      POKE_TEST_VERSION_CODE: '54374'
      POKE_TEST_VERSION_LABEL: '51174'
      POKE_TEST_PUBLIC_VERSION: '0.01.69'
      POKE_RELEASE_CERT_SHA256: '34766c15d09013ad65873f9976539c8fa2f826e917dae3af57ea628cad689e8e'
      # Firebase LT Web OAuth ID supplied through GitHub Actions repository variables.
      POKE_GOOGLE_WEB_CLIENT_ID: ${{ vars.POKE_GOOGLE_WEB_CLIENT_ID }}
      # Premium access remains server-controlled; new-user trials default OFF until owner chooses days.
      POKE_CONTROLLED_DISTRIBUTION: 'true'
      POKE_RELEASE_STORE_PASSWORD: ${{ secrets.POKE_TEST_STORE_PASSWORD }}
      POKE_RELEASE_KEY_ALIAS: ${{ secrets.POKE_TEST_KEY_ALIAS }}
      POKE_RELEASE_KEY_PASSWORD: ${{ secrets.POKE_TEST_KEY_PASSWORD }}
      # Identical existing LT104 opt-in QA visibility, not new scrapbook actions.
      POKE_SCRAPBOOK_STAGE1_QA: 'true'
      POKE_SCRAPBOOK_QA_ACK: 'stage1-readonly'
      POKE_SCRAPBOOK_ONLINE_QA: 'true'
      POKE_SCRAPBOOK_ONLINE_ACK: 'read-only-moderation-pending'
      GH_TOKEN: ${{ github.token }}
      # PUBLIC OAuth Web client ID from the user's refreshed Firebase Android configuration.
      # This is NOT a private key, Firebase Admin SDK, or service-account credential.
      POKE_CHAT_GOOGLE_WEB_CLIENT_ID: '1007816617051-abhc4riftns3om8gs0o67ce1s386ue9d.apps.googleusercontent.com'
      QA_APK: PokeSearch-v0.01.69-LT-QA.apk
      OFFICIAL_TAG: v0.01.69-54374
      OFFICIAL_APK: PokeSearch-v0.01.69-LT.apk
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore permanent keystore
        env:
          POKE_TEST_KEYSTORE_B64: ${{ secrets.POKE_TEST_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          for key in POKE_TEST_KEYSTORE_B64 POKE_RELEASE_STORE_PASSWORD POKE_RELEASE_KEY_ALIAS POKE_RELEASE_KEY_PASSWORD; do
            test -n "$(printenv "$key")" || { echo "::error::Missing protected signing secret"; exit 1; }
          done
          umask 077
          printf '%s' "$POKE_TEST_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pokesearch-lt112-signing.p12"
          chmod 600 "$RUNNER_TEMP/pokesearch-lt112-signing.p12"
          keytool -list -keystore "$RUNNER_TEMP/pokesearch-lt112-signing.p12" -storetype PKCS12 -storepass "$POKE_RELEASE_STORE_PASSWORD" -alias "$POKE_RELEASE_KEY_ALIAS" >/dev/null
          echo "POKE_RELEASE_KEYSTORE=$RUNNER_TEMP/pokesearch-lt112-signing.p12" >> "$GITHUB_ENV"
      - name: Verify LT148 source, Google checkout and release notes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor '6747e5ae1433f1d7f686600d5ede3a38cc7c191e' HEAD
          node app/tests/lt148-detail-no-phantom-scroll.test.js
          node app/tests/lt148-pvp-analysis-rank-label-stat-centering.test.js
          node app/tests/lt153-pvp-clarity-layout.test.js
          node app/tests/lt160-hide-empty-pvp-center-coords.test.js
          node app/tests/lt161-shellos-gastrodon-west-sea-sprites.test.js
          node app/tests/lt162-cosmetic-pvp-and-source-sprites.test.js
          node app/tests/lt163-search-league-rank-in-collapsed-card.test.js
          node app/tests/lt164-gl-top5-noibat-evolution-rank.test.js
          node app/tests/lt165-pvp-costume-evolution-references.test.js
          node app/tests/lt129-capture-share-reactions.test.js
          node app/tests/lt131-capture-sprites-ivs.test.js
          node app/tests/lt132-capture-badges-nested-scroll.test.js
          node app/tests/lt167-chat-capture-uid-avatar-icons.test.js
          node app/tests/lt168-legacy-chat-identity-icon-matte.test.js
          node app/tests/lt168-home-data-import.test.js
          node app/tests/lt169-all-go-sprites-api-dom-parity.test.js
          node app/tests/lt169-home-identity-privacy.test.js
          node app/tests/lt169-trainer-profiles-visibility.test.js
          node app/tests/lt159-iv-decimal-and-three-line-pvp.test.js
          node app/tests/iv-percent-palette-card.test.js
          node app/tests/lt156-overall-rank-without-iv.test.js
          node - <<'NODE'
          const fs=require('fs'),html=fs.readFileSync('app/src/main/assets/detail.html','utf8');
          if(html.includes('Análise PvP · Sem dados')||html.includes('Ranking indisponível para esta forma.')||
             !html.includes('#coordRow #coords.hasCoords{padding-left:36px;padding-right:36px;box-sizing:border-box;text-align:center}')||
             html.includes('<b>Eficiência IV:</b>')||html.includes('<b>Produto:</b>')||
             !html.includes('evoStatsRow')||!html.includes('var(--ps-rank-percent-color')||
             !html.includes('class="evoPct"')||!html.includes('evoRankRow')||
             !html.includes('Rank Classe: ')||html.includes('evoHint'))
            throw Error('Correct user-visible PvP label is required');
          NODE
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('app/src/main/assets/detail.html','utf8');
          if(h.includes('Rank do site #'))throw Error('Unverified site rank is still visible');
          if(!h.includes('league.toUpperCase()+" · Rank Classe: #"+ivValue'))throw Error('Verified IV rank label missing');
          NODE
          node app/tests/lt147-premium-checkout-clarity.test.js
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('app/src/main/assets/release_notes.json','utf8'));
          const latest=d.releases.filter(r=>r.minVersionCode===54374);
          if(latest.length!==1||!latest[0].title.includes('LT169'))throw Error('Missing LT169 release notes');
          NODE
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('app/src/main/assets/release_notes.json','utf8'));
          const rows=d.releases.filter(r=>r.minVersionCode===54353);
          if(rows.length!==1||!rows[0].title.includes('LT148'))throw Error('Missing LT148 release notes');
          NODE
          if gh release view "$OFFICIAL_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::LT169 release already exists; never overwrite an existing signed APK."
            exit 1
          fi
          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          test "$LATEST" = 'v0.01.68-54373' || { echo "::error::Latest official version changed: $LATEST"; exit 1; }
      - name: Validate OAuth Web client and permanent Firebase Android SHA-1
        shell: bash
        run: |
          set -euo pipefail
          [[ "$POKE_GOOGLE_WEB_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]] ||
            { echo "::error::Invalid Google Web OAuth client ID"; exit 1; }
          CERT_SHA1="$(keytool -exportcert -rfc -keystore "$POKE_RELEASE_KEYSTORE" -storetype PKCS12 -storepass "$POKE_RELEASE_STORE_PASSWORD" -alias "$POKE_RELEASE_KEY_ALIAS" | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':\r' | tr '[:upper:]' '[:lower:]')"
          test "$CERT_SHA1" = "dd7bf665e1d47a257fc557b51cb5a57dfd13cb96" ||
            { echo "::error::Signing SHA-1 differs from Firebase Android OAuth registration"; exit 1; }
          echo "Permanent APK signing matches Firebase LT; OAuth configured."
      - name: Validate all code and QA tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile app/scripts/build_sprite_bundle.py app/scripts/fetch_form_sprites.py app/scripts/fetch_all_verified_varieties.py app/scripts/build_pokemon_card_metadata.py
          python3 app/scripts/build_pokemon_card_metadata.py
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),src=fs.readFileSync('app/src/main/assets/pokemon_type_icons.js','utf8');
          const ctx={};vm.runInNewContext(src,ctx);const icons=ctx.PokeSearchTypeIcons;
          if(Object.keys(icons).length!==18||Object.values(icons).some(src=>!src.startsWith('data:image/png;base64,iVBORw0KGgo')))
           throw Error('Drive Pokémon type icons not packaged');
          NODE
          node --check functions/index.js
          node --check functions/scripts/reconcile-once.js
          node -e "const c=require('./firebase.json');if(c.database[0].target!=='live')throw Error('RTDB target missing')"
          for js in probe.js sprite_offline.js coords_quota.js pokemon_type_icons.js pokemon_card_metadata.js pokemon_card_presentation.js api_result_contract.js api_browser_transport.js api_android_session.js api_catalog_cache.js api_integration_router.js; do
            node --check "app/src/main/assets/$js"
          done
          for suite in app/tests/*.test.js; do
            if [ "$suite" = "app/tests/lt74-local-update-preview.test.js" ]; then
              echo "::notice::Deprecated LT74 debug preview intentionally excluded, same as LT104"
              continue
            fi
            echo "::group::$suite"
            node "$suite"
            echo "::endgroup::"
          done
          mkdir -p "$RUNNER_TEMP/qa"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/qa" \
            app/src/main/java/com/lucianotoscano/pokesearchoverlay/EncounterAlertText.java \
            app/tests/EncounterAlertTextTest.java
          java -cp "$RUNNER_TEMP/qa" com.lucianotoscano.pokesearchoverlay.EncounterAlertTextTest
          javac -encoding UTF-8 -d "$RUNNER_TEMP/qa" app/src/main/java/com/lucianotoscano/pokesearchoverlay/SupportMissionPolicy.java app/src/main/java/com/lucianotoscano/pokesearchoverlay/UpdatePolicy.java app/src/main/java/com/lucianotoscano/pokesearchoverlay/PopupTouchGeometry.java app/tests/SupportMissionPolicyTest.java app/tests/UpdatePolicyTest.java app/tests/PopupTouchGeometryTest.java
          java -cp "$RUNNER_TEMP/qa" com.lucianotoscano.pokesearchoverlay.SupportMissionPolicyTest
          java -cp "$RUNNER_TEMP/qa" com.lucianotoscano.pokesearchoverlay.UpdatePolicyTest
          java -cp "$RUNNER_TEMP/qa" com.lucianotoscano.pokesearchoverlay.PopupTouchGeometryTest
          javac -encoding UTF-8 -d "$RUNNER_TEMP/qa" app/src/main/java/com/lucianotoscano/pokesearchoverlay/VersionNames.java app/tests/VersionNamesTest.java
          java -cp "$RUNNER_TEMP/qa" com.lucianotoscano.pokesearchoverlay.VersionNamesTest
          javac -encoding UTF-8 -d "$RUNNER_TEMP/qa" \
            app/src/main/java/com/lucianotoscano/pokesearchoverlay/LocalBridgePagePolicy.java \
            app/src/main/java/com/lucianotoscano/pokesearchoverlay/PresenceWindowState.java \
            app/tests/LocalBridgePagePolicyTest.java
          java -cp "$RUNNER_TEMP/qa" com.lucianotoscano.pokesearchoverlay.LocalBridgePagePolicyTest
      - name: Build immutable GO form and costume metadata for offline use
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile app/scripts/update_wwm_catalog.py
          python3 app/scripts/update_wwm_catalog.py app/src/main/assets
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('app/src/main/assets/wwm_catalog_provenance.json')
          d=json.loads(p.read_text())
          assert d['pokemon']==1025 and d['forms']>=1400 and d['costumes']>=80
          assert d['revision']=='42b315f317ca8cee8e178249328eab5173e5ca70'
          assert Path('app/src/main/assets/wwm_catalog.js').stat().st_size>100000
          PY
      - name: Package verified offline normal and shiny sprites into Android assets
        shell: bash
        run: |
          set -euo pipefail
          python3 app/scripts/build_sprite_bundle.py --workers 12 --minimum-normal 950
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('app/src/main/assets/pokemon-sprites')
          report=json.loads((root / 'manifest.json').read_text())
          assert report['dexCount']==1025
          assert report['baseCount']>=950
          assert report['shinyCount']>=500
          assert len(report['sha256'])==report['baseCount']+report['shinyCount']
          expected={'forms/zigzagoon-galar.png','forms/zigzagoon-galar-shiny.png'}
          assert expected.issubset(set(report['forms']))
          assert len(report['forms'])==720  # 716 retained + 4 exact Autumn GO forms
          assert len([x for x in report['forms'] if x.startswith('forms/variety-')])==634
          assert 'forms/variety-10262-shiny.png' in report['forms']
          assert 'forms/144-galar.png' in report['forms']
          assert 'forms/555-galar-zen-shiny.png' in report['forms']
          assert 'forms/585-spring.png' in report['forms']
          for dex in (585,586):
              for variant in ('','-shiny'):
                  name=f'forms/{dex}-autumn{variant}.png'
                  assert name in report['forms'],name
                  import hashlib
                  assert hashlib.sha256((root/name).read_bytes()).hexdigest()==report['forms'][name]
          assert report['formSourceCommit']=='d8c2fb78563e28ad7b3abe938cf6e79998d04e90'
          assert len(report['costumes'])==106  # 102 legacy + 4 SHA256-verified Zubat 2026 / Gengar 2023
          for file in ("pm37.cFALL_2022.icon.png",
                       "pm37.cFALL_2022.s.icon.png",
                       "pm714.cHALLOWEEN_2025.icon.png",
                       "pm714.cHALLOWEEN_2025.s.icon.png",
                       "pm710.fAVERAGE.cFALL_2022.icon.png"):
              assert "costumes/"+file in report['costumes'], file
          for dex in (25,393,426):
              for suffix in ('','-shiny'):
                  key=f'costumes/{dex}-halloween-2021{suffix}.png'
                  assert key in report['costumes'],key
          assert report['costumeSourceCommit']=='c2a686eb08ace6e890d8fe3d2134c76988db87b5'
          assert all((root / key).is_file() for key in report['costumes'])
          print('Exact GO costume PNGs:', sorted(report['costumes']))
          print('Bundled offline sprite coverage:',report['baseCount'],'base,',report['shinyCount'],'shiny', 'regional:', sorted(expected))
          PY
      - name: Check whether mode PNG artwork includes opaque dark corners
        shell: bash
        run: |
          set -euo pipefail
          for f in app/src/main/assets/result-icons/modes/3Star.png app/src/main/assets/result-icons/modes/StarGL.png; do
            test -f "$f" || { echo "::error::Missing official mode icon $f"; exit 1; }
            file "$f"
            if command -v identify >/dev/null 2>&1; then
              identify -format 'Mode icon %f: %wx%h channels=%[channels] corner=%[pixel:p{0,0}]\\n' "$f" || true
            fi
          done
      - name: Compile protected and signed LT169 official candidate APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Audit APK certificate, R8, build version and offline manifest
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          test -s app/build/outputs/mapping/release/mapping.txt
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/base/25.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/go-exact-sprites.tsv'
          unzip -Z1 "$APK" | grep -Fq 'res/drawable/ps_trainer_switch'

          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/base/94.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/shiny/94.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/forms/variety-10038.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/costumes/pm94.fCOSTUME_2020.icon.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/costumes/pm41.fHALLOWEEN_2026_01.icon.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/costumes/pm41.fHALLOWEEN_2026_01.s.icon.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/costumes/pm94.cFALL_2023_NOEVOLVE.icon.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/costumes/pm94.cFALL_2023_NOEVOLVE.s.icon.png'

          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/shiny/25.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/manifest.json'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/forms/zigzagoon-galar.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/forms/zigzagoon-galar-shiny.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/forms/144-galar.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/forms/555-galar-zen-shiny.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/forms/585-spring.png'
          for dex in 585 586; do
            unzip -Z1 "$APK" | grep -Fq "assets/pokemon-sprites/forms/${dex}-autumn.png"
            unzip -Z1 "$APK" | grep -Fq "assets/pokemon-sprites/forms/${dex}-autumn-shiny.png"
          done
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/forms/variety-10262-shiny.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/costumes/pm37.cFALL_2022.icon.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/costumes/pm714.cHALLOWEEN_2025.s.icon.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/costumes/4-goggles-2026.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/costumes/4-goggles-2026-shiny.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/costumes/3-copy-2019.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/costumes/6-copy-2019.png'
          unzip -Z1 "$APK" | grep -Fq 'assets/pokemon-sprites/costumes/9-copy-2019.png'
          for dex in 25 393 426; do
            unzip -Z1 "$APK" | grep -Fq "assets/pokemon-sprites/costumes/${dex}-halloween-2021.png"
            unzip -Z1 "$APK" | grep -Fq "assets/pokemon-sprites/costumes/${dex}-halloween-2021-shiny.png"
          done
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > PACKAGE-VERSION.txt
          grep -Fq "name='com.lucianotoscano.pokesearch'" PACKAGE-VERSION.txt
          grep -Fq "versionCode='54374'" PACKAGE-VERSION.txt
          grep -Fq "versionName='0.01.69'" PACKAGE-VERSION.txt
          ! grep -q '^application-debuggable' PACKAGE-VERSION.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > SIGNING-REPORT.txt
          grep -Eq '^Verified using v2 scheme.*: true$' SIGNING-REPORT.txt
          ACTUAL="$(grep 'Signer #1 certificate SHA-256 digest:' SIGNING-REPORT.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$POKE_RELEASE_CERT_SHA256"
          cp "$APK" "$QA_APK"
          sha256sum "$QA_APK" > SHA256SUMS.txt
          git rev-parse HEAD > SOURCE_COMMIT.txt
          cp app/src/main/assets/pokemon-sprites/manifest.json SPRITE-MANIFEST.json
      - name: Verify that the exact signed APK will be included in the artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f "$QA_APK"
          apk_size="$(stat -c%s "$QA_APK")"
          if [ "$apk_size" -lt 30000000 ]; then
            echo "::error::APK missing or unexpectedly small: $apk_size bytes"
            exit 1
          fi
          sha256sum --check SHA256SUMS.txt
          unzip -t "$QA_APK" >/dev/null
          test -f SOURCE_COMMIT.txt
          test -f SIGNING-REPORT.txt
          echo "Delivery QA APK ready: $QA_APK ($apk_size bytes)"
      - name: Upload verified signed APK build evidence
        uses: actions/upload-artifact@v4
        with:
          name: PokeSearch-LT169-54374-Oficial-Assinado
          path: |
            ${{ env.QA_APK }}
            SHA256SUMS.txt
            SIGNING-REPORT.txt
            SOURCE_COMMIT.txt
            PACKAGE-VERSION.txt
            SPRITE-MANIFEST.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish LT169 as official stable GitHub Release for installed app users
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\\r\\n' < SOURCE_COMMIT.txt)" = "$GITHUB_SHA"
          gh release view "$OFFICIAL_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && {
            echo "::error::Existing LT169 release must not be overwritten"; exit 1;
          }
          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          test "$LATEST" = 'v0.01.68-54373' || {
            echo "::error::Newer official release detected; abort promotion"; exit 1;
          }
          sha256sum --check SHA256SUMS.txt
          cp "$QA_APK" "$OFFICIAL_APK"
          test "$(stat -c%s "$OFFICIAL_APK")" -gt 30000000
          SHA="$(sha256sum "$QA_APK" | cut -d ' ' -f1)"
          test "$(sha256sum "$OFFICIAL_APK" | cut -d ' ' -f1)" = "$SHA"
          unzip -t "$OFFICIAL_APK" >/dev/null
          cat > LT169-RELEASE-NOTES.md <<'NOTES'
          # PokeSearch 0.01.69 — LT169 · Atualização para todos

          - Sprites API ON: catálogo de 1.679 imagens Pokémon GO verificadas por forma/traje, incluindo Flabébé Yellow/Red/Blue/Orange/White; o modo DOM mantém a URL original quando disponível.
          - Nome, forma, Shiny e traje são verificados antes de carregar imagem, evitando trocar uma variante por outra; cache Android validado por hash e reutilizado em ambas Pokébolas.
          - Quando uma sprite realmente não está disponível, exibimos identificação textual discreta no lugar de círculos vazios. A API não fornece a URL do site e algumas artes exigem rede no primeiro carregamento.
          - Home → Menu → Preferências → Privacidade na Home: mostrar/ocultar nome da conta PoGoCoordinates, nome do treinador e código separadamente. Ocultos aparecem Anônimo ou XXXX XXXX XXXX; login e códigos reais não são alterados.
          - Troca de treinador agora usa um pequeno ícone ao lado do título Treinador vinculado, somente com dois ou mais treinadores vinculados distintos.
          - Mantém autenticação, recursos Premium, chat, GL/UL, Shiny, alertas, coordenadas, filtros e duas Pokébolas.
          - APK protegido R8, certificado Android v2 permanente e versionCode 54374.
          - A atualização é anunciada pela lista oficial GitHub Releases. Instalação depende de confirmação do usuário; não é silenciosa.
          NOTES
          gh release create "$OFFICIAL_TAG" "$OFFICIAL_APK" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "PokeSearch 0.01.69 LT169 — atualização oficial" \
            --notes-file LT169-RELEASE-NOTES.md --latest
          printf '%s  %s\n' "$SHA" "$OFFICIAL_APK" > OFFICIAL-SHA256SUMS.txt
      - name: Verify official latest release, APK SHA-256 and update-feed eligibility
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$OFFICIAL_APK" | cut -d ' ' -f1)"
          SIZE="$(stat -c%s "$OFFICIAL_APK")"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/lt169-latest.json"
          jq -e --arg tag "$OFFICIAL_TAG" --arg apk "$OFFICIAL_APK" \
            --arg digest "sha256:$SHA" --argjson size "$SIZE" '
            .tag_name==$tag and .draft==false and .prerelease==false and
            ([.assets[] | select(.name==$apk and .state=="uploaded" and
              .digest==$digest and .size==$size)] | length)==1
          ' "$RUNNER_TEMP/lt169-latest.json"
          echo "LT169 official latest verified: $OFFICIAL_TAG SHA256=$SHA"
      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pokesearch-lt112-signing.p12"
