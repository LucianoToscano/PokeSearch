name: PokeSearch LT170 — duas contas PoGoCoordinates (APK QA assinado)
on:
  push:
    branches: [feature/lt170-dual-pogo-session-slots-20261029]
    paths:
      - '.github/workflows/lt170-dual-accounts-signed-apk-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lt170-dual-accounts-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signed-dual-accounts-qa:
    if: github.repository == 'LucianoToscano/PokeSearch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      POKE_TEST_VERSION_CODE: '54375'
      POKE_TEST_VERSION_LABEL: '51175'
      POKE_TEST_PUBLIC_VERSION: '0.01.70'
      POKE_RELEASE_CERT_SHA256: '34766c15d09013ad65873f9976539c8fa2f826e917dae3af57ea628cad689e8e'
      POKE_RELEASE_STORE_PASSWORD: ${{ secrets.POKE_TEST_STORE_PASSWORD }}
      POKE_RELEASE_KEY_ALIAS: ${{ secrets.POKE_TEST_KEY_ALIAS }}
      POKE_RELEASE_KEY_PASSWORD: ${{ secrets.POKE_TEST_KEY_PASSWORD }}
      POKE_GOOGLE_WEB_CLIENT_ID: ${{ vars.POKE_GOOGLE_WEB_CLIENT_ID }}
      POKE_CONTROLLED_DISTRIBUTION: 'true'
      POKE_SCRAPBOOK_STAGE1_QA: 'true'
      POKE_SCRAPBOOK_QA_ACK: 'stage1-readonly'
      POKE_SCRAPBOOK_ONLINE_QA: 'true'
      POKE_SCRAPBOOK_ONLINE_ACK: 'read-only-moderation-pending'
      POKE_CHAT_GOOGLE_WEB_CLIENT_ID: '1007816617051-abhc4riftns3om8gs0o67ce1s386ue9d.apps.googleusercontent.com'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore permanent keystore (never upload credentials)
        shell: bash
        env:
          POKE_TEST_KEYSTORE_B64: ${{ secrets.POKE_TEST_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for key in POKE_TEST_KEYSTORE_B64 POKE_RELEASE_STORE_PASSWORD POKE_RELEASE_KEY_ALIAS POKE_RELEASE_KEY_PASSWORD; do
            test -n "$(printenv "$key")" || { echo "::error::Missing signing secret"; exit 1; }
          done
          umask 077
          printf '%s' "$POKE_TEST_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pokesearch-lt170-qa.p12"
          chmod 600 "$RUNNER_TEMP/pokesearch-lt170-qa.p12"
          keytool -list -keystore "$RUNNER_TEMP/pokesearch-lt170-qa.p12" -storetype PKCS12 -storepass "$POKE_RELEASE_STORE_PASSWORD" -alias "$POKE_RELEASE_KEY_ALIAS" >/dev/null
          echo "POKE_RELEASE_KEYSTORE=$RUNNER_TEMP/pokesearch-lt170-qa.p12" >> "$GITHUB_ENV"
      - name: Validate complete production Node regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 app/scripts/build_pokemon_card_metadata.py
          for file in app/src/main/assets/*.js; do node --check "$file"; done
          for suite in app/tests/*.test.js; do
            if [ "$suite" = "app/tests/lt74-local-update-preview.test.js" ]; then continue; fi
            echo "::group::$suite"
            node "$suite"
            echo "::endgroup::"
          done
          node app/tests/lt170-dual-pogo-sessions.test.js
          # No test may permit slot 2 to silently use the Default cookie store.
          grep -Fq 'if(!secondSupported())' app/src/main/java/com/lucianotoscano/pokesearchoverlay/PogoAccountSlots.java
          grep -Fq 'PogoAccountSlots.bind(website,accountSlot())' app/src/main/java/com/lucianotoscano/pokesearchoverlay/OverlayService.java
          grep -Fq 'PogoAccountSlots.bind(website,loginAccountSlot)' app/src/main/java/com/lucianotoscano/pokesearchoverlay/MainActivity.java
      - name: Prepare offline original Pokémon GO sprite catalogue
        shell: bash
        run: |
          set -euo pipefail
          python3 app/scripts/update_wwm_catalog.py app/src/main/assets
          python3 app/scripts/build_sprite_bundle.py --workers 12 --minimum-normal 950
          test -s app/src/main/assets/pokemon-sprites/manifest.json
          test -s app/src/main/assets/go-exact-sprites.tsv
      - name: Assemble R8-protected permanently signed LT170 QA APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Verify exact version, cert, integrity and native features
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          OUT='PokeSearch-v0.01.70-LT170-DuasContas-QA.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          test -s app/build/outputs/mapping/release/mapping.txt
          unzip -Z1 "$APK" > APK-ENTRIES.txt
          grep -Fq 'assets/pokemon-sprites/manifest.json' APK-ENTRIES.txt
          grep -Fq 'assets/go-exact-sprites.tsv' APK-ENTRIES.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > PACKAGE-VERSION.txt
          for expected in "name='com.lucianotoscano.pokesearch'" "versionCode='54375'" "versionName='0.01.70'"; do
            grep -Fq "$expected" PACKAGE-VERSION.txt
          done
          ! grep -q '^application-debuggable' PACKAGE-VERSION.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > SIGNING-REPORT.txt
          grep -Eq '^Verified using v2 scheme.*: true$' SIGNING-REPORT.txt
          ACTUAL="$(grep 'Signer #1 certificate SHA-256 digest:' SIGNING-REPORT.txt | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$POKE_RELEASE_CERT_SHA256"
          test -s app/src/main/java/com/lucianotoscano/pokesearchoverlay/PogoAccountSlots.java
          grep -Fq 'WebViewCompat.setProfile(view,PROFILE_TWO)' app/src/main/java/com/lucianotoscano/pokesearchoverlay/PogoAccountSlots.java
          cp "$APK" "$OUT"
          sha256sum "$OUT" > SHA256SUMS.txt
          git rev-parse HEAD > SOURCE_COMMIT.txt
      - name: Upload signed TEST APK — do not update production
        uses: actions/upload-artifact@v4
        with:
          name: PokeSearch-LT170-Dual-Accounts-QA-Signed
          path: |
            PokeSearch-v0.01.70-LT170-DuasContas-QA.apk
            SHA256SUMS.txt
            SIGNING-REPORT.txt
            PACKAGE-VERSION.txt
            SOURCE_COMMIT.txt
            APK-ENTRIES.txt
          if-no-files-found: error
          retention-days: 30
      - name: Destroy signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pokesearch-lt170-qa.p12"
