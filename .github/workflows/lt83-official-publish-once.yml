name: LT83 approved - publish verified GitHub update once
on:
  push:
    branches:
      - fix/lt83-samsung-ui-polish-20261025
    paths:
      - '.github/workflows/lt83-official-publish-once.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: official-release-pokesearch-v0.00.83-54286
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'LucianoToscano/PokeSearch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: official-updates
    env:
      GH_TOKEN: ${{ github.token }}
      QA_RUN: '40159949347'
      QA_ARTIFACT: 'PokeSearch-v0.00.83-LT-Samsung-QA-protected-release'
      EXPECTED_SOURCE: '5cf9adb62efb97a185ec955cab6eb0f49fbb4e88'
      EXPECTED_CERT: '34766c15d09013ad65873f9976539c8fa2f826e917dae3af57ea628cad689e8e'
      PUBLIC_NAME: '0.00.83'
      PUBLIC_CODE: '54286'
      TAG: 'v0.00.83-54286'
    steps:
      - name: Checkout release candidate (do not merge main)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: fix/lt83-samsung-ui-polish-20261025
      - name: Verify approved CI run and artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'LucianoToscano/PokeSearch'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN" --jq '.head_sha')" = "$EXPECTED_SOURCE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Version already published; refusing overwrite."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/verified"
          gh run download "$QA_RUN" --repo "$GITHUB_REPOSITORY" --name "$QA_ARTIFACT" --dir "$RUNNER_TEMP/verified"
          cd "$RUNNER_TEMP/verified"
          test "$(cat SOURCE_COMMIT.txt)" = "$EXPECTED_SOURCE"
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test -s PROTECTION.txt
          APK=PokeSearch-v0.00.83-LT-Samsung-QA.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          grep -Fq "name='com.lucianotoscano.pokesearch'" PACKAGE-VERSION.txt
          grep -Fq "versionCode='$PUBLIC_CODE'" PACKAGE-VERSION.txt
          grep -Fq "versionName='$PUBLIC_NAME'" PACKAGE-VERSION.txt
          ! grep -q '^application-debuggable' PACKAGE-VERSION.txt
          grep -Fxq "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT" SIGNING-REPORT.txt
          grep -Eq '^Verified using v2 scheme.*: true$' SIGNING-REPORT.txt
          cp "$APK" "$RUNNER_TEMP/PokeSearch-v${PUBLIC_NAME}-LT.apk"
          sha256sum "$RUNNER_TEMP/PokeSearch-v${PUBLIC_NAME}-LT.apk" > "$RUNNER_TEMP/PUBLISHED-SHA256SUMS.txt"
      - name: Publish new stable version for LT79 GitHubUpdateCenter
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          PokeSearch 0.00.83 LT — correção crítica de Localização e do painel no Samsung.

          Melhorias:
          - Janela flutuante de Localização com largura nativa estável, sem encolher após digitação, teclado ou atualizações do WebView.
          - Coordenadas em linha ampla e centralizada; botão Colar ↑, campo km, Aplicar e Limpar integralmente dentro das bordas.
          - Ajuste do reconhecimento do formulário oficial Coords/Radius na interface móvel: aceita rótulos Coords/Coordinates e estados de React sem aria-selected apenas quando o par único de campos oficiais está visível.
          - Evita clicar repetidamente em Coords a cada tentativa, o que pode reiniciar os campos controlados pelo React.
          - Mantém verificação EXATA de latitude, longitude, raio e modo Coords antes de enviar a pesquisa; não inventa resultados nem aceita Area divergente.
          - Clima, Favoritos, notificações, modo PvP, IV, Shiny, personalização, Get coords e demais recursos foram preservados.
          - APK release R8, não depurável, com assinatura permanente e SHA-256 verificados.

          A atualização é distribuída pelo GitHub Releases ao PokeSearch LT79 ou superior que já usa GitHubUpdateCenter. O Android pede confirmação do usuário para instalar.
          O manifesto público legado Google Drive segue oferecendo LT79 para migração de versões antigas.
          CI automatizado e validação de assinatura foram aprovados. A validação MANUAL da correção de localização no Samsung após instalar LT83 ainda está pendente e não é alegada como concluída.
          SOURCE_COMMIT do APK: 5cf9adb62efb97a185ec955cab6eb0f49fbb4e88.
          NOTES
          gh release create "$TAG" "$RUNNER_TEMP/PokeSearch-v${PUBLIC_NAME}-LT.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$EXPECTED_SOURCE" \
            --title "PokeSearch 0.00.83 LT" --notes-file "$RUNNER_TEMP/notes.md" --latest
      - name: Verify GitHub Release metadata and asset digest
        shell: bash
        run: |
          set -euo pipefail
          ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')"
          test -n "$ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '.draft')" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq '.prerelease')" = false
          APKNAME="PokeSearch-v${PUBLIC_NAME}-LT.apk"
          ASSET="$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --jq ".[] | select(.name==\"$APKNAME\") | .id")"
          test -n "$ASSET"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET" --jq '.state')" = uploaded
          DIGEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET" --jq '.digest')"
          SHA="$(cut -d' ' -f1 "$RUNNER_TEMP/PUBLISHED-SHA256SUMS.txt")"
          test "$DIGEST" = "sha256:$SHA"
          echo "Official update available for LT79 and LT80: $TAG / $APKNAME"
