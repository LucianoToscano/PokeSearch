name: PokeSearch LT88 R7 Drive Home sharing safe Guia Mestre append
on:
  push:
    branches: [feature/lt88-lt93-evolution-20261025]
    paths:
      - 'docs/LT88_DRIVE_SHARE_R7_QA.md'
      - '.github/workflows/lt88-guide-append-safe.yml'
permissions:
  contents: write
concurrency:
  group: lt88-guide-append-${{ github.ref }}
  cancel-in-progress: false
jobs:
  append-guide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
      - name: Append without replacing entire historical Guia
        shell: bash
        run: |
          set -euo pipefail
          GUIDE=docs/GUIA_MESTRE.md
          MARKER='LT88 R7 — Compartilhamento Android e espelho Drive'
          test -f "$GUIDE"
          BEFORE="$(wc -c < "$GUIDE")"
          test "$BEFORE" -gt 1400000
          FIRST_SHA="$(sha256sum "$GUIDE" | awk '{print $1}')"
          if grep -Fq "$MARKER" "$GUIDE"; then
            echo "Already appended; no rewrite."
            exit 0
          fi
          {
            echo
            echo
            echo "## $MARKER (25/10/2026)"
            echo "- PR #63 Draft, branch feature/lt88-lt93-evolution-20261025; main continua LT87 oficial e nenhuma Release nova foi publicada."
            echo "- APK R6 0.00.93/54296 assinado e íntegro: SHA256 5144922c0f714d77af70c0bedf596d56fb2a8f3e7e140364715502b543cf68de, SOURCE_COMMIT ce71860a5266e01c7a56505b15bbc3bd7af80d76; CI #40185260932 SUCCESS."
            echo "- Owner criou Google Drive PokeSearch_App: folder 1fVw93qUDE0YWp6tlJZaNjRmymyhEAUbR. O mesmo R6 foi enviado ao arquivo 1XXKGy3AjtDx4uMnt2N4Wd3FVNV0Qn_5P; metadados Google confirmaram 38629615 bytes."
            echo "- Home ganha botão visível Compartilhar app e item lateral, Android Sharesheet ACTION_SEND texto, link direto do APK Drive sem exibir link GitHub, credentials, arquivo privado ou bypass de API."
            echo "- Próximas atualizações autorizadas devem substituir o mesmo arquivo Drive após verificar APK SHA256/assinatura/versão; ID e link permanecem estáveis, sem merge nem Release automáticos."
            echo "- Candidato R7 0.00.94/54297 é somente QA: CI assinado e Samsung ainda devem ser comprovados. Nenhum teste físico Samsung foi executado pelo CI."
            echo "- Detalhes e checklist: docs/LT88_DRIVE_SHARE_R7_QA.md. Fluxos LT88-LT93 históricos e R6 preservados. Guia Mestre apendado com verificação de hash integral do prefixo."
          } >> "$GUIDE"
          AFTER="$(wc -c < "$GUIDE")"
          test "$AFTER" -gt "$BEFORE"
          PREFIX_SHA="$(head -c "$BEFORE" "$GUIDE" | sha256sum | awk '{print $1}')"
          test "$PREFIX_SHA" = "$FIRST_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$GUIDE"
          git commit -m 'docs(LT88 R7): protected append stable Drive sharing with SHA256'
          git fetch origin "refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
