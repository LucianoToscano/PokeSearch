name: PokeSearch LT88 R2 safe Guia Mestre append
on:
  push:
    branches: [feature/lt88-lt93-evolution-20261025]
    paths:
      - 'docs/LT88_SAMSUNG_R2_QA.md'
      - '.github/workflows/lt88-guide-append-safe.yml'
permissions:
  contents: write
concurrency:
  group: lt88-guide-append-${{ github.ref }}
  cancel-in-progress: false
jobs:
  append-guide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
      - name: Append without replacing entire historical Guia
        shell: bash
        run: |
          set -euo pipefail
          GUIDE=docs/GUIA_MESTRE.md
          MARKER='LT88 Samsung R2 QA — retornos físicos e correções'
          test -f "$GUIDE"
          BEFORE="$(wc -c < "$GUIDE")"
          test "$BEFORE" -gt 1400000
          FIRST_SHA="$(sha256sum "$GUIDE" | awk '{print $1}')"
          if grep -Fq "$MARKER" "$GUIDE"; then
            echo "Already appended; no rewrite."
            exit 0
          fi
          {
            echo
            echo
            echo "## $MARKER (25/10/2026)"
            echo "- main oficial LT87/54290 sem alterações; PR #63 Draft permanece sem merge e sem Release."
            echo "- Evidência Samsung LT88/54291: Modos/Filtros transparentes, Colar sem sucesso, ausência de Copiar, formulário perfis salvo sobreposto, sprites NORMAL incompletas, IV/PvP e cronômetro somem em parte das ordenações."
            echo "- Correção R2: fundos sólidos no rail/editor Modos/Filtros, lista salva em flyout lateral compacta Filtro 1–3 (toque usar, segure salvar, × excluir), sem áreas vazias."
            echo "- Favoritos: somente perfil ativo acende; segurar oferece Salvar/Excluir. Localização: Colar aceita texto único ou link válido, Copiar explícito, locais salvos com estrela ativa, ajuda e exclusão."
            echo "- Sprites NORMAL do catálogo verificadas; formas especiais sem correspondência continuam placeholder. Em detalhes: IV A/D/S + IV% verificados, cronômetro sem o rótulo Despawn."
            echo "- Ordenação Distância: metadados reaproveitados somente para encontro idêntico ainda ativo, com mesmo timestamp absoluto, jamais inventando IV/rank."
            echo "- Build de QA candidato 0.00.89/54292, versão numérica não representa LT89 totalmente concluída. Ver docs/LT88_SAMSUNG_R2_QA.md."
            echo "- CI automatizado, instalação física Samsung e interoperabilidade clipboard precisam de comprovação separada; sem PASS físico presumido."
            echo "- Guia anterior preservado integralmente pelo hash do prefixo; só append."
          } >> "$GUIDE"
          AFTER="$(wc -c < "$GUIDE")"
          test "$AFTER" -gt "$BEFORE"
          PREFIX_SHA="$(head -c "$BEFORE" "$GUIDE" | sha256sum | awk '{print $1}')"
          test "$PREFIX_SHA" = "$FIRST_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$GUIDE"
          git commit -m 'docs(LT88 R2 QA): safely append Samsung proof without altering Guide history'
          git fetch origin "refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
