name: PokeSearch LT88 unified menus safe Guia Mestre append
on:
  push:
    branches: [feature/lt88-lt93-evolution-20261025]
    paths:
      - 'docs/LT88_UNIFIED_MENUS_QA.md'
      - '.github/workflows/lt88-guide-append-safe.yml'
permissions:
  contents: write
concurrency:
  group: lt88-guide-append-${{ github.ref }}
  cancel-in-progress: false
jobs:
  append-guide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
      - name: Append without replacing entire historical Guia
        shell: bash
        run: |
          set -euo pipefail
          GUIDE=docs/GUIA_MESTRE.md
          MARKER='LT88 UI Unificada — 50% Transparência e Blur'
          test -f "$GUIDE"
          BEFORE="$(wc -c < "$GUIDE")"
          test "$BEFORE" -gt 1400000
          FIRST_SHA="$(sha256sum "$GUIDE" | awk '{print $1}')"
          if grep -Fq "$MARKER" "$GUIDE"; then
            echo "Already appended; no rewrite."
            exit 0
          fi
          {
            echo
            echo
            echo "## $MARKER (25/10/2026)"
            echo "- Evidência Samsung: Filtros, Modos, Localização, Favoritos e Pokémon exibiam cores/alphas distintos; Copiar/Colar estavam no cabeçalho ao lado do título."
            echo "- Branch PR #63 Draft: uma única base visual para superfícies dos menus e submenus; invólucro popup externo transparente preserva pass-through e não cria espaços vazios."
            echo "- Transparência inicial 50%, tema claro/escuro e controle menuBlur 0–16 px no Editor Visual. Preferências antigas não são apagadas."
            echo "- Fundo compartilhado via --visual-menu-bg, menu-border e backdrop-filter opcional, com fallback nos Android System WebView que não desfocam outras janelas."
            echo "- Favoritos nativo acompanha tema/alpha e blur quando disponível. Copiar/Colar reposicionados na linha operacional de Localização, junto ao raio."
            echo "- QA candidato 0.00.90/54293 (numeração não significa LT90 funcional completo). Validar SHA-256, assinatura APK v2, certificado, testes Node/Java/R8 antes da entrega."
            echo "- Samsung PASS físico continua pendente: 0/50/100% alpha, blur ON/OFF, clique fora, menus, temas, campos e touch pass-through."
            echo "- Detalhes e estratégia de rollback em docs/LT88_UNIFIED_MENUS_QA.md; main oficial LT87 preservada sem merge/Release."
            echo "- Conteúdo anterior do Guia Mestre validado por hash de prefixo; somente append."
          } >> "$GUIDE"
          AFTER="$(wc -c < "$GUIDE")"
          test "$AFTER" -gt "$BEFORE"
          PREFIX_SHA="$(head -c "$BEFORE" "$GUIDE" | sha256sum | awk '{print $1}')"
          test "$PREFIX_SHA" = "$FIRST_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$GUIDE"
          git commit -m 'docs(LT88): append unified menu design with prefix checksum protected'
          git fetch origin "refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
