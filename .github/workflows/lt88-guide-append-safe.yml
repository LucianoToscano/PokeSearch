name: PokeSearch LT88 Floating Menus R5 safe Guia Mestre append
on:
  push:
    branches: [feature/lt88-lt93-evolution-20261025]
    paths:
      - 'docs/LT88_FLOATING_MENUS_R5_QA.md'
      - '.github/workflows/lt88-guide-append-safe.yml'
permissions:
  contents: write
concurrency:
  group: lt88-guide-append-${{ github.ref }}
  cancel-in-progress: false
jobs:
  append-guide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
      - name: Append without replacing entire historical Guia
        shell: bash
        run: |
          set -euo pipefail
          GUIDE=docs/GUIA_MESTRE.md
          MARKER='LT88 R5 — perfis Padrão, menu som Pix e Favoritos'
          test -f "$GUIDE"
          BEFORE="$(wc -c < "$GUIDE")"
          test "$BEFORE" -gt 1400000
          FIRST_SHA="$(sha256sum "$GUIDE" | awk '{print $1}')"
          if grep -Fq "$MARKER" "$GUIDE"; then
            echo "Already appended; no rewrite."
            exit 0
          fi
          {
            echo
            echo
            echo "## $MARKER (25/10/2026)"
            echo "- Origem: branch feature/lt88-lt93-evolution-20261025, PR #63 Draft, main LT87 oficial preservada."
            echo "- UI Filtros: ⊙ abre Padrão (sem ícone e X) e Perfis 1–3 com toque para usar, 💾 salvar e × excluir; sem long press."
            echo "- Padrão zera campos e restrições IV por pesquisa neutra 0–100%, preserva Shiny e localização. Usar perfil fecha somente lista de salvos."
            echo "- Localização não mostra mais Nome do local, locais 1–3 nem botão ?. Dados já persistidos preservados. Campos, Copiar/Colar, raio e ações mantidos."
            echo "- Favoritos dialog nativo posiciona acima/abaixo do menu flutuante, mantendo não modal."
            echo "- Notificações: som de Novos/Favoritos abre diálogo overlay, lista 36 áudios e Padrão; tocar ouve, ✓ confirma, fechar interrompe prévia; não volta à Home."
            echo "- Pix: diálogo overlay com mesmo tema/alpha/blur, QR original não alterado e opção explícita de copiar; sem redirecionamento Home."
            echo "- Importação de áudio continua no fluxo legado; não habilitada no novo selector overlay sem workflow de arquivos homologado."
            echo "- APK QA candidato 0.00.92/54295; testes e assinatura devem ser conferidos, sem PASS físico presumido."
            echo "- Docs: docs/LT88_FLOATING_MENUS_R5_QA.md. Guia Mestre anterior validado por hash de prefixo, somente append."
          } >> "$GUIDE"
          AFTER="$(wc -c < "$GUIDE")"
          test "$AFTER" -gt "$BEFORE"
          PREFIX_SHA="$(head -c "$BEFORE" "$GUIDE" | sha256sum | awk '{print $1}')"
          test "$PREFIX_SHA" = "$FIRST_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$GUIDE"
          git commit -m 'docs(LT88 R5): protected append of saved profiles and overlay menus'
          git fetch origin "refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
