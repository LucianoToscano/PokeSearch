name: PokeSearch LT88 Samsung R3 safe Guia Mestre append
on:
  push:
    branches: [feature/lt88-lt93-evolution-20261025]
    paths:
      - 'docs/LT88_SAMSUNG_LEGIBILITY_R3_QA.md'
      - '.github/workflows/lt88-guide-append-safe.yml'
permissions:
  contents: write
concurrency:
  group: lt88-guide-append-${{ github.ref }}
  cancel-in-progress: false
jobs:
  append-guide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
      - name: Append without replacing entire historical Guia
        shell: bash
        run: |
          set -euo pipefail
          GUIDE=docs/GUIA_MESTRE.md
          MARKER='LT88 Samsung R3 — contraste legível Filtros e Modos'
          test -f "$GUIDE"
          BEFORE="$(wc -c < "$GUIDE")"
          test "$BEFORE" -gt 1400000
          FIRST_SHA="$(sha256sum "$GUIDE" | awk '{print $1}')"
          if grep -Fq "$MARKER" "$GUIDE"; then
            echo "Already appended; no rewrite."
            exit 0
          fi
          {
            echo
            echo
            echo "## $MARKER (25/10/2026)"
            echo "- Três capturas Samsung 0.00.90/54293 comprovam regressão: Filtros Nível e Forma (00–04), Modos IV% seguem transparentes sobre papel de parede. QA visual antigo NÃO passou."
            echo "- Causa: backdrop-filter no WebView de overlay não consegue garantir blur de outra janela; 50% alpha puro não oferece leitura estável."
            echo "- Correção: preservar transparência BASE inicial 50%, menuBlur padrão 4 px, temas/preferências anteriores; criar camada de legibilidade derivada do MESMO controle (alpha final=1-(transparência/100)^2.8)."
            echo "- Em 50% BASE a superfície de leitura fica cerca de 86% opaca; 100% transparência mantém opacidade 0. O Editor Visual explica claramente essa diferença."
            echo "- CSS aplica fundo padronizado aos rail/editor de Filtros/Modos, listas Forma/Ordenar/Clima, inputs e Favoritos nativos. Não alargar janelas nem bloquear toques atrás."
            echo "- QA candidato 0.00.91/54294; numeração NÃO significa LT91 roadmap concluída. Autenticação/API/token/assinatura preservados."
            echo "- Provas de build e Samsung separadas; teste físico R3 pendente, confira docs/LT88_SAMSUNG_LEGIBILITY_R3_QA.md."
            echo "- A main LT87 continua preservada, PR #63 Draft, sem merge, sem Release."
            echo "- Guia anterior preservado com verificação SHA-256 de todo prefixo após append."
          } >> "$GUIDE"
          AFTER="$(wc -c < "$GUIDE")"
          test "$AFTER" -gt "$BEFORE"
          PREFIX_SHA="$(head -c "$BEFORE" "$GUIDE" | sha256sum | awk '{print $1}')"
          test "$PREFIX_SHA" = "$FIRST_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$GUIDE"
          git commit -m 'docs(LT88 R3): safely append legibility audit with prefix SHA256 protection'
          git fetch origin "refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
