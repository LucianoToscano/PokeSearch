name: PokeSearch LT88 R6 Favorites Sprites safe Guia Mestre append
on:
  push:
    branches: [feature/lt88-lt93-evolution-20261025]
    paths:
      - 'docs/LT88_FAVORITOS_SPRITES_SAMSUNG_R6_QA.md'
      - '.github/workflows/lt88-guide-append-safe.yml'
permissions:
  contents: write
concurrency:
  group: lt88-guide-append-${{ github.ref }}
  cancel-in-progress: false
jobs:
  append-guide:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
      - name: Append without replacing entire historical Guia
        shell: bash
        run: |
          set -euo pipefail
          GUIDE=docs/GUIA_MESTRE.md
          MARKER='LT88 R6 — Favoritos automáticos e sprites verificadas'
          test -f "$GUIDE"
          BEFORE="$(wc -c < "$GUIDE")"
          test "$BEFORE" -gt 1400000
          FIRST_SHA="$(sha256sum "$GUIDE" | awk '{print $1}')"
          if grep -Fq "$MARKER" "$GUIDE"; then
            echo "Already appended; no rewrite."
            exit 0
          fi
          {
            echo
            echo
            echo "## $MARKER (25/10/2026)"
            echo "- Branch feature/lt88-lt93-evolution-20261025, PR #63 Draft. Main LT87 oficial intacta; usuário já distribuiu APK anterior, sem Release nova autorizada."
            echo "- Favoritos: apenas estrela do perfil ativo acesa; toque ativa/cria slot; seleção é salva automaticamente inclusive por WatchAlerts.toggle fora do seletor, no mesmo commit SharedPreferences."
            echo "- Segurar estrela de perfil salvo permite limpar todos daquele slot após confirmação; somente lista ativa é limpa quando aplicável. Outros slots preservados."
            echo "- Sprites: cache nativo compartilhado app-private e cache WebView, apenas URLs exatas de base PokeAPI e Shiny; arquivos distintos por variante, CDN fallback, timeouts, PNG até 256KiB, dimensões limitadas e cooldown 60s."
            echo "- Menu Pokémon tenta CDN alternativo para base carregada com dimensões inválidas; resultados preservam retry da URL originalmente observada, sem substituir formas ou trajes."
            echo "- Menus de som/Pix flutuantes e perfis de filtros/Padrão da R5 preservados. Nenhum GPS físico, nenhuma mudança de tokens ou limites da API."
            echo "- APK QA candidato 0.00.93/54296, assinatura persistente e testes a validar; não alegar PASS Samsung sem evidência física desta build."
            echo "- Checkpoint completo em docs/LT88_FAVORITOS_SPRITES_SAMSUNG_R6_QA.md. LT89–LT93 pendentes."
            echo "- Guia Mestre anterior preservado via SHA-256 do prefixo; atualização por append apenas."
          } >> "$GUIDE"
          AFTER="$(wc -c < "$GUIDE")"
          test "$AFTER" -gt "$BEFORE"
          PREFIX_SHA="$(head -c "$BEFORE" "$GUIDE" | sha256sum | awk '{print $1}')"
          test "$PREFIX_SHA" = "$FIRST_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$GUIDE"
          git commit -m 'docs(LT88 R6): protected append Favorites and verified sprites with SHA256'
          git fetch origin "refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
