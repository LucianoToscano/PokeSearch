name: PokeSearch LT146 official approved public release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lt146-official-approved-release.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: pokesearch-approved-public-release
  cancel-in-progress: false
jobs:
  publish-approved-lt146:
    if: github.repository == 'LucianoToscano/PokeSearch' && github.actor == 'LucianoToscano'
    runs-on: ubuntu-24.04
    environment:
      name: official-updates
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      QA_RUN: '40812379653'
      QA_ARTIFACT: 'PokeSearch-v0.01.46-LT146-UpdateNotice-QA-Assinado'
      QA_SOURCE: 'f2e3d4521738748a11f77ebbc1887c354d03ff55'
      QA_APK: 'PokeSearch-v0.01.46-LT-QA.apk'
      OFFICIAL_APK: 'PokeSearch-v0.01.46-LT.apk'
      EXPECT_SHA256: 'eb1813879c4f7713116c9878777b7393ab7bf3468b92e90143f24c7a079c45ab'
      EXPECT_CERT: '34766c15d09013ad65873f9976539c8fa2f826e917dae3af57ea628cad689e8e'
      TAG: 'v0.01.46-54351'
    steps:
      - name: Checkout official merged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert signed LT146 QA source and ensure no duplicate official release
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$QA_SOURCE" HEAD || { echo "::error::QA22 source not in main"; exit 1; }
          test "$(gh run view "$QA_RUN" -R "$GITHUB_REPOSITORY" --json conclusion,headSha --jq '.conclusion+" "+.headSha')" = "success $QA_SOURCE"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Official release already exists; do not overwrite an immutable signed APK"; exit 1
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" != "$TAG"
      - name: Download exact previously signed QA22 artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lt146"
          gh run download "$QA_RUN" -R "$GITHUB_REPOSITORY" --name "$QA_ARTIFACT" --dir "$RUNNER_TEMP/lt146"
          cd "$RUNNER_TEMP/lt146"
          test -s "$QA_APK"
          test "$(tr -d '\r\n' < SOURCE_COMMIT.txt)" = "$QA_SOURCE"
          sha256sum --check SHA256SUMS.txt
          test "$(sha256sum "$QA_APK" | cut -d' ' -f1)" = "$EXPECT_SHA256"
          unzip -t "$QA_APK" >/dev/null
          cp "$QA_APK" "$OFFICIAL_APK"
          test "$(sha256sum "$OFFICIAL_APK" | cut -d' ' -f1)" = "$EXPECT_SHA256"
      - name: Verify Android package version and permanent signer independently
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install 'build-tools;36.0.0'
          APK="$RUNNER_TEMP/lt146/$OFFICIAL_APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "name='com.lucianotoscano.pokesearch'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionCode='54351'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionName='0.01.46'" "$RUNNER_TEMP/badging.txt"
          ! grep -q '^application-debuggable' "$RUNNER_TEMP/badging.txt"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signing.txt"
          grep -Eq '^Verified using v2 scheme.*: true$' "$RUNNER_TEMP/signing.txt"
          ACTUAL="$(grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/signing.txt" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECT_CERT"
      - name: Publish official latest release to every PokeSearch GitHub updater
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lt146"
          cat > RELEASE-NOTES.txt <<'NOTES'
          PokeSearch 0.01.46 — LT146, atualização oficial para todos
          
          - Atualização detectável por quem instalou LT145 e qualquer QA com versionCode 54350: novo versionCode 54351.
          - Card de vidro compacto da QA22: elimina espaços vazios, mantém informações legíveis e só permite rolagem quando necessária.
          - IV, PC e Nv. alinhados; Rank PvP em selo destacado; sexo, tamanho e forma independentes.
          - Sprites proporcionais, Gengar Halloween ajustado e fallback fiel quando não existir imagem da variante.
          - Despawn abaixo da estrela e botão vermelho Pegar Coordenadas preservados.
          - Duas Pokébolas, Premium, favoritos, localização, alertas e integrações existentes preservados.
          - Assinatura v2 permanente, proteção R8 e integridade SHA-256 verificadas.
          - O aviso de atualização depende de internet e permissões do Android; a instalação requer confirmação do usuário.
          NOTES
          gh release create "$TAG" "$OFFICIAL_APK" \
            --repo "$GITHUB_REPOSITORY" --target "$QA_SOURCE" \
            --title "PokeSearch 0.01.46 LT146 — Atualização oficial" \
            --notes-file RELEASE-NOTES.txt --latest
      - name: Verify official latest update feed and immutable APK digest
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/latest.json"
          jq -e --arg tag "$TAG" --arg name "$OFFICIAL_APK" --arg digest "sha256:$EXPECT_SHA256" '
            .tag_name == $tag and .prerelease == false and .draft == false and
            ([.assets[] | select(.name==$name and .state=="uploaded" and .digest==$digest and .size>30000000)] | length)==1
          ' "$RUNNER_TEMP/latest.json" >/dev/null
          echo "OFFICIAL LT146 GLOBAL UPDATE ENABLED: $TAG"
